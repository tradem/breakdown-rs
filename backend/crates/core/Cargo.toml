[package]
name = "breakdown_core"
version = "0.9.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
# Dummy feature to satisfy cargo-mutants global `features = ["infra/test-support"]`
# in .cargo/mutants.toml. The feature is unused in core but cargo-mutants applies
# it to all packages; without it, the unmutated baseline for core-only shards
# fails with "does not contain this feature" (issue #267, shard-2 bug).
test-support = []

[dependencies]
# Domain-Modell: keine sqlx, kein axum, keine Infrastruktur
serde.workspace = true
uuid.workspace = true
chrono.workspace = true
thiserror.workspace = true

# Event Sourcing (Actor-Framework)
kameo.workspace = true
kameo_es.workspace = true

# Domain-Modell: Rustische Decimals
rust_decimal.workspace = true

# OpenAPI schema derives für Read-Model DTOs (ADR-006)
utoipa.workspace = true

# Async traits für Ports (object-safe, mockierbar)
async-trait.workspace = true
zeroize.workspace = true
subtle = "2.6"

# JSON-Werte für die generische Audit/Journal-Projektion (core::audit)
serde_json.workspace = true

# Tests
rstest = "0.26"
proptest = "1.6"

[dev-dependencies]
test_support = { path = "../test_support", version = "0.3.0" }
serde_json.workspace = true

[lints]
workspace = true

# ADR-020 D5: core is a release crate (per-crate tag core-vX.Y.Z).
[package.metadata.release]
release = true
tag-name = "core-v{{version}}"
