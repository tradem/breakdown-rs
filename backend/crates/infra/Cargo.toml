[package]
name = "infra"
version = "0.55.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
# `breakdown_core/test-support` carries the gated `AiImportQueue::seed_succeeded`
# storage seam (issue #748) the Pg adapter overrides below; enabling the infra
# gate therefore implies the core one, so the override can never reference a
# method that does not exist.
test-support = ["breakdown_core/test-support"]

# The vault integration test uses VaultClient::for_test, which is gated
# behind the test-support feature; run infra tests with
# `--features test-support` (CI does this explicitly) so the target is built.
[[test]]
name = "vault"
required-features = ["test-support"]

[dependencies]
# Core-Domäne
breakdown_core = { path = "../core", version = "0.46.0" }

# JSON Schema for provider response_format constraints (ADR-013).
schemars.workspace = true
# Native CSV schedule parsing (ADR-013).
csv.workspace = true

# Event Sourcing & Actor
kameo.workspace = true
kameo_es.workspace = true

# Datenbank
sqlx.workspace = true

# SierraDB / RESP3 Verbindung
redis.workspace = true
sierradb-client.workspace = true

# Serialisierung / IDs / Zeit
serde.workspace = true
ciborium = "0.2"
serde_json.workspace = true
uuid.workspace = true
chrono.workspace = true
thiserror.workspace = true
rust_decimal.workspace = true

# TOML parsing for the configurable default costume-category seed (ADR).
toml = "1.1"

# S3-compatible object storage via OpenDAL (Garage adapter).
# services-gdrive: report archival external provider (ADR-022 D6 spike).
opendal = { version = "0.59", features = ["services-s3", "services-gdrive"] }

# HTTP client used to pin the step-ca root CA on the https:// Garage/Caddy
# endpoint (ADR-024 / issue #156). Same version + TLS backend as OpenDAL's
# reqwest (feature-unified via Cargo); `stream` is required by the
# PinnedRootTransport in `tls.rs`, which feeds reqwest's byte stream into
# OpenDAL's `HttpBody` (opendal 0.58 per-operator HTTP transport).
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
# Typed URL hosts for the AI provider redirect policy (issue #170).
url.workspace = true

# HTTP types shared with the opendal HttpTransport trait signature.
http = "1"

# SHA-256 content digests for report archival staging/retry verification.
sha2 = "0.11"

# Image decoding, re-encoding, and EXIF-stripping (thumbnailing saga).
image = { version = "0.25", features = ["jpeg", "png", "webp"] }

# EXIF reading (orientation detection for the thumbnail saga).
kamadak-exif = "0.6.1"

# Async runtime helpers (background projection streams)
tokio.workspace = true

# Stream utilities (Lister.next() for opendal, etc.)
futures = "0.3"

# Logging
tracing.workspace = true

# Error handling
anyhow.workspace = true

# Async traits (object-safe, mockable ports)
async-trait.workspace = true
zeroize.workspace = true
aes-gcm.workspace = true
base64.workspace = true
getrandom.workspace = true

# Random jitter for backoff
rand.workspace = true
fastrand = "2"

# PDF rendering via in-process Typst (ADR-022, pinned + lockstep)
typst = { version = "=0.15.1", default-features = false }
typst-pdf = { version = "=0.15.1", default-features = false }
typst-layout = { version = "=0.15.1", default-features = false }

# Embedded font assets
rust-embed = "8"

[dev-dependencies]
# Bundled fonts (`fonts` feature) so the report-template render tests exercise
# real row data deterministically on every host instead of being skipped by a
# font probe on fontless CI/dev machines (issue #764). Unused by production
# code — the renderer loads system fonts there (issue #642).
typst-assets = { version = "0.15.1", features = ["fonts"] }
# Pricing-refresh worker parser tests spin local HTTP doubles (issue #675).
wiremock.workspace = true
# `test-util` provides tokio's paused clock (`start_paused`, `time::advance`),
# which lets the lease-heartbeat tests drive renewal ticks instantly instead of
# sleeping out a real interval (deterministic tests, AGENTS.md §4).
tokio = { workspace = true, features = ["macros", "rt", "test-util"] }

[lints]
workspace = true

# ADR-020 D5: infra is a release crate (per-crate tag infra-vX.Y.Z).
[package.metadata.release]
release = true
tag-name = "infra-v{{version}}"
