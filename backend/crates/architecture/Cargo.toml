# Architecture tests expressing hexagonal-boundary rules (ADR-017).
# Replaces the defunct arch_test-based guardrail (Issue #27).

[package]
name = "architecture_tests"
version = "0.3.2"
edition.workspace = true
license.workspace = true
publish = false
rust-version.workspace = true

[features]
# Dummy feature to satisfy cargo-mutants global `features = ["test-support"]`
# in .cargo/mutants.toml (issue #267).
test-support = []

# This crate has no runtime code (`src/lib.rs` is a comment block only): the
# single test target is what links anything, so every crate it uses belongs in
# `[dev-dependencies]` (cargo 1.100's `unused_dependencies` lint, issue #995).
# `api`, `infra` and `breakdown_core` used to sit in `[dependencies]` but no
# target referenced them — the boundary checks read those manifests as text
# (`toml` + `rust_arkitect`'s project scan), they never link the crates.
[dev-dependencies]
rust_arkitect = "0.3.7"
toml = "1.1"

[lints]
workspace = true
