[package]
name = "api"
version = "0.3.0"
edition.workspace = true
license.workspace = true

[dependencies]
# Domäne & Infrastruktur
breakdown_core = { path = "../core", version = "0.3.0" }
infra = { path = "../infra", version = "0.3.0" }

# Web-Framework
axum.workspace = true
tokio.workspace = true

# Serialisierung / IDs / Zeit
serde.workspace = true
serde_json.workspace = true
sqlx.workspace = true
uuid.workspace = true
chrono.workspace = true
thiserror.workspace = true

# Actor / ES
kameo.workspace = true
kameo_es.workspace = true
redis.workspace = true

# OpenAPI (ADR-006)
utoipa.workspace = true
utoipa-swagger-ui.workspace = true

# OIDC / JWT validation (Decision D1)
# Select the RustCrypto backend explicitly; v11 otherwise panics when JWTs are verified.
jsonwebtoken = { version = "11", features = ["rust_crypto"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
base64 = "0.23"
sha2 = "0.10"
async-trait.workspace = true

# Logging / Tracing
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true

# OpenTelemetry / Observability
tracing-opentelemetry.workspace = true
opentelemetry.workspace = true
opentelemetry-otlp.workspace = true
opentelemetry_sdk.workspace = true
tower-http.workspace = true

[dev-dependencies]
# `test-util` enables deterministic Tokio clock control for cache-expiry tests.
tokio = { workspace = true, features = ["test-util"] }
rsa = "0.9"
rand_core = "0.6"
hyper = { version = "1", features = ["server", "http1"] }
http-body-util = "0.1"
tower = "0.5"

[lints]
workspace = true
