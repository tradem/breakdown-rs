[package]
name = "api"
version = "0.8.1"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
# Dummy feature to satisfy cargo-mutants global `features = ["test-support"]`
# in .cargo/mutants.toml (issue #267).
test-support = []

[dependencies]
# Domäne & Infrastruktur
breakdown_core = { path = "../core", version = "0.9.0" }
infra = { path = "../infra", version = "0.14.0" }

# Web-Framework
axum.workspace = true
tokio.workspace = true

# Serialisierung / IDs / Zeit
serde.workspace = true
serde_json.workspace = true
sqlx.workspace = true
uuid.workspace = true
chrono.workspace = true
thiserror.workspace = true

# Actor / ES
kameo.workspace = true
kameo_es.workspace = true
redis.workspace = true

# OpenAPI (ADR-006)
utoipa.workspace = true
utoipa-swagger-ui.workspace = true

# OIDC / JWT validation (Decision D1)
# Select the RustCrypto backend explicitly; v11 otherwise panics when JWTs are verified.
jsonwebtoken = { version = "11", features = ["rust_crypto"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
base64 = "0.23"
sha2 = "0.11"
async-trait.workspace = true

# Logging / Tracing
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true

# Middleware composition (Router::layer order in app_router; ADR-021).
tower = "0.5"

# RFC 8594 Sunset HTTP-date validation (versioning.rs).
httpdate = "1"

# OpenTelemetry / Observability
tracing-opentelemetry.workspace = true
opentelemetry.workspace = true
opentelemetry-otlp.workspace = true
opentelemetry_sdk.workspace = true
tower-http.workspace = true
http-body-util = "0.1"
indexmap = "2"

# Server-side `detail` localization (ADR-031 D5, Tranche 3). `fluent` is the
# umbrella crate; `fluent-bundle` drives the message bundles. `accept-language`
# parses q-valued `Accept-Language` headers; `unic-langid` models locales.
# Core stays dependency-free — only the api crate touches i18n.
fluent = "0.17"
fluent-bundle = "0.16"
unic-langid = "0.9"
accept-language = "3"

[dev-dependencies]
# `test-util` enables deterministic Tokio clock control for cache-expiry tests.
tokio = { workspace = true, features = ["test-util"] }
# OpenAPI drift check (issue #29): render the utoipa-generated doc as YAML to
# compare against the checked-in review artifact `openapi.yaml`. Tests only.
serde_yaml = "0.9"
rsa = "0.9"
hyper = { version = "1", features = ["server", "http1"] }
tower = "0.5"
# Coverage lint parses the FTL bundles (tests only).
fluent-syntax = "0.12"

[lints]
workspace = true

# ADR-020 D5: api is a release crate (per-crate tag api-vX.Y.Z).
[package.metadata.release]
release = true
tag-name = "api-v{{version}}"
