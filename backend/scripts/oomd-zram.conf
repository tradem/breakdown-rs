#
# systemd-oomd drop-in for dev machines whose swap is zram (compressed RAM).
#
# Install with:
#   sudo install -Dm644 backend/scripts/oomd-zram.conf \
#     /etc/systemd/oomd.conf.d/50-zram.conf && sudo systemctl restart systemd-oomd
#
# Why: systemd-oomd's default SwapUsedLimit=90% fires on *normal* zram
# occupancy, because a zram device is RAM, not disk. And a terminal emulator's
# whole process tree (shell + cargo + the API + the editor) shares ONE cgroup,
# so oomd kills cosmic-term along with everything in it. Observed on the 15 GB
# dev box on 2026-11-05 and three times on 2026-11-11 (11:17, 11:56, 12:46;
# 9.4-11.5 GB peaks per kill).
#
# A full zram device is harmless - it simply stops accepting pages - so the
# swap rule is the wrong trigger here. Real memory pressure still kills.
[OOM]
SwapUsedLimit=100%
