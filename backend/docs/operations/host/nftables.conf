#!/usr/bin/nft -f
# SPDX-License-Identifier: AGPL-3.0
# Copyright (C) 2024-2026 Breakdown RS Contributors
# Co-authored-by: ox-alpha-free (opencode-go)
#
# Host firewall baseline for the Arch Linux VPS (ADR-026 §1).
#
# Install:   sudo install -m 600 docs/operations/host/nftables.conf /etc/nftables.conf
#            sudo nft -c -f /etc/nftables.conf && sudo systemctl enable --now nftables
# Verify:    sudo nft list ruleset | head -40
#
# IMPORTANT: published container ports do NOT traverse the `input` chain —
# Docker installs its own DNAT + FORWARD rules. Default-deny input therefore
# only protects host processes; internal services must stay unpublished in
# docker-compose.prod.yml (see runbook §4.2). This file is the second layer,
# not a substitute for that rule.

flush ruleset

table inet filter {
    chain input {
        type filter hook input priority filter; policy drop;

        # Loopback is trusted.
        iifname "lo" accept

        # Allow replies to connections this host initiated.
        ct state established,related accept
        ct state invalid drop

        # SSH — rate-limited; brute-force is additionally handled by fail2ban.
        tcp dport 22 ct state new limit rate over 10/second reject
        tcp dport 22 ct state new accept comment "SSH"

        # Caddy HTTPS edge (ADR-025) — the only public application surface.
        tcp dport { 80, 443 } accept comment "Caddy HTTP(S) edge"

        # ICMPv6 is required for IPv6 path MTU discovery and neighbour discovery.
        meta nfproto ipv6 icmpv6 type { destination-unreachable, packet-too-big, time-exceeded, parameter-problem, echo-request, nd-router-advert, nd-neighbor-solicit, nd-neighbor-advert } accept
        meta nfproto ipv4 icmp type { destination-unreachable, time-exceeded, parameter-problem, echo-request } limit rate 4/second accept

        # Log and drop everything else (rate-limited so a scan cannot flood journald).
        limit rate 5/minute log prefix "nft-input-drop: " flags all counter
        counter drop
    }

    chain forward {
        type filter hook forward priority filter; policy drop;
        # Docker manages per-published-port ACCEPT rules here. Because we never
        # publish DB / SierraDB / vault / step-ca ports (runbook §4.2), nothing
        # else may pass. Do NOT add blanket accepts.
    }

    chain output {
        type filter hook output priority filter; policy accept;
    }
}
