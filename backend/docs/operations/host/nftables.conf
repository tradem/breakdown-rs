#!/usr/bin/nft -f
# SPDX-License-Identifier: AGPL-3.0
# Copyright (C) 2024-2026 Breakdown RS Contributors
# Co-authored-by: ox-alpha-free (opencode-go)
#
# Host firewall baseline for the Arch Linux VPS (ADR-026 §1) — Docker-compatible.
#
# Install / reload:
#   sudo install -m 600 docs/operations/host/nftables.conf /etc/nftables.conf
#   sudo nft -c -f /etc/nftables.conf && sudo systemctl enable --now nftables
#   sudo systemctl reload nftables          # ExecReload = nft -f <this file>
#
# Docker compatibility (https://docs.docker.com/engine/network/firewall-nftables/):
# - NO top-level `flush ruleset`: applying this file while Docker runs would
#   wipe Docker's DNAT, port-publish and forwarding rules until Docker recreates
#   them. This file owns ONLY the `breakdown_filter` table; the add/delete
#   preamble below makes reloads idempotent without touching other tables.
# - In nftables an ACCEPT verdict in one base chain does NOT override another
#   base chain's DROP at the same hook — a packet traverses all of them. The
#   forward chain therefore accepts exactly what the stack legitimately needs
#   and drops everything else BEFORE Docker's chains are even consulted
#   (priority filter - 10 runs first):
#     * established/related flows,
#     * DNAT traffic = Docker-published ports only (:80/:443 Caddy, loopback
#       Postgres admin) — anything accidentally published is still DNAT'd, so
#       the real "don't publish internal ports" control stays in compose §4.2,
#     * traffic routed between local bridges/networks that never leaves via
#       $WAN_IF (inter-container routing).
#   An un-DNAT'd packet leaving through the WAN interface is dropped.
#
# IMPORTANT: adjust `define WAN_IF` to the actual public interface before
# installing (`ip route show default` → dev).

define WAN_IF = "eth0"

table inet breakdown_filter
delete table inet breakdown_filter

table inet breakdown_filter {
    chain input {
        type filter hook input priority filter; policy drop;

        # Loopback is trusted.
        iifname "lo" accept

        # Allow replies to connections this host initiated.
        ct state established,related accept
        ct state invalid drop

        # SSH — rate-limited; brute-force is additionally handled by fail2ban.
        tcp dport 22 ct state new limit rate over 10/second reject
        tcp dport 22 ct state new accept comment "SSH"

        # Caddy HTTPS edge (ADR-025) — the only public application surface.
        tcp dport { 80, 443 } accept comment "Caddy HTTP(S) edge"

        # ICMPv6 is required for IPv6 path MTU discovery and neighbour discovery.
        meta nfproto ipv6 icmpv6 type { destination-unreachable, packet-too-big, time-exceeded, parameter-problem, echo-request, nd-router-advert, nd-neighbor-solicit, nd-neighbor-advert } accept
        meta nfproto ipv4 icmp type { destination-unreachable, time-exceeded, parameter-problem, echo-request } limit rate 4/second accept

        # Log and drop everything else (rate-limited so a scan cannot flood journald).
        limit rate 5/minute log prefix "nft-input-drop: " flags all counter
        counter drop
    }

    chain forward {
        type filter hook forward priority filter - 10; policy drop;

        ct state established,related accept
        ct status dnat accept comment "Docker-published ports (DNAT)"
        oifname != $WAN_IF accept comment "local bridge/routed traffic never leaves the host"

        limit rate 5/minute log prefix "nft-forward-drop: " flags all counter
        counter drop
    }

    chain output {
        type filter hook output priority filter; policy accept;
    }
}
