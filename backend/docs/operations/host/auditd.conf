#
# auditd.conf retention fragment for the Arch Linux VPS (ADR-026 §9).
#
# auditd logs natively to /var/log/audit/audit.log — journald retention does
# NOT apply to that file. This fragment enforces size-capped rotation with
# keep_logs (never overwrite audit evidence).
#
# Install:  sudo install -D -m 640 docs/operations/host/auditd.conf /etc/audit/auditd.conf
#           sudo systemctl restart auditd
# Verify:   sudo grep -E '^(log_file|max_log_file|num_logs|max_log_file_action)' /etc/audit/auditd.conf
#           sudo ls -lh /var/log/audit/
#
# For OpenTelemetry shipping (ADR-011): either activate the audisp syslog
# plugin (/etc/audit/plugins.d/syslog.conf → active = yes) to mirror events
# into journald, or ship audit.log directly from the collector.

log_file = /var/log/audit/audit.log
log_group = root
max_log_file = 64
num_logs = 10
max_log_file_action = keep_logs
space_left = 500
space_left_action = email
admin_space_left = 200
admin_space_left_action = suspend
disk_full_action = suspend
disk_error_action = suspend
flush = incremental_async
freq = 50
