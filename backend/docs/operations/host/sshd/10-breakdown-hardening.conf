#
# sshd hardening drop-in for the Arch Linux VPS (ADR-026 §3).
#
# Install:  sudo install -D -m 600 docs/operations/host/sshd/10-breakdown-hardening.conf \
#               /etc/ssh/sshd_config.d/10-breakdown-hardening.conf
# Verify:   sudo sshd -t && sudo systemctl reload sshd
#           sudo sshd -T | grep -E 'passwordauthentication|permitrootlogin|maxauthtries'
#
# Prerequisite BEFORE applying: an ed25519 key for the non-root deploy user is
# installed and a second root session (hoster console) is open as fallback.

# Key-only authentication — no passwords, no keyboard-interactive fallback.
PasswordAuthentication no
KbdInteractiveAuthentication no
ChallengeResponseAuthentication no

# Root never logs in directly; use the deploy user + sudo.
PermitRootLogin no

# Only the deploy user may authenticate (adjust to the actual account name).
AllowUsers deploy

# Brute-force resistance knobs.
MaxAuthTries 3
LoginGraceTime 20
MaxSessions 4
MaxStartups 3:30:10

# Drop idle sessions (the hoster console remains the rescue path).
ClientAliveInterval 300
ClientAliveCountMax 2

# Modern algorithms only (as of OpenSSH 10.x on Arch).
KexAlgorithms sntrup761x25519-sha512@openssh.com,curve25519-sha256,curve25519-sha256@libssh.org
Ciphers chacha20-poly1305@openssh.com,aes256-gcm@openssh.com,aes128-gcm@openssh.com
MACs hmac-sha2-512-etm@openssh.com,hmac-sha2-256-etm@openssh.com
HostKeyAlgorithms ssh-ed25519,sk-ssh-ed25519@openssh.com,rsa-sha2-512,rsa-sha2-256
PubkeyAcceptedAlgorithms ssh-ed25519,sk-ssh-ed25519@openssh.com,rsa-sha2-512,rsa-sha2-256

# No X11 / agent / TCP forwarding on a single-purpose host.
X11Forwarding no
AllowAgentForwarding no
AllowTcpForwarding no
