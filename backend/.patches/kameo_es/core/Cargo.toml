[package]
name = "kameo_es_core"
version = "0.1.0"
edition = "2021"
# MSRV aligned with the workspace floor (see sibling kameo_es patch crate).
rust-version = "1.99"
authors = ["Ari Seyhun <dev@tqwewe.com>"]
license = "MIT OR Apache-2.0"
description = "Core types and traits for kameo_es event sourcing library"
repository = "https://github.com/sierra-db/kameo_es"
keywords = ["event-sourcing", "cqrs", "actors", "kameo"]
categories = ["database", "concurrency", "asynchronous"]

[dependencies]
kameo_es_macros = { path = "../macros" }

jiff = { version = "1", features = ["serde"] }
ciborium = "0.2"
serde = { version = "1.0", features = ["derive"] }
uuid = { version = "1.10", features = ["serde", "v4"] }

# Vendored upstream crate (kameo_es 0.2.0, patched by this repo). It deliberately
# does NOT inherit `[workspace.lints]`: its own `unwrap()`/`expect()` usage would
# fail the workspace's deny list. Declaring the (empty) table records that intent,
# so cargo's `missing_lints_inheritance` note stays silent instead of repeating on
# every fresh build.
[lints.clippy]
