[package]
name = "kameo_es_macros"
version = "0.1.0"
edition = "2021"
# MSRV aligned with the workspace floor (see sibling kameo_es patch crates).
rust-version = "1.99"
authors = ["Ari Seyhun <dev@tqwewe.com>"]
license = "MIT OR Apache-2.0"
description = "Derive macros for kameo_es event sourcing library"
repository = "https://github.com/sierra-db/kameo_es"
keywords = ["event-sourcing", "cqrs", "macros", "derive"]
categories = ["development-tools::procedural-macro-helpers"]

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1.0.89"
quote = "1.0.37"
syn = { version = "2.0.82", features = ["extra-traits", "full"] }

# Vendored upstream crate (kameo_es 0.2.0, patched by this repo). It deliberately
# does NOT inherit `[workspace.lints]`: its own `unwrap()`/`expect()` usage would
# fail the workspace's deny list. Declaring the (empty) table records that intent,
# so cargo's `missing_lints_inheritance` note stays silent instead of repeating on
# every fresh build.
[lints.clippy]
