  /v1/shooting-days/{id}/link-into/{target_id}:
    post:
      description: |-
        Hard rules honored here:
        - **CQRS boundary:** the projection reads below happen at the API edge —
          the only legitimate read-model consumer; every write dispatches a
          normal command.
        - **Wrap finality (#376/#706):** a wrapped target day refuses the merge
          with `409 shooting-day.target-wrapped` — a planned day is never merged
          onto a finalised day.
        - **Episode scope:** days are episode-scoped; a cross-episode merge is a
          `409 shooting-day.episode-mismatch`.

        Every step is state-idempotent, so a retry after a partial run converges:
        an already-linked scene re-links as a no-op, an existing target pair is
        skipped, and an archived source skips the archive.
      operationId: link_shooting_day_into
      parameters:
      - description: Source (planned) shooting day id
        in: path
        name: id
        required: true
        schema:
          $ref: '#/components/schemas/ShootingDayId'
      - description: Target (actual) shooting day id
        in: path
        name: target_id
        required: true
        schema:
          $ref: '#/components/schemas/ShootingDayId'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LinkShootingDayResponse'
        '404':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
          description: Source or target day not found
        '409':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
          description: Target wrapped or episode mismatch
      summary: |-
        Merge a script-derived *planned* shooting day into an *actual* day
        (issue #706, decision b): every scene linked to the source day is
        re-pointed onto the target day, every `scene_shoot` pair of the source day
        is re-planned on the target with its `planned_order` preserved, and the
        source day is archived (terminal, its number/links stay historical).
      tags:
      - handlers
  /v1/shooting-days/{id}/report/archive:
    post:
      description: |-
        Setting-gerechte fallback when automation fails or is delayed. Uses the
        **same** dedup key and pipeline as schedule / wrap triggers — never a
        parallel pipeline. Gated stricter than PDF routes: only `CostumeDesigner`
        and `WardrobeSupervisor` (excludes `CostumeAssistant`).
      operationId: manual_archive_reports
      parameters:
      - description: Shooting day id
        in: path
        name: id
        required: true
        schema:
          $ref: '#/components/schemas/ShootingDayId'
      responses:
        '202':
          description: Archival job(s) enqueued
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
          description: Forbidden
        '404':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
          description: Shooting day not found
      summary: Manual "archive now" remediation endpoint.
      tags:
      - handlers
