      operationId: remove_member
      parameters:
      - description: Block id
        in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
      - description: OIDC sub of the member to remove
        in: path
        name: user_id
        required: true
        schema:
          type: string
      responses:
        '204':
          description: Member removed
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
          description: Caller is not an active member of the active block
        '404':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
          description: Target user is not a member of the block
        '422':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
          description: Validation error
      summary: Remove an active member from the block.
      tags:
      - handlers
    get:
      description: 'Gated `BlockMember`: the caller must be an active member of the block.'
      operationId: get_member
      parameters:
      - description: Block id
        in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
      - description: OIDC sub of the member
        in: path
        name: user_id
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MembershipView'
          description: Membership of the user in the block
        '400':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
          description: Missing or malformed X-Active-Block header
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
          description: Caller is not an active member of the active block
        '404':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
          description: Membership not found
      summary: Fetch a single membership (a block member's role and state).
      tags:
      - handlers
  /v1/blocks/{id}/members/{user_id}/role:
