components:
  schemas:
    AddCostumeDetailRequest:
      properties:
        detail:
          $ref: '#/components/schemas/CostumeDetail'
        version:
          $ref: '#/components/schemas/AggregateVersion'
      required:
      - detail
      - version
      type: object
    AddNoteRequest:
      properties:
        body:
          type: string
        note_id:
          format: uuid
          type:
          - string
          - 'null'
      required:
      - body
      type: object
    AggregateVersion:
      description: |-
        Aggregate version for optimistic locking.

        The canonical version contract is **1-based**: `AggregateVersion::INITIAL = 1`,
        and every mutation increments the version by one.

        The SierraDB stream version (0-based) is an infrastructure-internal detail.
        The translation rule is: `domain_version = stream_version + 1`
        (and inversely `stream_version = domain_version - 1`) which is performed
        exclusively inside `crates::infra` at the `*Commands` adapter boundary.
        `core` does not reference `stream_version`, `ExpectedVersion`, or `CurrentVersion`.
      format: int64
      minimum: 0
      type: integer
    AiConfigView:
      description: |-
        Public AI configuration view. It contains only the opaque vault reference,
        never a key or other secret material.
      properties:
        assistant_model:
          type: string
        id:
          format: uuid
          type: string
        image_model:
          type:
          - string
          - 'null'
        prompt_kinds:
          items:
            $ref: '#/components/schemas/DocumentKind'
          type: array
        provider:
          $ref: '#/components/schemas/LlmProvider'
        revoked:
          type: boolean
        user_id:
          $ref: '#/components/schemas/UserId'
        vault_key_id:
          type: string
        version:
          $ref: '#/components/schemas/AggregateVersion'
      required:
      - id
      - user_id
      - provider
      - assistant_model
      - prompt_kinds
      - vault_key_id
      - version
      - revoked
      type: object
    AiImportJob:
      description: |-
        Operational job row. Preview blobs and errors are represented by opaque
        handles/summaries; credentials and document bytes are deliberately absent.
      properties:
        block_id:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/BlockId'
        created_at:
          format: date-time
          type: string
        dedup_key:
          type: string
        document_digest:
          type: string
        document_kind:
          $ref: '#/components/schemas/DocumentKind'
        id:
          $ref: '#/components/schemas/AiImportJobId'
        last_error:
          type:
          - string
          - 'null'
        max_retries:
          format: int32
          minimum: 0
          type: integer
        preview_handle:
          type:
          - string
          - 'null'
        retries:
          format: int32
          minimum: 0
          type: integer
        source_format:
          $ref: '#/components/schemas/SourceFormat'
        source_handle:
          type: string
        status:
          $ref: '#/components/schemas/JobStatus'
        updated_at:
          format: date-time
          type: string
        user_id:
          $ref: '#/components/schemas/UserId'
      required:
      - id
      - user_id
      - document_kind
      - source_format
      - dedup_key
      - document_digest
      - source_handle
      - status
      - retries
      - max_retries
      - created_at
      - updated_at
      type: object
    AiImportJobId:
      description: Opaque identifier for an operational AI import job.
      format: uuid
      type: string
    AiImportJobResponse:
      properties:
        job:
          $ref: '#/components/schemas/AiImportJob'
      required:
      - job
      type: object
    AiProviderInfo:
      properties:
        key:
          description: Canonical lowercase path key for `/ai-import/providers/{provider}/models`.
          type: string
        provider:
          $ref: '#/components/schemas/LlmProvider'
      required:
      - provider
      - key
      type: object
    ApplyAiImportRequest:
      properties:
        accept_as_is:
          type: boolean
        edit_distance:
          format: int32
          minimum: 0
          type: integer
        episode_id:
          $ref: '#/components/schemas/EpisodeId'
        mappings:
          items:
            $ref: '#/components/schemas/ApplyMapping'
          type: array
        series_id:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/SeriesId'
      required:
      - episode_id
      - mappings
      - accept_as_is
      - edit_distance
      type: object
    ApplyAiImportResponse:
      properties:
        applied_count:
          format: int32
          minimum: 0
          type: integer
        created_days:
          format: int32
          minimum: 0
          type: integer
        planned_scene_shoots:
          format: int32
          minimum: 0
          type: integer
      required:
      - applied_count
      - created_days
      - planned_scene_shoots
      type: object
    ApplyMapping:
      description: |-
        User decision for one draft row. A create decision leaves the aggregate id
        absent; an update decision carries the existing id and optimistic version.
      properties:
        decision:
          $ref: '#/components/schemas/ApplyMappingDecision'
        draft_ref:
          type: string
      required:
      - draft_ref
      - decision
      type: object
    ApplyMappingDecision:
      oneOf:
      - enum:
        - Create
        type: string
      - properties:
          Update:
            properties:
              aggregate_id:
                format: uuid
                type: string
              version:
                $ref: '#/components/schemas/AggregateVersion'
            required:
            - aggregate_id
            - version
            type: object
        required:
        - Update
        type: object
    AssignCharacterRequest:
      properties:
        character_id:
          format: uuid
          type: string
        version:
          $ref: '#/components/schemas/AggregateVersion'
      required:
      - character_id
      - version
      type: object
    AssignCostumeRequest:
      properties:
        character_id:
          format: uuid
          type: string
        version:
          $ref: '#/components/schemas/AggregateVersion'
      required:
      - character_id
      - version
      type: object
    AuditEntry:
      description: |-
        One row of the audit journal: who (`actor`) did what (`event_type` on
        `entity_type`/`entity_id`) when (`occurred_at`), with the event `payload`.

        `series_id` is the tenant dimension prepared for per-`SeriesId` tenancy
        (decision 9.2) and is `NULL` in v1. `payload` is the raw event serialized
        as JSON (generic, so any context's events fit the same row).
      properties:
        actor:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/UserId'
        block_id:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/BlockId'
        entity_id:
          type: string
        entity_type:
          type: string
        event_type:
          type: string
        id:
          format: uuid
          type: string
        occurred_at:
          format: date-time
          type: string
        payload: {}
        series_id:
          format: uuid
          type:
          - string
          - 'null'
      required:
      - id
      - entity_type
      - entity_id
      - event_type
      - payload
      - occurred_at
      type: object
    BlockId:
      description: Opaque identifier for a `Block` aggregate.
      format: uuid
      type: string
    BlockView:
      description: |-
        Complete block read model.

        `updated_at` is sourced from the timestamp of the last applied `BlockEvent`.
      properties:
        end_date:
          type: string
        id:
          format: uuid
          type: string
        number:
          format: int32
          type: integer
        season_id:
          $ref: '#/components/schemas/SeasonId'
        series_id:
          $ref: '#/components/schemas/SeriesId'
        start_date:
          type: string
        updated_at:
          format: date-time
          type: string
        version:
          $ref: '#/components/schemas/AggregateVersion'
          description: Aggregate version for optimistic-locking round-trips.
      required:
      - id
      - season_id
      - series_id
      - number
      - start_date
      - end_date
      - version
      - updated_at
      type: object
    CharacterCategory:
      description: |-
        Exhaustive category for a Character.

        Designed for **purely additive extension**: a new variant can be appended
        later without breaking deserialization of already-persisted data (existing
        rows only ever contain the original variants). Removing or renaming a variant
        is a *breaking* change and requires a separate proposal.

        The single enum makes illegal states unrepresentable — there is no
        `(is_main_character = true, is_extra = true)` combination.
      enum:
      - main_cast
      - guest
      - extra
      type: string
    CharacterMeasurements:
      description: Payload for measurement fields updated as a God-Command.
      properties:
        chest:
          type: string
        hat_size:
          type: string
        height:
          type: string
        hips:
          type: string
        shoe_size:
          type: string
        waist:
          type: string
        weight:
          type: string
      required:
      - shoe_size
      - hat_size
      - height
      - weight
      - chest
      - waist
      - hips
      type: object
    CharacterView:
      description: |-
        Complete character read model.

        `updated_at` is sourced from the timestamp of the last applied `CharacterEvent`.
      properties:
        category:
          $ref: '#/components/schemas/CharacterCategory'
        contact:
          $ref: '#/components/schemas/ContactInfo'
        id:
          format: uuid
          type: string
        measurements:
          $ref: '#/components/schemas/CharacterMeasurements'
        name:
          type: string
        season_id:
          $ref: '#/components/schemas/SeasonId'
        updated_at:
          format: date-time
          type: string
        version:
          $ref: '#/components/schemas/AggregateVersion'
          description: Aggregate version for optimistic-locking round-trips.
      required:
      - id
      - season_id
      - name
      - category
      - measurements
      - contact
      - version
      - updated_at
      type: object
    ContactInfo:
      description: Payload for contact information updated as a God-Command.
      properties:
        email:
          type:
          - string
          - 'null'
        phone:
          type:
          - string
          - 'null'
      type: object
    CostumeCategoryId:
      description: |-
        Opaque identifier for a `CostumeCategory` aggregate.

        A `CostumeCategory` is a season-scoped, user-editable vocabulary of part
        types (Oberteil, Schuhe, …) used to categorise `CostumeDetail`s. Like the
        other hierarchy ids it is a UUIDv7 opaque value type that is never decoded
        inside `core`.
      format: uuid
      type: string
    CostumeCategoryView:
      description: |-
        Complete costume-category read model (season-scoped vocabulary entry).

        `updated_at` is sourced from the timestamp of the last applied
        `CostumeCategoryEvent` (ADR-004 + ADR-015).
      properties:
        archived:
          type: boolean
        id:
          format: uuid
          type: string
        name:
          type: string
        order_key:
          $ref: '#/components/schemas/LexicalSortKey'
        season_id:
          $ref: '#/components/schemas/SeasonId'
        updated_at:
          format: date-time
          type: string
        version:
          $ref: '#/components/schemas/AggregateVersion'
          description: Aggregate version for optimistic-locking round-trips.
      required:
      - id
      - season_id
      - name
      - order_key
      - archived
      - version
      - updated_at
      type: object
    CostumeDetail:
      properties:
        category_id:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/CostumeCategoryId'
            description: |-
              Reference to a `CostumeCategory` (season-scoped vocabulary). Optional;
              `None` until the owning Costume is bound to a Season's character.
        id:
          format: uuid
          type: string
        subject:
          description: Free-form per-detail micro-title (e.g. "Rote Lederjacke"). Optional.
          type:
          - string
          - 'null'
        text:
          description: The description (unchanged meaning — never reinterpreted from `subject`).
          type: string
      required:
      - id
      - text
      type: object
    CostumeDetailView:
      description: Detailed costume element (e.g. belt, hat, shoes).
      properties:
        category_id:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/CostumeCategoryId'
            description: Reference to the categorising `CostumeCategory`, if any.
        category_name:
          description: Denormalised category name, resolved by join at projection time.
          type:
          - string
          - 'null'
        id:
          format: uuid
          type: string
        subject:
          description: Free-form per-detail micro-title (e.g. "Rote Lederjacke").
          type:
          - string
          - 'null'
        text:
          description: The description (unchanged meaning).
          type: string
      required:
      - id
      - text
      type: object
    CostumePhotoView:
      description: Linked photo reference for a costume, enriched with variant metadata.
      properties:
        content_type:
          description: MIME type of the uploaded original (e.g. `image/jpeg`).
          type: string
        id:
          format: uuid
          type: string
        size_bytes:
          description: Size of the re-encoded original in bytes.
          format: int64
          minimum: 0
          type: integer
        variants:
          description: Generation status and size of each variant.
          items:
            $ref: '#/components/schemas/PhotoVariantView'
          type: array
      required:
      - id
      - content_type
      - size_bytes
      - variants
      type: object
    CostumeView:
      description: |-
        Complete costume read model, optionally populated with child details/photos.

        `updated_at` is sourced from the timestamp of the last applied `CostumeEvent`.
      properties:
        character_id:
          format: uuid
          type:
          - string
          - 'null'
        details:
          items:
            $ref: '#/components/schemas/CostumeDetailView'
          type: array
        id:
          format: uuid
          type: string
        notes:
          type: string
        photos:
          items:
            $ref: '#/components/schemas/CostumePhotoView'
          type: array
        updated_at:
          format: date-time
          type: string
        version:
          $ref: '#/components/schemas/AggregateVersion'
          description: Aggregate version for optimistic-locking round-trips.
      required:
      - id
      - notes
      - details
      - photos
      - version
      - updated_at
      type: object
    CreateAiConfigRequest:
      properties:
        assistant_model:
          type: string
        image_model:
          type:
          - string
          - 'null'
        prompts:
          additionalProperties:
            type: string
          propertyNames:
            description: The two document kinds supported by the import pipeline.
            enum:
            - script
            - schedule
            type: string
          type: object
        provider:
          $ref: '#/components/schemas/LlmProvider'
        vault_key_id:
          type: string
      required:
      - provider
      - assistant_model
      - prompts
      - vault_key_id
      type: object
    CreateBlockRequest:
      properties:
        end_date:
          format: date
          type:
          - string
          - 'null'
        number:
          format: int32
          type: integer
        season_id:
          $ref: '#/components/schemas/SeasonId'
        series_id:
          $ref: '#/components/schemas/SeriesId'
        start_date:
          format: date
          type:
          - string
          - 'null'
      required:
      - season_id
      - series_id
      - number
      type: object
    CreateCharacterRequest:
      properties:
        category:
          $ref: '#/components/schemas/CharacterCategory'
        name:
          type: string
        season_id:
          $ref: '#/components/schemas/SeasonId'
      required:
      - season_id
      - name
      - category
      type: object
    CreateCostumeCategoryRequest:
      properties:
        name:
          type: string
        order_key:
          $ref: '#/components/schemas/LexicalSortKey'
        season_id:
          $ref: '#/components/schemas/SeasonId'
      required:
      - season_id
      - name
      - order_key
      type: object
    CreateCostumeRequest:
      type: object
    CreateCredentialRequest:
      description: |-
        Generic credential submission kept for non-GDrive providers. GDrive uses
        the typed write-only request below so its complete bundle is stored as one
        Vault binding.
      properties:
        provider:
          type: string
        secret:
          type: string
      required:
      - provider
      - secret
      type: object
    CreateEpisodeRequest:
      properties:
        block_id:
          $ref: '#/components/schemas/BlockId'
        name:
          type:
          - string
          - 'null'
        number:
          format: int32
          type: integer
        series_id:
          $ref: '#/components/schemas/SeriesId'
      required:
      - block_id
      - series_id
      - number
      type: object
    CreateSceneRequest:
      properties:
        details:
          $ref: '#/components/schemas/SceneDetails'
        episode_id:
          $ref: '#/components/schemas/EpisodeId'
      required:
      - episode_id
      - details
      type: object
    CreateSeasonRequest:
      properties:
        number:
          format: int32
          type: integer
        series_id:
          $ref: '#/components/schemas/SeriesId'
        title:
          type:
          - string
          - 'null'
      required:
      - series_id
      - number
      type: object
    CreateShootingDayRequest:
      description: Request body for creating a `ShootingDay` (a Drehtag) inside an Episode.
      properties:
        date:
          description: Calendar date; `None` while planning.
          format: date
          type:
          - string
          - 'null'
        episode_id:
          $ref: '#/components/schemas/EpisodeId'
        label:
          description: Free-form display label (e.g. "1. Tag").
          type:
          - string
          - 'null'
        order_key:
          $ref: '#/components/schemas/LexicalSortKey'
          description: Canonical ordering key within the Episode (lexicographically sortable).
        source:
          $ref: '#/components/schemas/ShootingDaySource'
          description: Import provenance (`Manual` or `AiExtracted`).
      required:
      - episode_id
      - order_key
      - source
      type: object
    CredentialBindingState:
      description: Public binding state. It contains no secret material or ciphertext.
      enum:
      - active
      - revoked
      - unreachable
      type: string
    DispoRow:
      description: A single row in the Dispo (planned / Soll) report.
      properties:
        location:
          type:
          - string
          - 'null'
        mood:
          type:
          - string
          - 'null'
        planned_order:
          $ref: '#/components/schemas/LexicalSortKey'
        scene_id:
          format: uuid
          type: string
        scene_number:
          format: int32
          minimum: 0
          type:
          - integer
          - 'null'
        script_day:
          type:
          - string
          - 'null'
        summary:
          type:
          - string
          - 'null'
      required:
      - planned_order
      - scene_id
      type: object
    DocumentKind:
      description: The two document kinds supported by the import pipeline.
      enum:
      - script
      - schedule
      type: string
    EpisodeId:
      description: Opaque identifier for an `Episode` aggregate.
      format: uuid
      type: string
    EpisodeView:
      description: |-
        Complete episode read model.

        `updated_at` is sourced from the timestamp of the last applied `EpisodeEvent`.
      properties:
        block_id:
          $ref: '#/components/schemas/BlockId'
        id:
          format: uuid
          type: string
        name:
          type:
          - string
          - 'null'
        number:
          format: int32
          type: integer
        series_id:
          $ref: '#/components/schemas/SeriesId'
        updated_at:
          format: date-time
          type: string
        version:
          $ref: '#/components/schemas/AggregateVersion'
          description: Aggregate version for optimistic-locking round-trips.
      required:
      - id
      - block_id
      - series_id
      - number
      - version
      - updated_at
      type: object
    FinishSceneShootRequest:
      properties:
        end_dt:
          format: date-time
          type:
          - string
          - 'null'
        version:
          $ref: '#/components/schemas/AggregateVersion'
      required:
      - version
      type: object
    GDriveCredentialRequest:
      description: |-
        Write-only GDrive credentials. This type intentionally does not implement
        `Debug` or `Serialize`; it is converted immediately at the API edge into a
        non-serializable `GDriveCredentialBundle`.
      properties:
        client_id:
          type: string
        client_secret:
          type: string
        refresh_token:
          type: string
        root_folder_id:
          type:
          - string
          - 'null'
      required:
      - client_id
      - client_secret
      - refresh_token
      type: object
    GDriveCredentialUpdateRequest:
      allOf:
      - $ref: '#/components/schemas/GDriveCredentialRequest'
      - properties:
          version:
            $ref: '#/components/schemas/AggregateVersion'
        required:
        - version
        type: object
    GrantRoleRequest:
      properties:
        role:
          $ref: '#/components/schemas/Role'
          description: New role for the active member (their prior role is replaced).
      required:
      - role
      type: object
    IdVersionResponse:
      description: Response for aggregate creation endpoints.
      properties:
        id:
          format: uuid
          type: string
        version:
          $ref: '#/components/schemas/AggregateVersion'
      required:
      - id
      - version
      type: object
    InviteMemberRequest:
      properties:
        role:
          $ref: '#/components/schemas/Role'
          description: Proposed role for the invited user (pending until they accept).
        user_id:
          description: OIDC `sub` of the user to invite to the block.
          type: string
      required:
      - user_id
      - role
      type: object
    JobStatus:
      description: |-
        Operational lifecycle of an AI import job.

        `Failed` is the *retryable* state (a due `next_attempt_at` makes the job
        claimable again); `DeadLetter` and `PayloadUnavailable` are terminal.
      enum:
      - pending
      - running
      - succeeded
      - failed
      - dead_letter
      - payload_unavailable
      type: string
    LexicalSortKey:
      description: |-
        A validated, lexicographically-sortable key used for ordering entities
        (e.g. `ShootingDay`s within an `Episode`) without renumbering siblings.

        The key is a non-empty string over a fixed printable-ASCII alphabet
        (`!`..`~`, i.e. bytes `33..=126`). It carries **no** ordering semantics of
        its own beyond raw byte/lexicographic order, which matches the SQL
        `ORDER BY order_key ASC` semantics of the read model. To insert an entity
        between two existing siblings, use [`LexicalSortKey::midpoint`], which
        produces a key strictly between the two in exactly one event.
      type: string
    LinkContinuityPhotoRequest:
      properties:
        photo_id:
          $ref: '#/components/schemas/PhotoId'
        version:
          $ref: '#/components/schemas/AggregateVersion'
      required:
      - photo_id
      - version
      type: object
    LlmProvider:
      description: |-
        Curated providers. The enum is intentionally non-exhaustive so adding a
        provider is additive and does not break downstream matches.
      enum:
      - openai
      - openrouter
      - eurouter
      - neuralwatt
      - opencode-go
      - opencode
      - ollama
      type: string
    ManualArchiveJobResult:
      description: One job enqueue outcome.
      properties:
        already_enqueued:
          type: boolean
        job_id:
          format: uuid
          type: string
        kind:
          type: string
        status:
          type: string
      required:
      - kind
      - job_id
      - already_enqueued
      - status
      type: object
    ManualArchiveResponse:
      description: Response body for a manual "archive now" request.
      properties:
        jobs:
          description: Per-kind enqueue results (dedup-aware).
          items:
            $ref: '#/components/schemas/ManualArchiveJobResult'
          type: array
      required:
      - jobs
      type: object
    MembershipStateKind:
      description: |-
        Membership lifecycle state in the read model.

        `snake_case` serialization keeps the Postgres `state` text column stable
        and human-readable.
      enum:
      - pending
      - active
      type: string
    MembershipView:
      description: |-
        Complete membership read model row for one `(block_id, user_id)` pair.

        `joined_at` is the timestamp of the `InvitationAccepted` event, sourced
        from the event stream (not from aggregate state).
      properties:
        block_id:
          $ref: '#/components/schemas/BlockId'
        joined_at:
          format: date-time
          type: string
        role:
          $ref: '#/components/schemas/Role'
        state:
          $ref: '#/components/schemas/MembershipStateKind'
        user_id:
          $ref: '#/components/schemas/UserId'
      required:
      - block_id
      - user_id
      - role
      - state
      - joined_at
      type: object
    ModelInfo:
      properties:
        display_name:
          type:
          - string
          - 'null'
        id:
          type: string
        provider:
          $ref: '#/components/schemas/LlmProvider'
      required:
      - id
      - provider
      type: object
    PhotoBinding:
      description: |-
        Discriminates what a photo is attached to.

        `Costume` — Anprobe/planning photo (taken before the shoot).
        `Continuity` — continuity photo taken during the shoot; `costume_id` is
        `Option` so prop-only continuity shots are permitted (the edge case).

        The `Default` implementation returns `Costume { costume_id: Uuid::nil() }`
        so that historical `PhotoUploaded` events (pre-binding) deserialise as
        costume photos, matching the backward-compat requirement.
      oneOf:
      - description: Costume (Anprobe) photo — taken before the shoot for planning.
        properties:
          costume:
            description: Costume (Anprobe) photo — taken before the shoot for planning.
            properties:
              costume_id:
                format: uuid
                type: string
            required:
            - costume_id
            type: object
        required:
        - costume
        type: object
      - description: Continuity (Anschluss) photo — taken during the shoot.
        properties:
          continuity:
            description: Continuity (Anschluss) photo — taken during the shoot.
            properties:
              costume_id:
                format: uuid
                type:
                - string
                - 'null'
              scene_shoot_id:
                $ref: '#/components/schemas/SceneShootId'
            required:
            - scene_shoot_id
            type: object
        required:
        - continuity
        type: object
    PhotoBytesQuery:
      description: Query parameters for the photo bytes endpoint.
      properties:
        variant:
          description: 'Variant: "original", "thumb", or "medium". Defaults to "original".'
          type:
          - string
          - 'null'
      type: object
    PhotoId:
      description: |-
        Opaque identifier for a `Photo` aggregate.

        A `Photo` is an event-sourced aggregate that tracks the lifecycle
        (upload, normalisation, variant generation, deletion) of a costume
        photo. Like the other identifiers it is a UUIDv7 opaque value type
        never decoded inside `core`. The actual bytes are stored in Garage
        via the `PhotoStorage` port.
      format: uuid
      type: string
    PhotoVariant:
      description: |-
        The three image variants stored for each photo.

        `Original` is the re-encoded, upright, EXIF-stripped source image
        (quality ~95). `Thumb` is a ~200×200 JPEG (quality 80). `Medium` is
        an ~800×800 JPEG (quality 85). Adding a new variant is additive —
        only the enum gains a variant and the saga gains a generation step.
      enum:
      - Original
      - Thumb
      - Medium
      type: string
    PhotoVariantView:
      description: A single variant's public view.
      properties:
        kind:
          $ref: '#/components/schemas/PhotoVariant'
        size_bytes:
          format: int64
          minimum: 0
          type: integer
        status:
          $ref: '#/components/schemas/VariantStatus'
      required:
      - kind
      - status
      - size_bytes
      type: object
    PhotoView:
      description: Complete photo read model, populated by the projector.
      properties:
        binding:
          $ref: '#/components/schemas/PhotoBinding'
          description: What this photo is attached to (Costume or Continuity).
        content_type:
          type: string
        exif_stripped_at:
          format: date-time
          type:
          - string
          - 'null'
        id:
          $ref: '#/components/schemas/PhotoId'
        size_bytes:
          format: int64
          minimum: 0
          type: integer
        variants:
          items:
            $ref: '#/components/schemas/PhotoVariantView'
          type: array
        version:
          $ref: '#/components/schemas/AggregateVersion'
      required:
      - id
      - content_type
      - size_bytes
      - variants
      - binding
      - version
      type: object
    PlanSceneShootRequest:
      properties:
        planned_order:
          $ref: '#/components/schemas/LexicalSortKey'
        scene_id:
          format: uuid
          type: string
        shooting_day_id:
          $ref: '#/components/schemas/ShootingDayId'
      required:
      - scene_id
      - shooting_day_id
      - planned_order
      type: object
    ProblemDetails:
      description: |-
        An RFC 9457 problem document (ADR-031 D1).

        Every error response (status ≥ 400) produced by the API is an instance of
        this document: `type` (derived from `code`), constant English `title`,
        `status`, stable `code`, localized `detail` (English until Tranche 3), and
        the `trace_id` extension for otel correlation.
      example:
        code: concurrency.version-mismatch
        detail: Version conflict
        extensions:
          current_version: 3
          expected_version: 2
        status: 409
        title: Version conflict
        trace_id: 4bf92f3577b34da6a3ce929d0e0e4736
        type: https://docs.breakdown.example/problems/scene.already-scheduled
      properties:
        code:
          description: Stable machine identity `{context}.{reason}` (the client contract).
          example: concurrency.version-mismatch
          type: string
        detail:
          description: Human-readable explanation; localized server-side (Tranche 3).
          example: Version conflict
          type: string
        extensions:
          additionalProperties: {}
          description: Declared S0/S1 extension fields, if any (ADR-031 D4).
          propertyNames:
            type: string
          type:
          - object
          - 'null'
        status:
          description: Canonical HTTP status of this problem.
          example: 409
          format: int32
          minimum: 0
          type: integer
        title:
          description: Constant English title (never localized; cacheable, spec-stable).
          type: string
        trace_id:
          description: W3C trace id of the request's otel span (support correlation).
          example: 4bf92f3577b34da6a3ce929d0e0e4736
          type: string
        type:
          description: Dereferencable documentation anchor, derived from the `code`.
          example: https://docs.breakdown.example/problems/scene.already-scheduled
          type: string
      required:
      - type
      - title
      - status
      - code
      - detail
      - trace_id
      type: object
    RenameEpisodeRequest:
      properties:
        name:
          type:
          - string
          - 'null'
        version:
          $ref: '#/components/schemas/AggregateVersion'
      required:
      - version
      type: object
    RenameSeasonRequest:
      properties:
        title:
          type:
          - string
          - 'null'
        version:
          $ref: '#/components/schemas/AggregateVersion'
      required:
      - version
      type: object
    ReplanSceneShootRequest:
      properties:
        planned_order:
          $ref: '#/components/schemas/LexicalSortKey'
        version:
          $ref: '#/components/schemas/AggregateVersion'
      required:
      - planned_order
      - version
      type: object
    RevokeAiConfigRequest:
      properties:
        version:
          $ref: '#/components/schemas/AggregateVersion'
      required:
      - version
      type: object
    Role:
      description: |-
        Block-scoped costume-department role.

        Roles are **domain-local** and **block-scoped** (Decision 4): the same
        `UserId` may hold a different `Role` in two blocks of the same season
        because staff rotate roles at Block boundaries. The initial v1 set is
        `CostumeDesigner` + `WardrobeSupervisor`, plus `CostumeAssistant` which is
        the default role assigned to the block creator during the owner bootstrap
        (see `BootstrapOwner`).

        **Ubiquitous Language is English.** The enum variants and their `snake_case`
        serde form are the canonical domain vocabulary, so events and projection
        rows are persisted as English strings (`"costume_designer"`,
        `"wardrobe_supervisor"`, `"costume_assistant"`).

        The enum is **open for additive extension** (see `block-membership` spec,
        "Initial role set"): adding a new variant is a non-breaking change for
        writers, but renaming or removing an existing variant is a breaking change
        requiring a separate proposal. Variants are serialized by their stable
        `snake_case` name, so events/rows written today stay readable after a
        future addition.
      enum:
      - costume_designer
      - wardrobe_supervisor
      - costume_assistant
      type: string
    SceneDetails:
      properties:
        is_schedule_set:
          type: boolean
        location:
          type:
          - string
          - 'null'
        mood:
          type:
          - string
          - 'null'
        scene_number:
          format: int32
          minimum: 0
          type:
          - integer
          - 'null'
        script_day:
          description: |-
            Fictional script-chronology day (e.g. "1. Spieltag"), distinct
            from the calendar `ShootingDay.date`. Free-form search index.
          type:
          - string
          - 'null'
        summary:
          description: Free-form scene description/prose summary.
          type:
          - string
          - 'null'
      required:
      - is_schedule_set
      type: object
    SceneShootId:
      description: |-
        Opaque identifier for a `SceneShoot` aggregate.

        A `SceneShoot` models the association between a `Scene` and a
        `ShootingDay`, carrying both planned and actual execution data.
        Each `(scene_id, shooting_day_id)` pair gets its own stream.
        Like the other identifiers it is a UUIDv7 opaque value type
        never decoded inside `core`.
      format: uuid
      type: string
    SceneShootStatus:
      description: |-
        The shoot status lifecycle of a `SceneShoot`.

        `Planned` — the scene is planned (Dispo), no execution data yet.
        `Scheduled` — the scene is scheduled but not yet in progress.
        `InProgress` — execution has started (`start_dt` or `actual_order` set).
        `Shot` — the scene shoot is finished (terminal for this pair).
        `Skipped` — the scene was skipped on this shooting day.
      enum:
      - Planned
      - Scheduled
      - InProgress
      - Shot
      - Skipped
      type: string
    SceneShootView:
      description: |-
        Complete scene-shoot read model.

        `updated_at` is sourced from the timestamp of the last applied
        `SceneShootEvent`, not from the UUIDv7 event id.
      properties:
        actual_order:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/LexicalSortKey'
        continuity_photo_ids:
          items:
            $ref: '#/components/schemas/PhotoId'
          type: array
        end_dt:
          format: date-time
          type:
          - string
          - 'null'
        id:
          $ref: '#/components/schemas/SceneShootId'
        notes:
          items:
            $ref: '#/components/schemas/SerializedNote'
          type: array
        planned_order:
          $ref: '#/components/schemas/LexicalSortKey'
        scene_id:
          format: uuid
          type: string
        shooting_day_id:
          $ref: '#/components/schemas/ShootingDayId'
        start_dt:
          format: date-time
          type:
          - string
          - 'null'
        status:
          $ref: '#/components/schemas/SceneShootStatus'
        updated_at:
          format: date-time
          type: string
        version:
          $ref: '#/components/schemas/AggregateVersion'
          description: Aggregate version of the last applied event; echo back in optimistic-locking commands.
      required:
      - id
      - scene_id
      - shooting_day_id
      - planned_order
      - status
      - notes
      - continuity_photo_ids
      - version
      - updated_at
      type: object
    SceneView:
      description: |-
        Complete scene read model.

        `updated_at` is sourced from the timestamp of the last applied `SceneEvent`,
        not from the UUIDv7 event id (ADR-004 + ADR-015).
      properties:
        assigned_characters:
          items:
            format: uuid
            type: string
          type: array
        episode_id:
          $ref: '#/components/schemas/EpisodeId'
        id:
          format: uuid
          type: string
        is_schedule_set:
          type: boolean
        location:
          type:
          - string
          - 'null'
        mood:
          type:
          - string
          - 'null'
        scene_number:
          format: int32
          minimum: 0
          type:
          - integer
          - 'null'
        script_day:
          description: |-
            Fictional script-chronology day (e.g. "1. Spieltag"), distinct
            from the calendar `ShootingDay.date`.
          type:
          - string
          - 'null'
        shooting_day_ids:
          description: Shooting days this scene is scheduled on.
          items:
            $ref: '#/components/schemas/ShootingDayId'
          type: array
        summary:
          type:
          - string
          - 'null'
        updated_at:
          format: date-time
          type: string
        version:
          $ref: '#/components/schemas/AggregateVersion'
          description: Aggregate version of the last applied event; echo back in optimistic-locking commands.
      required:
      - id
      - episode_id
      - is_schedule_set
      - shooting_day_ids
      - assigned_characters
      - version
      - updated_at
      type: object
    ScheduleSceneRequest:
      description: Request body for linking a `Scene` to a `ShootingDay`.
      properties:
        shooting_day_id:
          $ref: '#/components/schemas/ShootingDayId'
        version:
          $ref: '#/components/schemas/AggregateVersion'
      required:
      - shooting_day_id
      - version
      type: object
    SeasonId:
      description: Opaque identifier for a `Season` aggregate.
      format: uuid
      type: string
    SeasonMembershipDto:
      description: |-
        Season membership DTO — the single source of truth for the client-side
        AUTHZ-GATE (D2 of the `wire-flutter-oidc-auth` change).

        `has_active_costume_role_in_season` is the backend-computed predicate the
        client must NOT re-implement (CQRS-boundary rule). `capabilities` is derived
        server-side from the caller's active costume-dept role; the client consumes
        it with strict parsing (unknown entries reject the DTO).
      properties:
        capabilities:
          items:
            type: string
          type: array
        has_active_costume_role_in_season:
          type: boolean
        season_id:
          format: uuid
          type: string
      required:
      - season_id
      - has_active_costume_role_in_season
      - capabilities
      type: object
    SeasonView:
      description: |-
        Complete season read model.

        `updated_at` is sourced from the timestamp of the last applied `SeasonEvent`.
      properties:
        id:
          format: uuid
          type: string
        number:
          format: int32
          type: integer
        series_id:
          $ref: '#/components/schemas/SeriesId'
        title:
          type:
          - string
          - 'null'
        updated_at:
          format: date-time
          type: string
        version:
          $ref: '#/components/schemas/AggregateVersion'
          description: Aggregate version for optimistic-locking round-trips.
      required:
      - id
      - series_id
      - number
      - version
      - updated_at
      type: object
    SerializedNote:
      description: A note as exposed in the read model (flattened for JSON serialisation).
      properties:
        body:
          type: string
        id:
          format: uuid
          type: string
      required:
      - id
      - body
      type: object
    SeriesId:
      description: |-
        Opaque identifier for a `Series` (a show run).

        `SeriesId` is an opaque UUIDv7 value type introduced by the
        `introduce-season-block-episode-hierarchy` change. It is the seam for a
        future additive `Series` aggregate: every hierarchy entity (Season, Block,
        Episode) references it but no `Series` aggregate exists yet.
      format: uuid
      type: string
    SetActualOrderRequest:
      properties:
        actual_order:
          $ref: '#/components/schemas/LexicalSortKey'
        version:
          $ref: '#/components/schemas/AggregateVersion'
      required:
      - actual_order
      - version
      type: object
    SettingsView:
      properties:
        binding_state:
          $ref: '#/components/schemas/CredentialBindingState'
