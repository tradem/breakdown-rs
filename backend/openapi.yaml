          $ref: '#/components/schemas/AggregateVersion'
      required:
      - version
      type: object
    UserId:
      description: |-
        Opaque identifier for a user, wrapping the OIDC `sub` claim.

        `UserId` references the authenticated principal without ever decoding,
        storing, or dereferencing identity attributes in `core`. The backend only
        trusts the IdP-issued `sub`; account lifecycle lives exclusively in the
        OIDC provider (ADR-010). Unlike the hierarchy ids, `UserId` is *not* a
        UUIDv7 — it is the raw string subject the IdP assigns.
      type: string
    VariantStatus:
      description: |-
        The generation status of a single photo variant.

        Every variant starts as `Pending` on upload. The thumbnail saga
        transitions it to `Ready` on success or `Failed` on error.
      enum:
      - Pending
      - Ready
      - Failed
      type: string
    VersionRequest:
      properties:
        version:
          $ref: '#/components/schemas/AggregateVersion'
      required:
      - version
      type: object
    WrapShootingDayRequest:
      properties:
        version:
          $ref: '#/components/schemas/AggregateVersion'
      required:
      - version
      type: object
info:
  description: |-
    Costume scheduling API for Breakdown RS (ADR-006). Routes are mounted under the /v1 path prefix; the path version is bumped only on a breaking wire change (ADR-021).
    Error contract (ADR-031): every error response (status ≥ 400) is an RFC 9457 `application/problem+json` document carrying a stable `code` (`{context}.{reason}` kebab-case) and a `trace_id` extension. The full code registry is exposed under `x-code-registry`; per-code documentation lives at `docs/errors/`.
  license:
    identifier: AGPL-3.0
    name: AGPL-3.0
  title: Breakdown RS API
  version: v1
openapi: 3.1.0
