components:
  schemas:
    AddCostumeDetailRequest:
      properties:
        detail:
          $ref: '#/components/schemas/CostumeDetailRequest'
        version:
          $ref: '#/components/schemas/AggregateVersion'
      required:
      - detail
      - version
      type: object
    AddCostumeToSeasonRequest:
      description: |-
        Add a costume to a season's repertoire (issue #534). Idempotent: a season
        already in the repertoire is a no-op success with the unchanged version.
      properties:
        season_id:
          format: uuid
          type: string
        version:
          $ref: '#/components/schemas/AggregateVersion'
      required:
      - season_id
      - version
      type: object
    AddNoteRequest:
      properties:
        body:
          type: string
        note_id:
          format: uuid
          type:
          - string
          - 'null'
      required:
      - body
      type: object
    AddSceneCostumeBeatRequest:
      description: |-
        Request body for adding a costume beat (issue #546). The `order` is
        deliberately absent — the aggregate computes it (`max + 1` per character);
        a client-chosen order would be a race.
      properties:
        character_id:
          format: uuid
          type: string
        costume_id:
          format: uuid
          type: string
        note:
          description: Optional free-text cue for the wardrobe crew ("nach dem Telefonat").
          type:
          - string
          - 'null'
        version:
          $ref: '#/components/schemas/AggregateVersion'
      required:
      - character_id
      - costume_id
      - version
      type: object
    AggregateSollIstDiffRow:
      description: |-
        One row of an aggregated (season- or episode-scoped) Soll-Ist report
        (issue #571): one planned execution of a scene on one shooting day within
        the report scope.

        The diff flags carry the day-scoped semantics applied per row: `moved` /
        `missing` / `skipped` compare the row's own day, while `reshot_candidate`
        is scoped to the whole report scope — the scene has a `Shot` record on
        another day **within the scope**.
      properties:
        actual_order:
          oneOf:
          - $ref: '#/components/schemas/LexicalSortKey'
          - type: 'null'
        location:
          type:
          - string
          - 'null'
        missing:
          description: '`true` when planned on this day but without execution data.'
          type: boolean
        moved:
          description: '`true` when `actual_order` differs from `planned_order` on this day.'
          type: boolean
        planned_order:
          oneOf:
          - $ref: '#/components/schemas/LexicalSortKey'
          - type: 'null'
        reshot_candidate:
          description: |-
            `true` when the same `scene_id` has a `Shot` record on another day
            within the report scope.
          type: boolean
        scene_id:
          format: uuid
          type: string
        scene_number:
          format: int32
          minimum: 0
          type:
          - integer
          - 'null'
        script_day:
          type:
          - string
          - 'null'
        shooting_day_id:
          $ref: '#/components/schemas/ShootingDayId'
        shooting_day_label:
          description: |-
            Human-readable label of the row's shooting day (projection label;
            nullable on the projection).
          type:
          - string
          - 'null'
        skipped:
          description: '`true` when status is `Skipped` on this day.'
          type: boolean
      required:
      - scene_id
      - shooting_day_id
      - moved
      - missing
      - skipped
      - reshot_candidate
      type: object
    AggregateSollIstReport:
      description: |-
        The aggregated (season- or episode-scoped) Soll-Ist report (issue #571).

        `is_final` is **server-derived** and never recomputed client-side:
        `true` iff the scope has at least one non-archived shooting day and every
        one of them has `wrapped_at` set. A scope with zero shooting days
        therefore reports `false` (never vacuously final) with zero counts — an
        empty report, not an error.
      properties:
        is_final:
          type: boolean
        rows:
          items:
            $ref: '#/components/schemas/AggregateSollIstDiffRow'
          type: array
        total_shooting_days:
          description: Number of non-archived shooting days in the scope.
          format: int32
          minimum: 0
          type: integer
        wrapped_shooting_days:
          description: How many of those days are wrapped (`wrapped_at` set).
          format: int32
          minimum: 0
          type: integer
      required:
      - rows
      - is_final
      - total_shooting_days
      - wrapped_shooting_days
      type: object
    AggregateVersion:
      description: |-
        Aggregate version for optimistic locking.

        The canonical version contract is **1-based**: `AggregateVersion::INITIAL = 1`,
        and every mutation increments the version by one.

        The SierraDB stream version (0-based) is an infrastructure-internal detail.
        The translation rule is: `domain_version = stream_version + 1`
        (and inversely `stream_version = domain_version - 1`) which is performed
        exclusively inside `crates::infra` at the `*Commands` adapter boundary.
        `core` does not reference `stream_version`, `ExpectedVersion`, or `CurrentVersion`.
      format: int64
      minimum: 0
      type: integer
    AiConfigView:
      description: |-
        Public AI configuration view. It contains only the opaque vault reference,
        never a key or other secret material.

        The [prompts] map carries the *stored prompt texts* (the same map the
        create/update commands accept) so the client's configured/edit form can
        render what is persisted instead of starting from empty fields (issue
        #490) — saving an untouched edit must not clear them.
      properties:
        assistant_model:
          type: string
        cost_display_preference:
          $ref: '#/components/schemas/CostDisplayPreference'
          description: |-
            Preferred primary cost display metric (issue #675). Additive with
            `serde(default)`: views serialized before the field existed
            deserialize as `Token`.
        decision_model:
          type:
          - string
          - 'null'
        decision_provider:
          oneOf:
          - $ref: '#/components/schemas/LlmProvider'
            description: |-
              Optional Decision Model configuration (issue #722). Additive with
              `serde(default)`: views serialized before the fields existed
              deserialize with no decision model configured.
          - type: 'null'
        decision_vault_key_id:
          type:
          - string
          - 'null'
        id:
          format: uuid
          type: string
        image_model:
          type:
          - string
          - 'null'
        prompt_kinds:
          items:
            $ref: '#/components/schemas/DocumentKind'
          type: array
        prompts:
          additionalProperties:
            type: string
          description: |-
            Stored prompt texts by document kind (`script`/`schedule`). Mirrors
            the create/update request `prompts` payload so an edit can round-trip
            the persisted texts. Prompts are user-authored extraction seeds, not
            secrets — the vault reference is the only opaque material.
          propertyNames:
            description: The two document kinds supported by the import pipeline.
            enum:
            - script
            - schedule
            type: string
          type: object
        provider:
          $ref: '#/components/schemas/LlmProvider'
        revoked:
          type: boolean
        stored_prompt_kinds:
          description: |-
            Kinds whose extraction is driven by a **stored** prompt (design D6).

            A stored prompt is a snapshot taken when the configuration was written:
            it wins over the deployment default and therefore does **not** follow
            updates to `config/default_ai_prompts.toml`. That was observed live — a
            configuration kept the previous three-line prompt and silently ignored a
            hardened default, invalidating a whole test round. The surface must say
            so, and offer a reset (write the current text from
            `GET /v1/ai-import/defaults`). A kind absent here has no stored prompt
            and follows the deployment default on every run.

            Additive with `serde(default)` so an older client reading a newer view
            still deserialises.
          items:
            $ref: '#/components/schemas/DocumentKind'
          type: array
        user_id:
          $ref: '#/components/schemas/UserId'
        vault_key_id:
          type: string
        version:
          $ref: '#/components/schemas/AggregateVersion'
      required:
      - id
      - user_id
      - provider
      - assistant_model
      - prompts
      - prompt_kinds
      - vault_key_id
      - version
      - revoked
      type: object
    AiImportAttempt:
      description: 'One recorded execution attempt of an AI import job (issue #637).'
      properties:
        attempt_no:
          description: 1-based attempt number, matching the job's `retries` after the attempt.
          format: int32
          minimum: 0
          type: integer
        code:
          description: |-
            Stable problem `code` of the failure (ADR-031 D2), e.g.
            `dependency.auth-failed`; `None` when the writer recorded no typed
            error. Lets a client localize the reason without parsing
            `error_summary` (issue #639).
          type:
          - string
          - 'null'
        created_at:
          description: When the attempt was recorded.
          format: date-time
          type: string
        error_summary:
          description: Failure summary, same text `last_error` carried for that attempt.
          type:
          - string
          - 'null'
        retryable:
          description: Whether the attempt was classified as retryable.
          type: boolean
        status:
          $ref: '#/components/schemas/JobStatus'
          description: |-
            Job status the attempt left the job in (`failed`, `dead_letter` or
            `payload_unavailable`).
      required:
      - attempt_no
      - status
      - retryable
      - created_at
      type: object
    AiImportDefaults:
      description: |-
        Wire shape for `GET /v1/ai-import/defaults` (issue #471): the
        deployment's single-source prompt defaults (script/schedule) read from
        `AI_IMPORT_DEFAULT_PROMPTS_PATH` or the built-in fallback TOML — the same
        prompts the import workers seed from.
      properties:
        schedule:
          description: Default prompt seed for schedule imports.
          type: string
        script:
          description: Default prompt seed for script imports.
          type: string
      required:
      - script
      - schedule
      type: object
    AiImportJob:
      description: |-
        Operational job row. Preview blobs and errors are represented by opaque
        handles/summaries; credentials and document bytes are deliberately absent.
      properties:
        attempts:
          description: |-
            Per-attempt failure history, newest first (issue #637).

            `last_error` is overwritten by every `mark_failed`, so the reason an
            *earlier* attempt failed is lost. This list keeps each attempt's
            outcome retrievable. Populated on the single-job read
            (`GET /ai-import/jobs/{id}`); empty in list/claim contexts where the
            history is not fetched, so it is additive on the wire.
          items:
            $ref: '#/components/schemas/AiImportAttempt'
          type: array
        block_id:
          oneOf:
          - $ref: '#/components/schemas/BlockId'
          - type: 'null'
        cost:
          oneOf:
          - $ref: '#/components/schemas/CostBreakdown'
            description: |-
              Immutable per-import cost snapshot persisted at completion time
              (issue #675). Never recomputed when pricing changes later.
          - type: 'null'
        created_at:
          format: date-time
          type: string
        dedup_key:
          type: string
        document_digest:
          type: string
        document_kind:
          $ref: '#/components/schemas/DocumentKind'
        id:
          $ref: '#/components/schemas/AiImportJobId'
        last_error:
          type:
          - string
          - 'null'
        max_retries:
          format: int32
          minimum: 0
          type: integer
        next_attempt_at:
          description: |-
            When a retryable `failed` job becomes claimable again (issue #637).

            `None` for every other state: `pending`/`running` have no backoff, and
            a terminal job never retries. The column always existed; the wire view
            omitted it, so neither the UI nor operators could explain a stalled
            import ("why is this job not running yet?").
          format: date-time
          type:
          - string
          - 'null'
        preview_handle:
          type:
          - string
          - 'null'
        progress:
          oneOf:
          - $ref: '#/components/schemas/AiImportProgress'
            description: |-
              Live extraction progress of a running job, when the worker already
              published it (issue #664). `None` for pending jobs and freshly
              re-claimed retry attempts (the claim SQL resets stale progress).
          - type: 'null'
        retries:
          format: int32
          minimum: 0
          type: integer
        source_format:
          $ref: '#/components/schemas/SourceFormat'
        source_handle:
          type: string
        status:
          $ref: '#/components/schemas/JobStatus'
        telemetry:
          oneOf:
          - $ref: '#/components/schemas/JobTelemetrySummary'
            description: |-
              Content-free operational telemetry recorded for this job (issue
              #675). `None` until a worker or the API apply path records telemetry;
              additive on the wire.
          - type: 'null'
        updated_at:
          format: date-time
          type: string
        user_id:
          $ref: '#/components/schemas/UserId'
      required:
      - id
      - user_id
      - document_kind
      - source_format
      - dedup_key
      - document_digest
      - source_handle
      - status
      - retries
      - max_retries
      - created_at
      - updated_at
      type: object
    AiImportJobId:
      description: Opaque identifier for an operational AI import job.
      format: uuid
      type: string
    AiImportJobResponse:
      properties:
        job:
          $ref: '#/components/schemas/AiImportJob'
      required:
      - job
      type: object
    AiImportPreviewResponse:
      description: |-
        Typed envelope for the preview endpoint: job identity plus the parsed
        payload. Parsing happens server-side so a corrupt blob surfaces as
        `422 domain.validation` instead of an untyped blob the client must
        validate at runtime.
      properties:
        document_kind:
          $ref: '#/components/schemas/DocumentKind'
        job_id:
          format: uuid
          type: string
        preview:
          $ref: '#/components/schemas/AiPreviewPayload'
        status:
          $ref: '#/components/schemas/JobStatus'
      required:
      - job_id
      - document_kind
      - status
      - preview
      type: object
    AiImportProgress:
      description: |-
        Live progress of a running AI import job (issue #664).

        Additive and optional on [`AiImportJob`]: `None` for jobs that have not
        reached a `mark_progress` call yet (fresh `pending` claims, retried
        attempts before their first stage boundary — the claim SQL resets it).
      properties:
        chunk:
          description: |-
            Chunk counter of the extraction progress. `0` is a deliberate
            published state — "chunking finished, the first chunk has not yet
            completed" (the frame emitted right after the deterministic scan) —
            so the schema floor is 0, not 1. For every later frame this is the
            1-based index of the last **completed** chunk (`1..=chunks_total`).
          format: int32
          minimum: 0
          type:
          - integer
          - 'null'
        chunks_total:
          description: Total chunks in the document (known once chunking finishes).
          format: int32
          minimum: 0
          type:
          - integer
          - 'null'
        episodes_seen:
          description: |-
            Human-readable episode labels discovered so far, in first-seen order,
            deduplicated (e.g. `["Ep. 3", "Ep. 4"]`). Built at zero extra LLM
            token cost from the deterministic `Ep.:` marker scan and per-chunk
            extracted `DraftEpisode` metadata — never script prose.
          items:
            type: string
          type: array
        stage:
          $ref: '#/components/schemas/AiImportStage'
      required:
      - stage
      type: object
    AiImportStage:
      description: |-
        The extraction stage an AI import job is currently in (issue #664).

        Surfaces *where* in the pipeline a running job is, so the client can show
        something more informative than an indeterminate spinner. Never per-LLM-
        token — it only advances at stage boundaries and completed chunks.
      enum:
      - extracting_text
      - extracting
      - merging
      - storing_preview
      type: string
    AiPreviewPayload:
      description: |-
        Typed preview payload served by `GET /v1/ai-import/jobs/{id}/preview`
        (issue #337).

        Workers persist one of three shapes depending on the job's document kind
        and stage: `Script` (`ScriptContext`, script jobs), `Schedule`
        (`ShootingSchedule`, schedule jobs before the merge worker runs), or
        `Merged` (`MergedPreview`, schedule jobs after the merge). The
        externally-tagged representation lets generated clients consume preview
        rows structurally instead of through a runtime-validated row adapter.
        `MergeInput` is deliberately excluded: it is worker-internal scaffolding,
        never a renderable preview.
      oneOf:
      - properties:
          data:
            $ref: '#/components/schemas/ScriptContext'
          kind:
            enum:
            - script
            type: string
        required:
        - data
        - kind
        type: object
      - properties:
          data:
            $ref: '#/components/schemas/ShootingSchedule'
          kind:
            enum:
            - schedule
            type: string
        required:
        - data
        - kind
        type: object
      - properties:
          data:
            $ref: '#/components/schemas/MergedPreview'
          kind:
            enum:
            - merged
            type: string
        required:
        - data
        - kind
        type: object
    AiProviderInfo:
      properties:
        decision_capable:
          description: |-
            Whether this provider natively hosts Decision Models, i.e. serves a
            non-empty `GET /ai-import/providers/{provider}/decision-models` catalog
            (issue #736). Served so the client's Decision provider picker reads the
            capability from its own route instead of mirroring a hardcoded provider
            allowlist — the backend predicate stays the single source of truth.
          type: boolean
        key:
          description: Canonical lowercase path key for `/ai-import/providers/{provider}/models`.
          type: string
        provider:
          $ref: '#/components/schemas/LlmProvider'
      required:
      - provider
      - key
      - decision_capable
      type: object
    AppearanceCostumeView:
      description: |-
        One costume beat of a character within one scene (issue #621): the
        character-scoped slice of `projection_scene_costume_assignment`, enriched by
        join with `projection_costume` for the category.
      properties:
        costume_category_id:
          format: uuid
          type:
          - string
          - 'null'
        costume_category_name:
          type:
          - string
          - 'null'
        costume_id:
          format: uuid
          type: string
        note:
          description: Optional free-text cue for the wardrobe crew.
          type:
          - string
          - 'null'
        order:
          description: Dense, zero-based, unique per character within this scene.
          format: int32
          minimum: 0
          type: integer
      required:
      - costume_id
      - order
      type: object
    ApplyAiImportRequest:
      properties:
        accept_as_is:
          type: boolean
        edit_distance:
          format: int32
          minimum: 0
          type: integer
        episode_groups:
          description: |-
            Per-episode-group targets (issue #581). Absent or empty → every draft
            row applies to `episode_id` (the single-episode flow). A group the
            preview does not carry, a duplicate group ref, or two groups creating
            the same episode number is a validation error; a create number already
            taken in the series is a 409 `episode.number-already-exists` pre-check
            (#404 doctrine — the projection unique index stays authoritative).
          items:
            $ref: '#/components/schemas/ApplyEpisodeGroupRequest'
          type: array
        episode_id:
          $ref: '#/components/schemas/EpisodeId'
        mappings:
          items:
            $ref: '#/components/schemas/ApplyMapping'
          type: array
        project_id:
          oneOf:
          - $ref: '#/components/schemas/ProjectId'
          - type: 'null'
        shooting_days:
          description: |-
            Per-shooting-day-group decisions (issue #706). Absent or empty → a
            preview carrying day groups is still appliable for its scenes, but the
            apply gate refuses while a referenced group has no decision (`409
            ai-import.apply-missing-shooting-day-group` — same client-bug class
            as the episode groups). Old clients omit the field (serde default =
            empty), so previews stored before this change still apply when they
            carry no day metadata.
          items:
            $ref: '#/components/schemas/ApplyShootingDayRequest'
          type: array
        uncertainty_acknowledgements:
          description: |-
            Reviewer acknowledgements of blocking `field_ambiguity` uncertainties
            (issue #663). Acknowledge semantics: the listed ambiguity is accepted
            as-is and its row applies as extracted (`suggested_value` is
            display-only; correcting a wrong value happens post-apply via normal
            scene editing). Request-carried because a stored preview is an
            immutable payload blob. Every entry must reference a blocking
            uncertainty the preview actually carries; anything else — and any
            duplicate — is a validation error. Old clients omit the field (serde
            default = empty), so previews stored before this change still apply.
          items:
            $ref: '#/components/schemas/UncertaintyAcknowledgement'
          type: array
      required:
      - episode_id
      - mappings
      - accept_as_is
      - edit_distance
      type: object
    ApplyAiImportResponse:
      properties:
        applied_count:
          format: int32
          minimum: 0
          type: integer
        created_characters:
          description: |-
            Figures the script apply created. A figure named by several draft rows is
            created once, so this is not `applied_count`-related. `0` for a schedule
            apply, which has no figures.
          format: int32
          minimum: 0
          type: integer
        created_costumes:
          description: Costumes the script apply created (unassigned, then bound).
          format: int32
          minimum: 0
          type: integer
        created_days:
          format: int32
          minimum: 0
          type: integer
        created_episodes:
          description: |-
            Episodes the script apply created for draft episode groups the reviewer
            mapped to a NEW episode (issue #581). `0` for a schedule apply.
          format: int32
          minimum: 0
          type: integer
        planned_scene_shoots:
          format: int32
          minimum: 0
          type: integer
        skipped_day_groups:
          description: |-
            Day groups the reviewer rejected — their rows applied unscheduled
            (issue #706). Reported so the reviewer sees the deliberate omission,
            never a silent one.
          items:
            type: string
          type: array
        unapplied_costumes:
          description: |-
            Costume rows that did **not** become a `Costume`, each with the reason.
            An apply that created a costume but could not bind it reports the row
            here while `created_costumes` still counts it — a partially applied row
            must never look like a fully applied one.
          items:
            $ref: '#/components/schemas/UnappliedCostume'
          type: array
      required:
      - applied_count
      - created_days
      - planned_scene_shoots
      - created_characters
      - created_costumes
      - created_episodes
      - unapplied_costumes
      type: object
    ApplyEpisodeGroupRequest:
      description: |-
        One episode group's reviewer decision on the wire (issue #581). `target`
        reuses the core [`EpisodeTarget`] (tagged `existing` / `create`).
      properties:
        episode_ref:
          description: The group ref the preview carries on each row (`ep:<n>` / `ep-t:<title>`).
          type: string
        target:
          $ref: '#/components/schemas/EpisodeTarget'
      required:
      - episode_ref
      - target
      type: object
    ApplyMapping:
      description: |-
        User decision for one draft row. A create decision leaves the aggregate id
        absent; an update decision carries the existing id and optimistic version.
      properties:
        costume_decisions:
          description: |-
            Per-costume-row decisions of this draft row. Absent ordinals default to
            accepted, so a request written before this field existed (or one where
            the reviewer touched nothing) still applies everything that was extracted.
          items:
            $ref: '#/components/schemas/CostumeDecision'
          type: array
        decision:
          $ref: '#/components/schemas/ApplyMappingDecision'
        draft_ref:
          type: string
      required:
      - draft_ref
      - decision
      type: object
    ApplyMappingDecision:
      oneOf:
      - enum:
        - Create
        type: string
      - properties:
          Update:
            properties:
              aggregate_id:
                format: uuid
                type: string
              version:
                $ref: '#/components/schemas/AggregateVersion'
            required:
            - aggregate_id
            - version
            type: object
        required:
        - Update
        type: object
    ApplyShootingDayRequest:
      description: |-
        One shooting-day group's reviewer decision on the wire (issue #706).
        `accepted` creates the day (episode-scoped, `AiExtracted` source) and
        schedules the group's scene rows onto it; a rejection leaves every row of
        the group unscheduled.
      properties:
        accepted:
          type: boolean
        day_ref:
          description: |-
            The group ref the preview carries on each row (`day:<n>` /
            `day-l:<label>`).
          type: string
      required:
      - day_ref
      - accepted
      type: object
    AssignCharacterRequest:
      properties:
        character_id:
          format: uuid
          type: string
        version:
          $ref: '#/components/schemas/AggregateVersion'
      required:
      - character_id
      - version
      type: object
    AssignCostumeRequest:
      properties:
        character_id:
          format: uuid
          type: string
        version:
          $ref: '#/components/schemas/AggregateVersion'
      required:
      - character_id
      - version
      type: object
    AuditEntry:
      description: |-
        One row of the audit journal: who (`actor`) did what (`event_type` on
        `entity_type`/`entity_id`) when (`occurred_at`), with the event `payload`.

        `project_id` is the tenant dimension prepared for per-`ProjectId` tenancy
        (decision 9.2) and is `NULL` in v1. `payload` is the raw event serialized
        as JSON (generic, so any context's events fit the same row).
      properties:
        actor:
          oneOf:
          - $ref: '#/components/schemas/UserId'
          - type: 'null'
        block_id:
          oneOf:
          - $ref: '#/components/schemas/BlockId'
          - type: 'null'
        entity_id:
          type: string
        entity_type:
          type: string
        event_type:
          type: string
        id:
          format: uuid
          type: string
        occurred_at:
          format: date-time
          type: string
        payload: {}
        project_id:
          format: uuid
          type:
          - string
          - 'null'
      required:
      - id
      - entity_type
      - entity_id
      - event_type
      - payload
      - occurred_at
      type: object
    BlockId:
      description: Opaque identifier for a `Block` aggregate.
      format: uuid
      type: string
    BlockView:
      description: |-
        Complete block read model.

        `updated_at` is sourced from the timestamp of the last applied `BlockEvent`.
      properties:
        end_date:
          type:
          - string
          - 'null'
        id:
          format: uuid
          type: string
        number:
          format: int32
          type: integer
        project_id:
          $ref: '#/components/schemas/ProjectId'
          description: |-
            The tenant-level production container this block belongs to (`project_id`
            on the wire, issue #599).
        season_id:
          $ref: '#/components/schemas/SeasonId'
        start_date:
          type:
          - string
          - 'null'
        updated_at:
          format: date-time
          type: string
        version:
          $ref: '#/components/schemas/AggregateVersion'
          description: Aggregate version for optimistic-locking round-trips.
      required:
      - id
      - season_id
      - project_id
      - number
      - version
      - updated_at
      type: object
    CharacterAppearanceView:
      description: |-
        One appearance of a character in a scene (issue #621): the scene reference
        in script order plus the character's own costume beats in that scene.

        Backs `GET /v1/characters/{id}/appearances` — the role extract ("Ring
        binder per role"): every scene the character appears in, in `scene_number`
        order, with the costume(s) that character wears there.
      properties:
        costumes:
          description: |-
            The character's costume beats in this scene, ordered by `order`.
            Empty when the character has no costume beat in the scene yet.
          items:
            $ref: '#/components/schemas/AppearanceCostumeView'
          type: array
        episode_id:
          $ref: '#/components/schemas/EpisodeId'
        scene_id:
          format: uuid
          type: string
        scene_number:
          description: Script-order scene number; `None` for scenes not yet numbered.
          format: int32
          minimum: 0
          type:
          - integer
          - 'null'
        synopsis:
          description: Scene synopsis (the scene projection's `summary`), for the extract row.
          type:
          - string
          - 'null'
      required:
      - scene_id
      - episode_id
      type: object
    CharacterCategory:
      description: |-
        Exhaustive category for a Character.

        Designed for **purely additive extension**: a new variant can be appended
        later without breaking deserialization of already-persisted data (existing
        rows only ever contain the original variants). Removing or renaming a variant
        is a *breaking* change and requires a separate proposal.

        The single enum makes illegal states unrepresentable — there is no
        `(is_main_character = true, is_extra = true)` combination.
      enum:
      - main_cast
      - guest
      - extra
      type: string
    CharacterMeasurements:
      description: Payload for measurement fields updated as a God-Command.
      properties:
        chest:
          type:
          - string
          - 'null'
        hat_size:
          type:
          - string
          - 'null'
        height:
          type:
          - string
          - 'null'
        hips:
          type:
          - string
          - 'null'
        shoe_size:
          type:
          - string
          - 'null'
        waist:
          type:
          - string
          - 'null'
        weight:
          type:
          - string
          - 'null'
      type: object
    CharacterView:
      description: |-
        Complete character read model.

        `updated_at` is sourced from the timestamp of the last applied `CharacterEvent`.
      properties:
        category:
          $ref: '#/components/schemas/CharacterCategory'
        contact:
          $ref: '#/components/schemas/ContactInfo'
        id:
          format: uuid
          type: string
        measurements:
          $ref: '#/components/schemas/CharacterMeasurements'
        name:
          type: string
        season_id:
          $ref: '#/components/schemas/SeasonId'
        updated_at:
          format: date-time
          type: string
        version:
          $ref: '#/components/schemas/AggregateVersion'
          description: Aggregate version for optimistic-locking round-trips.
      required:
      - id
      - season_id
      - name
      - category
      - measurements
      - contact
      - version
      - updated_at
      type: object
    CheckpointProgress:
      description: |-
        Checkpoint progress of one partition of one projection.

        Wire shape of `GET /v1/ops/projector-health` → `checkpoints`.
      properties:
        partition_id:
          description: SierraDB partition the projection's event streams hash into.
          format: int32
          type: integer
        projection_id:
          description: Checkpoint projection id (the aggregate category, e.g. `season`).
          type: string
        sequence:
          description: |-
            Last flushed partition sequence (0-based; the projector is caught up
            through this event).
          format: int64
          type: integer
      required:
      - projection_id
      - partition_id
      - sequence
      type: object
    ContactInfo:
      description: Payload for contact information updated as a God-Command.
      properties:
        email:
          type:
          - string
          - 'null'
        phone:
          type:
          - string
          - 'null'
      type: object
    CostBreakdown:
      description: |-
        Immutable per-import cost snapshot persisted on a completed job (design
        D4). Honesty rule: `Known` populates breakdowns; `Unknown` and
        `NotApplicable` leave them `None` — never a fabricated zero.
      properties:
        currency:
          oneOf:
          - $ref: '#/components/schemas/Currency'
            description: Present only for `Known` snapshots.
          - type: 'null'
        energy_cost:
          oneOf:
          - $ref: '#/components/schemas/EnergyCostBreakdown'
          - type: 'null'
        image_cost:
          oneOf:
          - $ref: '#/components/schemas/ImageCostBreakdown'
          - type: 'null'
        price_as_of:
          description: Price snapshot timestamp of the pricing row used for computation.
          format: date-time
          type:
          - string
          - 'null'
        pricing_source:
          oneOf:
          - $ref: '#/components/schemas/PricingSource'
          - type: 'null'
        status:
          $ref: '#/components/schemas/CostStatus'
        token_cost:
          oneOf:
          - $ref: '#/components/schemas/TokenCostBreakdown'
          - type: 'null'
      required:
      - status
      type: object
    CostDisplayPreference:
      description: |-
        The user's preferred primary cost display metric (issue #675).

        Both token and energy costs are always persisted on completed jobs, so
        switching the preference re-renders historical job costs without
        recalculation. `Token` is the default for every pre-existing `AiConfig`
        (replayed events and deserialized views without the field).
      enum:
      - token
      - energy
      type: string
    CostStatus:
      description: Whether a job's cost could be computed honestly.
      enum:
      - known
      - unknown
      - not_applicable
      type: string
    CostumeCategoryId:
      description: |-
        Opaque identifier for a `CostumeCategory` aggregate.

        A `CostumeCategory` is a season-scoped, user-editable vocabulary of part
        types (Oberteil, Schuhe, …) used to categorise `CostumeDetail`s. Like the
        other hierarchy ids it is a UUIDv7 opaque value type that is never decoded
        inside `core`.
      format: uuid
      type: string
    CostumeCategoryView:
      description: |-
        Complete costume-category read model (season-scoped vocabulary entry).

        `updated_at` is sourced from the timestamp of the last applied
        `CostumeCategoryEvent` (ADR-004 + ADR-015).
      properties:
        archived:
          type: boolean
        id:
          format: uuid
          type: string
        name:
          type: string
        order_key:
          $ref: '#/components/schemas/LexicalSortKey'
        season_id:
          $ref: '#/components/schemas/SeasonId'
        updated_at:
          format: date-time
          type: string
        version:
          $ref: '#/components/schemas/AggregateVersion'
          description: Aggregate version for optimistic-locking round-trips.
      required:
      - id
      - season_id
      - name
      - order_key
      - archived
      - version
      - updated_at
      type: object
    CostumeDecision:
      description: |-
        Reviewer decision for one costume row of a draft row. A costume is accepted
        or rejected *independently of its scene* (spec `ai-import`: the preview
        exposes each costume row for its own decision).
      properties:
        accepted:
          description: |-
            `false` rejects the costume: no `Costume` is created and the scene row is
            unaffected.
          type: boolean
        ordinal:
          description: Index into the draft row's `costumes` list.
          minimum: 0
          type: integer
      required:
      - ordinal
      - accepted
      type: object
    CostumeDetail:
      properties:
        category_id:
          oneOf:
          - $ref: '#/components/schemas/CostumeCategoryId'
            description: |-
              **Legacy field (issue #543).** The category moved to the costume
              aggregate (`CostumeCategorySet`); details are pure description now.
              The field stays on the event payload with `serde(default)` so old
              events replay: the aggregate and the projector derive the costume's
              category from it (first-wins rule). Newly added details carry `None`.
          - type: 'null'
        id:
          format: uuid
          type: string
        subject:
          description: Free-form per-detail micro-title (e.g. "Rote Lederjacke"). Optional.
          type:
          - string
          - 'null'
        text:
          description: The description (unchanged meaning — never reinterpreted from `subject`).
          type: string
      required:
      - id
      - text
      type: object
    CostumeDetailRequest:
      description: |-
        Wire payload for a costume detail (issue #543): pure description —
        `subject` + `text`. The category is no longer part of the detail wire
        contract; it is set on the costume via `POST /costumes/{id}/category`.
        New details deserialize with `category_id: None` in the domain event.
      properties:
        id:
          format: uuid
          type: string
        subject:
          type:
          - string
          - 'null'
        text:
          type: string
      required:
      - id
      - text
      type: object
    CostumeDetailView:
      description: |-
        Detailed costume element (e.g. belt, hat, shoes).

        Pure description since issue #543: the category lives on the costume
        (`CostumeView.category_id`), not on the detail. `subject` + `text` remain.
      properties:
        id:
          format: uuid
          type: string
        subject:
          description: Free-form per-detail micro-title (e.g. "Rote Lederjacke").
          type:
          - string
          - 'null'
        text:
          description: The description (unchanged meaning).
          type: string
      required:
      - id
      - text
      type: object
    CostumePhotoView:
      description: Linked photo reference for a costume, enriched with variant metadata.
      properties:
        content_type:
          description: MIME type of the uploaded original (e.g. `image/jpeg`).
          type: string
        id:
          format: uuid
          type: string
        size_bytes:
          description: Size of the re-encoded original in bytes.
          format: int64
          minimum: 0
          type: integer
        variants:
          description: Generation status and size of each variant.
          items:
            $ref: '#/components/schemas/PhotoVariantView'
          type: array
      required:
      - id
      - content_type
      - size_bytes
      - variants
      type: object
    CostumeView:
      description: |-
        Complete costume read model, optionally populated with child details/photos.

        `updated_at` is sourced from the timestamp of the last applied `CostumeEvent`.
      properties:
        category_id:
          oneOf:
          - $ref: '#/components/schemas/CostumeCategoryId'
            description: |-
              The costume's single category (issue #543): reference into the
              season-scoped vocabulary. `None` = uncategorised. A cross-aggregate
              reference like `character_id` — no scope column, resolved by join in
              the read model.
          - type: 'null'
        category_name:
          description: |-
            Denormalised category name, resolved by the projector at write time;
            `None` on a projection miss (dangling reference, best-effort).
          type:
          - string
          - 'null'
        character_id:
          format: uuid
          type:
          - string
          - 'null'
        details:
          items:
            $ref: '#/components/schemas/CostumeDetailView'
          type: array
        id:
          format: uuid
          type: string
        notes:
          type: string
        photos:
          items:
            $ref: '#/components/schemas/CostumePhotoView'
          type: array
        season_ids:
          description: |-
            The costume's season **repertoire** (issue #534): the seasons whose
            costume streams the costume stands in, populated from
            `projection_costume_season` by the enrich path. Ordered by
            `season_id` (deterministic). Empty for a costume without a
            repertoire binding — its scope then falls back to the character's
            season.
          items:
            format: uuid
            type: string
          type: array
        updated_at:
          format: date-time
          type: string
        version:
          $ref: '#/components/schemas/AggregateVersion'
          description: Aggregate version for optimistic-locking round-trips.
      required:
      - id
      - notes
      - details
      - photos
      - version
      - updated_at
      - season_ids
      type: object
    CreateAiConfigRequest:
      properties:
        assistant_model:
          type: string
        cost_display_preference:
          $ref: '#/components/schemas/CostDisplayPreference'
          description: |-
            Preferred primary cost display metric (issue #675). Defaults to
            `token` for clients predating the field.
        decision_model:
          type:
          - string
          - 'null'
        decision_provider:
          oneOf:
          - $ref: '#/components/schemas/LlmProvider'
            description: |-
              Optional Decision Model slot (issue #722). `decision_vault_key_id` MAY
              equal `vault_key_id` when `decision_provider == provider` (same-key
              reuse) or reference a distinct active credential of the decision
              provider owned by the caller (split billing).
          - type: 'null'
        decision_vault_key_id:
          type:
          - string
          - 'null'
        image_model:
          type:
          - string
          - 'null'
        prompts:
          additionalProperties:
            type: string
          propertyNames:
            description: The two document kinds supported by the import pipeline.
            enum:
            - script
            - schedule
            type: string
          type: object
        provider:
          $ref: '#/components/schemas/LlmProvider'
        vault_key_id:
          type: string
      required:
      - provider
      - assistant_model
      - prompts
      - vault_key_id
      type: object
    CreateBlockRequest:
      properties:
        end_date:
          format: date
          type:
          - string
          - 'null'
        number:
          format: int32
          type: integer
        project_id:
          $ref: '#/components/schemas/ProjectId'
        season_id:
          $ref: '#/components/schemas/SeasonId'
        start_date:
          format: date
          type:
          - string
          - 'null'
      required:
      - season_id
      - project_id
      - number
      type: object
    CreateCharacterRequest:
      properties:
        category:
          $ref: '#/components/schemas/CharacterCategory'
        name:
          type: string
        season_id:
          $ref: '#/components/schemas/SeasonId'
      required:
      - season_id
      - name
      - category
      type: object
    CreateCostumeCategoryRequest:
      properties:
        name:
          type: string
        order_key:
          $ref: '#/components/schemas/LexicalSortKey'
        season_id:
          $ref: '#/components/schemas/SeasonId'
      required:
      - season_id
      - name
      - order_key
      type: object
    CreateCostumeRequest:
      description: |-
        Create-costume payload (issue #453).

        `season_id` is the optional repertoire season: when present, the costume
        joins that season's costume stream while unassigned. The API edge resolves
        the `project_id` audit metadata from the season projection (404 on an
        unknown season).
      properties:
        season_id:
          oneOf:
          - $ref: '#/components/schemas/SeasonId'
          - type: 'null'
      type: object
    CreateCredentialRequest:
      description: |-
        Generic credential submission kept for non-GDrive providers. GDrive uses
        the typed write-only request below so its complete bundle is stored as one
        Vault binding.
      properties:
        provider:
          type: string
        secret:
          type: string
      required:
      - provider
      - secret
      type: object
    CreateEpisodeRequest:
      properties:
        block_id:
          $ref: '#/components/schemas/BlockId'
        name:
          type:
          - string
          - 'null'
        number:
          format: int32
          type: integer
        project_id:
          $ref: '#/components/schemas/ProjectId'
      required:
      - block_id
      - project_id
      - number
      type: object
    CreateSceneRequest:
      properties:
        details:
          $ref: '#/components/schemas/SceneDetails'
        episode_id:
          $ref: '#/components/schemas/EpisodeId'
      required:
      - episode_id
      - details
      type: object
    CreateSeasonRequest:
      properties:
        number:
          format: int32
          type: integer
        project_id:
          $ref: '#/components/schemas/ProjectId'
        title:
          type:
          - string
          - 'null'
      required:
      - project_id
      - number
      type: object
    CreateShootingDayRequest:
      description: Request body for creating a `ShootingDay` (a Drehtag) inside an Episode.
      properties:
        date:
          description: Calendar date; `None` while planning.
          format: date
          type:
          - string
          - 'null'
        episode_id:
          $ref: '#/components/schemas/EpisodeId'
        label:
          description: Free-form display label (e.g. "1. Tag").
          type:
          - string
          - 'null'
        order_key:
          $ref: '#/components/schemas/LexicalSortKey'
          description: Canonical ordering key within the Episode (lexicographically sortable).
        source:
          $ref: '#/components/schemas/ShootingDaySource'
          description: Import provenance (`Manual` or `AiExtracted`).
      required:
      - episode_id
      - order_key
      - source
      type: object
    CredentialBindingState:
      description: Public binding state. It contains no secret material or ciphertext.
      enum:
      - active
      - revoked
      - unreachable
      type: string
    Currency:
      description: |-
        Currency of a pricing entry and of a computed cost snapshot. Rates and
        totals are always in the *native* currency reported by the provider
        catalog — there is no conversion between USD and EUR (design D2).
      enum:
      - USD
      - EUR
      type: string
    DeadLetterEntry:
      description: |-
        One durably recorded poison event (row of `projection_dead_letter`).

        Wire shape of `GET /v1/ops/projector-health` → `dead_letters`.
      properties:
        attempts:
          description: How often the event was dead-lettered (replays bump, never duplicate).
          format: int32
          type: integer
        constraint_name:
          description: Violated constraint name, if the failure carried one.
          type:
          - string
          - 'null'
        error_message:
          description: Rendered error message (`Debug` of the processor error).
          type: string
        event_name:
          description: Recorded event type name (e.g. `CostumeAssigned`).
          type: string
        first_seen_at:
          format: date-time
          type: string
        last_seen_at:
          format: date-time
          type: string
        partition_id:
          description: SierraDB partition the event stream hashed into.
          format: int32
          type: integer
        projection_id:
          description: Checkpoint projection id (the aggregate category, e.g. `costume`).
          type: string
        sequence:
          description: Partition sequence of the poison event.
          format: int64
          type: integer
        sqlstate:
          description: Postgres SQLSTATE classifying the failure, if it carried one.
          type:
          - string
          - 'null'
        stream_id:
          description: SierraDB stream id the event belongs to.
          type: string
      required:
      - projection_id
      - partition_id
      - sequence
      - stream_id
      - event_name
      - error_message
      - attempts
      - first_seen_at
      - last_seen_at
      type: object
    DecisionRubric:
      description: |-
        Structured rubric sub-scores persisted on the preview payload (issue
        #722: "persist structured rubric sub-scores … to prepare the 0.5.x
        automatic prompt optimization loop"). Additive with `serde(default)` so
        previews stored before this field existed still deserialize.
      properties:
        decision_model:
          description: Decision model that produced the sub-scores.
          type:
          - string
          - 'null'
        decision_provider:
          oneOf:
          - $ref: '#/components/schemas/LlmProvider'
            description: Decision provider that produced the sub-scores.
          - type: 'null'
        grounding_factor:
          description: The deterministic grounding signals blended into the scores.
          format: float
          type:
          - number
          - 'null'
        scoring_failed:
          description: |-
            Whether the decision endpoint failed for this unit (telemetry only —
            the scores degraded to `None` either way). Omitted when `false`.
          type: boolean
        sub_scores:
          additionalProperties:
            format: float
            type: number
          description: |-
            Calibrated sub-question probabilities keyed by
            [`question_keys`] names — the APO reward-signal foundation.
          propertyNames:
            type: string
          type: object
      type: object
    DispoRow:
      description: A single row in the Dispo (planned / Soll) report.
      properties:
        location:
          type:
          - string
          - 'null'
        mood:
          type:
          - string
          - 'null'
        planned_order:
          $ref: '#/components/schemas/LexicalSortKey'
        scene_id:
          format: uuid
          type: string
        scene_number:
          format: int32
          minimum: 0
          type:
          - integer
          - 'null'
        script_day:
          type:
          - string
          - 'null'
        summary:
          type:
          - string
          - 'null'
      required:
      - planned_order
      - scene_id
      type: object
    DocumentKind:
      description: The two document kinds supported by the import pipeline.
      enum:
      - script
      - schedule
      type: string
    DraftCharacter:
      description: |-
        One figure a draft row names, with its extracted role type (issue #677).

        The category is **grounded**: `MainCast` only when the document truly does
        not say otherwise (the prompt classifies from the cast-section headings —
        "Darsteller" / "Gastrollen" / "Statisten" / "Komparseren" — and inline
        notes). A classification the model is unsure about surfaces as an
        `Uncertainty` instead of silently shipping a wrong category.
      properties:
        category:
          $ref: '#/components/schemas/CharacterCategory'
          description: |-
            `serde(default)` so a preview (or a model response) without the field
            keeps the grounded default — old stored previews load unchanged.
        name:
          description: |-
            The name **verbatim** from the script (the same contract as the
            pre-#677 plain string entries).
          type: string
      required:
      - name
      type: object
    DraftCostume:
      description: |-
        One costume extracted for a character of a draft scene.

        Flat by design: the LLM has no domain ids, and the write side must not
        resolve ids from a read-model projection (CQRS boundary). `character_name`
        is matched against the same draft scene's `characters`; `source_quote` is the
        fragment the extraction claims to be based on, which the server verifies
        against the supplied chunk text before the row may reach the reviewer.
      properties:
        character_name:
          description: Character the costume belongs to, as written in the script.
          type: string
        description:
          description: The garment/accessory description, in the script's own wording.
          type: string
        source_quote:
          description: Quoted fragment of the chunk this entry was extracted from.
          type: string
      required:
      - character_name
      - description
      - source_quote
      type: object
    DraftEpisode:
      description: |-
        One episode of the source script, as the deterministic marker scan (and,
        as a fallback, the LLM) read it out of the document. Production scripts
        mark episodes as `Ep.: 3 (Titel)` — on the first page and repeated in the
        page headers (issue #581). Metadata only: it groups preview rows for the
        reviewer and names the episode an apply may create; it never resolves an
        aggregate id (that is the reviewer's per-group decision).
      properties:
        number:
          description: The number after `Ep.:`, when the marker carried one.
          format: int32
          type:
          - integer
          - 'null'
        title:
          description: The title in the trailing parentheses, when the marker carried one.
          type:
          - string
          - 'null'
      type: object
    DraftScene:
      properties:
        characters:
          description: |-
            The figures this row names, each with its extracted role type (issue
            #677). Backward compatible on the wire: a preview stored before the
            category existed carries plain name strings, which deserialize to the
            grounded `MainCast` default via [`deserialize_draft_characters`].
          items:
            $ref: '#/components/schemas/DraftCharacter'
          type: array
        costumes:
          description: |-
            Costumes worn by this scene's characters. Additive on the wire with a
            default so previews stored before this field existed still load; a
            preview written by this version loses the field when read by an older
            binary (breaking, see the change proposal).
          items:
            $ref: '#/components/schemas/DraftCostume'
          type: array
        draft_ref:
          type: string
        episode:
          oneOf:
          - $ref: '#/components/schemas/DraftEpisode'
            description: |-
              The episode this row belongs to (issue #581). Additive on the wire with
              a default so previews stored before this field existed still load;
              `None` applies the row to the explicitly picked target episode.
          - type: 'null'
        location:
          type:
          - string
          - 'null'
        mood:
          type:
          - string
          - 'null'
        scene_number:
          format: int32
          minimum: 0
          type:
          - integer
          - 'null'
        scene_score:
          description: |-
            Hybrid quality score of the extracted scene (issue #722),
            `0.0..=1.0` — calibrated Decision Model probabilities blended with
            deterministic grounding signals. `None` when no decision model is
            configured or the best-effort scoring pass failed (honest
            degradation, never a fabricated value). Additive on the wire.
          format: float
          type:
          - number
          - 'null'
        scoring:
          oneOf:
          - $ref: '#/components/schemas/DecisionRubric'
            description: |-
              Structured rubric sub-scores (issue #722) — the reward-signal
              foundation for the `0.5.x` automatic prompt optimization loop.
          - type: 'null'
        script_day:
          type:
          - string
          - 'null'
        shooting_day:
          oneOf:
          - $ref: '#/components/schemas/DraftShootingDay'
            description: |-
              The shooting day this row was extracted for (issue #706). Additive on
              the wire with a default so previews stored before this field existed
              still load; `None` leaves the row unscheduled. The deterministic day
              scan is authoritative; the model's verbatim `script_day` normalizes
              into this field only when the scan found no marker for the chunk.
          - type: 'null'
        summary:
          type:
          - string
          - 'null'
        synopsis_score:
          description: |-
            Hybrid quality score of the TL;DR `summary` (issue #722). `Some(0.0)`
            when `sanitize_meta_summary` had to rewrite the summary; `None` when
            the row has no summary (outline-only block) or no scoring pass ran.
          format: float
          type:
          - number
          - 'null'
      required:
      - draft_ref
      type: object
    DraftShootingDay:
      description: |-
        One shooting day of the source script, as the deterministic marker scan
        (and, as a fallback, the LLM's grounded `script_day`) read it out of the
        document (issue #706). Production scripts repeat day columns in the scene
        index (`Tag 1`, `1. Spieltag` — the 294.pdf SCRIPT-REPORT format). Metadata
        only: it groups preview rows for the reviewer and names the day an apply
        may create; it never resolves an aggregate id (that is the reviewer's
        per-group decision). `PartialEq` only: the `score` field (issue #722) is
        an `f32` and cannot derive `Eq`.
      properties:
        label:
          description: |-
            The marker's verbatim text (or, for the LLM fallback, the model's
            `script_day` as written) — display-only. First occurrence wins.
          type:
          - string
          - 'null'
        number:
          description: |-
            The day number the marker carried, e.g. `1` for `Tag 1` — the
            normalized identity that groups scenes filmed on the same day
            regardless of the marker's spelling.
          format: int32
          type:
          - integer
          - 'null'
        score:
          description: |-
            Hybrid quality score of the day group's day assignment (issue #722),
            set by the extraction worker's best-effort decision pass and shared
            by every row of the group. `None` without a decision model / failed
            pass. Additive on the wire.
          format: float
          type:
          - number
          - 'null'
      type: object
    EnergyCostBreakdown:
      description: |-
        Hardware-energy cost of one import, in nano-units. Populated only when
        the job recorded energy telemetry and the model carries an energy rate.
      properties:
        capped_by_token_cost:
          description: Whether the token-cost cap reduced the figure.
          type: boolean
        effective_capped_nano:
          description: |-
            The cost that counts: `min(raw_energy_nano, token_cost.total_nano)`
            when the provider caps energy by token cost (Neuralwatt surge
            protection), otherwise `raw_energy_nano`.
          format: int64
          type: integer
        energy_millijoules:
          format: int64
          minimum: 0
          type: integer
        rate_nano_per_kwh:
          format: int64
          type: integer
        raw_energy_nano:
          description: Uncapped energy cost (`mJ × rate / 3.6e9`, half-up rounded).
          format: int64
          type: integer
      required:
      - energy_millijoules
      - rate_nano_per_kwh
      - raw_energy_nano
      - effective_capped_nano
      - capped_by_token_cost
      type: object
    EpisodeId:
      description: Opaque identifier for an `Episode` aggregate.
      format: uuid
      type: string
    EpisodeTarget:
      description: |-
        The reviewer's decision for ONE episode group of a preview (issue #581):
        apply the group's rows to an existing episode, or create a new one. The
        number comes from the document's `Ep.:` marker; the API edge pre-checks it
        against the project's existing episodes (409 `episode.number-already-exists`,
        #404 doctrine).
      oneOf:
      - properties:
          episode_id:
            $ref: '#/components/schemas/EpisodeId'
          kind:
            enum:
            - existing
            type: string
        required:
        - episode_id
        - kind
        type: object
      - properties:
          kind:
            enum:
            - create
            type: string
          name:
            type:
            - string
            - 'null'
          number:
            format: int32
            type: integer
        required:
        - number
        - kind
        type: object
    EpisodeView:
      description: |-
        Complete episode read model.

        `updated_at` is sourced from the timestamp of the last applied `EpisodeEvent`.
      properties:
        block_id:
          $ref: '#/components/schemas/BlockId'
        id:
          format: uuid
          type: string
        name:
          type:
          - string
          - 'null'
        number:
          format: int32
          type: integer
        project_id:
          $ref: '#/components/schemas/ProjectId'
          description: |-
            The tenant-level production container this episode belongs to (`project_id`
            on the wire, issue #599).
        updated_at:
          format: date-time
          type: string
        version:
          $ref: '#/components/schemas/AggregateVersion'
          description: Aggregate version for optimistic-locking round-trips.
      required:
      - id
      - block_id
      - project_id
      - number
      - version
      - updated_at
      type: object
    FinishSceneShootRequest:
      properties:
        end_dt:
          format: date-time
          type:
          - string
          - 'null'
        version:
          $ref: '#/components/schemas/AggregateVersion'
      required:
      - version
      type: object
    GDriveCredentialRequest:
      description: |-
        Write-only GDrive credentials. This type intentionally does not implement
        `Debug` or `Serialize`; it is converted immediately at the API edge into a
        non-serializable `GDriveCredentialBundle`.
      properties:
        client_id:
          type: string
        client_secret:
          type: string
        refresh_token:
          type: string
        root_folder_id:
          type:
          - string
          - 'null'
      required:
      - client_id
      - client_secret
      - refresh_token
      type: object
    GDriveCredentialUpdateRequest:
      allOf:
      - $ref: '#/components/schemas/GDriveCredentialRequest'
      - properties:
          version:
            $ref: '#/components/schemas/AggregateVersion'
        required:
        - version
        type: object
    GrantRoleRequest:
      properties:
        role:
          $ref: '#/components/schemas/Role'
          description: New role for the active member (their prior role is replaced).
      required:
      - role
      type: object
    HealthEntry:
      description: Result of one dependency check.
      properties:
        description:
          description: |-
            Human-readable failure/success note (static text — never raw error
            detail, which could leak internal topology).
          type:
          - string
          - 'null'
        duration_ms:
          description: Wall-clock time the check took, in milliseconds.
          format: int64
          minimum: 0
          type: integer
        status:
          $ref: '#/components/schemas/HealthStatus'
        tags:
          description: Free-form tags (`ready`, `live`, …) for probe selection.
          items:
            type: string
          type: array
      required:
      - status
      - duration_ms
      - tags
      type: object
    HealthReport:
      description: Aggregate health report rendered by `GET /v1/health`.
      properties:
        entries:
          additionalProperties:
            $ref: '#/components/schemas/HealthEntry'
          propertyNames:
            type: string
          type: object
        status:
          $ref: '#/components/schemas/HealthStatus'
        total_duration_ms:
          format: int64
          minimum: 0
          type: integer
      required:
      - status
      - total_duration_ms
      - entries
      type: object
    HealthStatus:
      description: Aggregate status of a health report, modelled on .NET's `HealthStatus`.
      enum:
      - Healthy
      - Degraded
      - Unhealthy
      type: string
    IdVersionResponse:
      description: Response for aggregate creation endpoints.
      properties:
        id:
          format: uuid
          type: string
        version:
          $ref: '#/components/schemas/AggregateVersion'
      required:
      - id
      - version
      type: object
    ImageCostBreakdown:
      description: |-
        Image-generation cost of one import (#673 extensibility slot). Always
        `None` for script/schedule text imports.
      properties:
        image_nano_per_unit:
          description: Snapshot of the flat per-image rate, when that billing kind applies.
          format: int64
          type:
          - integer
          - 'null'
        image_output_rate_nano_per_million:
          description: Snapshot of the per-million-token rate, when that billing kind applies.
          format: int64
          type:
          - integer
          - 'null'
        image_output_tokens:
          description: Image-output tokens consumed (the per-token billing path).
          format: int64
          minimum: 0
          type: integer
        images:
          description: Number of generated images.
          format: int64
          minimum: 0
          type: integer
        total_nano:
          format: int64
          type: integer
      required:
      - images
      - image_output_tokens
      - total_nano
      type: object
    InviteMemberRequest:
      properties:
        role:
          $ref: '#/components/schemas/Role'
          description: Proposed role for the invited user (pending until they accept).
        user_id:
          description: OIDC `sub` of the user to invite to the block.
          type: string
      required:
      - user_id
      - role
      type: object
    JobStatus:
      description: |-
        Operational lifecycle of an AI import job.

        `Failed` is the *retryable* state (a due `next_attempt_at` makes the job
        claimable again); `DeadLetter` and `PayloadUnavailable` are terminal.
      enum:
      - pending
      - running
      - succeeded
      - failed
      - dead_letter
      - payload_unavailable
      type: string
    JobTelemetrySummary:
      description: |-
        Telemetry summary as exposed on the `AiImportJob` wire view (issue #675).
        `None` until the worker records telemetry; additive on the wire.
      properties:
        cached_tokens_in:
          format: int64
          minimum: 0
          type: integer
        chunk_count:
          format: int32
          minimum: 0
          type: integer
        doc_kind:
          oneOf:
          - $ref: '#/components/schemas/DocumentKind'
          - type: 'null'
        energy_millijoules:
          format: int64
          minimum: 0
          type: integer
        latency_total_ms:
          format: int64
          minimum: 0
          type: integer
        model:
          type:
          - string
          - 'null'
        provider:
          oneOf:
          - $ref: '#/components/schemas/LlmProvider'
          - type: 'null'
        tokens_in:
          format: int64
          minimum: 0
          type: integer
        tokens_out:
          format: int64
          minimum: 0
          type: integer
      required:
      - chunk_count
      - tokens_in
      - tokens_out
      - cached_tokens_in
      - energy_millijoules
      - latency_total_ms
      type: object
    LexicalSortKey:
      description: |-
        A validated, lexicographically-sortable key used for ordering entities
        (e.g. `ShootingDay`s within an `Episode`) without renumbering siblings.

        The key is a non-empty string over a fixed printable-ASCII alphabet
        (`!`..`~`, i.e. bytes `33..=126`). It carries **no** ordering semantics of
        its own beyond raw byte/lexicographic order, which matches the SQL
        `ORDER BY order_key ASC` semantics of the read model. To insert an entity
        between two existing siblings, use [`LexicalSortKey::midpoint`], which
        produces a key strictly between the two in exactly one event.
      type: string
    LinkContinuityPhotoRequest:
      properties:
        photo_id:
          $ref: '#/components/schemas/PhotoId'
        version:
          $ref: '#/components/schemas/AggregateVersion'
      required:
      - photo_id
      - version
      type: object
    LinkShootingDayResponse:
      description: |-
        The result of one shooting-day link (issue #706): how many scene links
        moved onto the target day and how many `scene_shoot` pairs were planned
        there. A pair already existing on the target is not counted again.
      properties:
        linked_scenes:
          format: int32
          minimum: 0
          type: integer
        planned_scene_shoots:
          format: int32
          minimum: 0
          type: integer
      required:
      - linked_scenes
      - planned_scene_shoots
      type: object
    LlmProvider:
      description: |-
        Curated providers. The enum is intentionally non-exhaustive so adding a
        provider is additive and does not break downstream matches.
      enum:
      - openai
      - gemini
      - openrouter
      - eurouter
      - neuralwatt
      - opencode-go
      - opencode
      - ollama
      type: string
    ManualArchiveJobResult:
      description: One job enqueue outcome.
      properties:
        already_enqueued:
          type: boolean
        job_id:
          format: uuid
          type: string
        kind:
          type: string
        status:
          type: string
      required:
      - kind
      - job_id
      - already_enqueued
      - status
      type: object
    ManualArchiveResponse:
      description: Response body for a manual "archive now" request.
      properties:
        jobs:
          description: Per-kind enqueue results (dedup-aware).
          items:
            $ref: '#/components/schemas/ManualArchiveJobResult'
          type: array
      required:
      - jobs
      type: object
    MembershipStateKind:
      description: |-
        Membership lifecycle state in the read model.

        `snake_case` serialization keeps the Postgres `state` text column stable
        and human-readable.
      enum:
      - pending
      - active
      type: string
    MembershipView:
      description: |-
        Complete membership read model row for one `(block_id, user_id)` pair.

        `joined_at` is the timestamp of the `InvitationAccepted` event, sourced
        from the event stream (not from aggregate state).
      properties:
        block_id:
          $ref: '#/components/schemas/BlockId'
        joined_at:
          format: date-time
          type: string
        role:
          $ref: '#/components/schemas/Role'
        state:
          $ref: '#/components/schemas/MembershipStateKind'
        user_id:
          $ref: '#/components/schemas/UserId'
      required:
      - block_id
      - user_id
      - role
      - state
      - joined_at
      type: object
    MergedPreview:
      properties:
        scenes:
          items:
            $ref: '#/components/schemas/MergedScene'
          type: array
        unmatched_schedule_rows:
          items:
            $ref: '#/components/schemas/ShootingScheduleRow'
          type: array
        unmatched_script_scenes:
          items:
            $ref: '#/components/schemas/SceneView'
          type: array
      required:
      - scenes
      - unmatched_schedule_rows
      - unmatched_script_scenes
      type: object
    MergedScene:
      properties:
        scene:
          $ref: '#/components/schemas/SceneView'
        schedule_rows:
          items:
            $ref: '#/components/schemas/ShootingScheduleRow'
          type: array
      required:
      - scene
      - schedule_rows
      type: object
    MetaCreditsEntry:
      description: |-
        One credit entry (issue #655): LLM co-author or human contributor.

        One wire shape for both kinds so the client renders the word cloud from a
        single payload: `provider` is set (and `roles` empty) for LLM co-authors;
        `roles` is set (and `provider` null) for humans.
      properties:
        name:
          description: Display name — the model name (LLM) or the contributor handle (human).
          type: string
        provider:
          description: Provider/tool for LLM co-authors (e.g. `neuralwatt`); null for humans.
          type:
          - string
          - 'null'
        roles:
          description: Roles for human contributors (e.g. `Developer`); empty for LLMs.
          items:
            type: string
          type: array
      required:
      - name
      - roles
      type: object
    MetaCreditsResponse:
      description: |-
        `GET /v1/meta/credits` response (issue #655): deduped LLM co-authors plus
        the human contributors. LLM entries come first (sorted by name, provider),
        humans second (sorted by name) — a fixed, deterministic order.
      properties:
        credits:
          items:
            $ref: '#/components/schemas/MetaCreditsEntry'
          type: array
      required:
      - credits
      type: object
    MetaVersionsResponse:
      description: Compile-time versions of the workspace crates meaningful to clients.
      properties:
        api:
          description: Version of the `api` crate (the served HTTP surface itself).
          type: string
        core:
          description: Version of the `core` crate (domain logic).
          type: string
        infra:
          description: Version of the `infra` crate (event store, projections).
          type: string
      required:
      - api
      - core
      - infra
      type: object
    ModelInfo:
      properties:
        display_name:
          type:
          - string
          - 'null'
        id:
          type: string
        pricing:
          oneOf:
          - $ref: '#/components/schemas/ModelPricing'
            description: |-
              Pricing snapshot from the `ai_import.ai_model_pricing` read model
              (issue #675). `None` for models without known pricing (e.g. local
              Ollama models) — never a fabricated zero-price object. Additive with
              `serde(default)` on the wire.
          - type: 'null'
        provider:
          $ref: '#/components/schemas/LlmProvider'
        recommended:
          description: |-
            Whether the curated catalog designates this model as the provider's
            recommended default for a new AI-config creation (issue #471). Only
            set by the curated models endpoint (`curated_models`); models fetched
            live from a provider never carry the flag (`false`).

            `#[serde(default)]`: the flag is additive on the wire — a backend
            that predates the field deserializes it as `false`, so clients keep
            their "first model" fallback for pre-flag deployments (CodeRabbit
            review, PR #489).
          type: boolean
      required:
      - id
      - provider
      type: object
    ModelPricing:
      description: |-
        One model's pricing snapshot in integer nano-currency units ($10^{-9}$ of
        the currency unit: `1_000_000_000 = 1.00 USD/EUR`). Rates are per
        1,000,000 tokens. Optional slots stay `None` when the provider does not
        offer the dimension — never a fabricated zero (issue #675).
      properties:
        cached_input_nano_per_million:
          description: |-
            Rate for cache-hit prompt tokens, when the provider reports one.
            Absent means cached tokens are billed at the plain input rate.
          format: int64
          type:
          - integer
          - 'null'
        currency:
          $ref: '#/components/schemas/Currency'
        energy_capped_by_token:
          description: |-
            Neuralwatt surge-protection cap: the energy cost never exceeds the
            token cost of the same call.
          type: boolean
        energy_nano_per_kwh:
          description: |-
            Energy billing rate (e.g. Neuralwatt at `$10.00 / kWh` =
            `10_000_000_000` nano-USD per kWh), when the provider offers it.
          format: int64
          type:
          - integer
          - 'null'
        image_nano_per_unit:
          description: |-
            Alternative flat per-image rate. #673 slot; never combined with
            `image_output_nano_per_million` by a cost computation.
          format: int64
          type:
          - integer
          - 'null'
        image_output_nano_per_million:
          description: |-
            Rate per 1,000,000 image-output tokens (e.g. Gemini *Nano Banana*:
            one 1024×1024 image consumes 1,290 image-output tokens). #673 slot.
          format: int64
          type:
          - integer
          - 'null'
        input_nano_per_million:
          format: int64
          type: integer
        output_nano_per_million:
          format: int64
          type: integer
        price_as_of:
          description: |-
            When this price was captured. A completed job's persisted cost
            snapshot never changes when newer prices arrive.
          format: date-time
          type: string
        pricing_source:
          $ref: '#/components/schemas/PricingSource'
      required:
      - currency
      - input_nano_per_million
      - output_nano_per_million
      - pricing_source
      - price_as_of
      type: object
    PhotoBinding:
      description: |-
        Discriminates what a photo is attached to.

        `Costume` — Anprobe/planning photo (taken before the shoot).
        `Continuity` — continuity photo taken during the shoot; `costume_id` is
        `Option` so prop-only continuity shots are permitted (the edge case).

        The `Default` implementation returns `Costume { costume_id: Uuid::nil() }`
        so that historical `PhotoUploaded` events (pre-binding) deserialise as
        costume photos, matching the backward-compat requirement.
      oneOf:
      - description: Costume (Anprobe) photo — taken before the shoot for planning.
        properties:
          costume:
            description: Costume (Anprobe) photo — taken before the shoot for planning.
            properties:
              costume_id:
                format: uuid
                type: string
            required:
            - costume_id
            type: object
        required:
        - costume
        type: object
      - description: Continuity (Anschluss) photo — taken during the shoot.
        properties:
          continuity:
            description: Continuity (Anschluss) photo — taken during the shoot.
            properties:
              costume_id:
                format: uuid
                type:
                - string
                - 'null'
              scene_shoot_id:
                $ref: '#/components/schemas/SceneShootId'
            required:
            - scene_shoot_id
            type: object
        required:
        - continuity
        type: object
    PhotoBytesQuery:
      description: Query parameters for the photo bytes endpoint.
      properties:
        variant:
          description: 'Variant: "original", "thumb", or "medium". Defaults to "original".'
          type:
          - string
          - 'null'
      type: object
    PhotoId:
      description: |-
        Opaque identifier for a `Photo` aggregate.

        A `Photo` is an event-sourced aggregate that tracks the lifecycle
        (upload, normalisation, variant generation, deletion) of a costume
        photo. Like the other identifiers it is a UUIDv7 opaque value type
        never decoded inside `core`. The actual bytes are stored in Garage
        via the `PhotoStorage` port.
      format: uuid
      type: string
    PhotoVariant:
      description: |-
        The three image variants stored for each photo.

        `Original` is the re-encoded, upright, EXIF-stripped source image
        (quality ~95). `Thumb` is a ~200×200 JPEG (quality 80). `Medium` is
        an ~800×800 JPEG (quality 85). Adding a new variant is additive —
        only the enum gains a variant and the saga gains a generation step.
      enum:
      - Original
      - Thumb
      - Medium
      type: string
    PhotoVariantView:
      description: A single variant's public view.
      properties:
        kind:
          $ref: '#/components/schemas/PhotoVariant'
        size_bytes:
          format: int64
          minimum: 0
          type: integer
        status:
          $ref: '#/components/schemas/VariantStatus'
      required:
      - kind
      - status
      - size_bytes
      type: object
    PhotoView:
      description: Complete photo read model, populated by the projector.
      properties:
        binding:
          $ref: '#/components/schemas/PhotoBinding'
          description: What this photo is attached to (Costume or Continuity).
        content_type:
          type: string
        exif_stripped_at:
          format: date-time
          type:
          - string
          - 'null'
        id:
          $ref: '#/components/schemas/PhotoId'
        size_bytes:
          format: int64
          minimum: 0
          type: integer
        variants:
          items:
            $ref: '#/components/schemas/PhotoVariantView'
          type: array
        version:
          $ref: '#/components/schemas/AggregateVersion'
      required:
      - id
      - content_type
      - size_bytes
      - variants
      - binding
      - version
      type: object
    PlanSceneShootRequest:
      properties:
        planned_order:
          $ref: '#/components/schemas/LexicalSortKey'
      required:
      - planned_order
      type: object
    PricingSource:
      description: |-
        Where a pricing row came from. `CuratedSeed` rows are written by the SQL
        migration so freshly booted, offline deployments have deterministic
        pricing; the refresh worker overwrites them with `ProviderLive` (provider
        `/models` endpoints) or `ModelsDev` (`models.dev/api.json`) rows.
      enum:
      - curated_seed
      - provider_live
      - models_dev
      type: string
    ProblemDetails:
      description: |-
        An RFC 9457 problem document (ADR-031 D1).

        Every error response (status ≥ 400) produced by the API is an instance of
        this document: `type` (derived from `code`), constant English `title`,
        `status`, stable `code`, localized `detail` (English until Tranche 3), and
        the `trace_id` extension for otel correlation.
      example:
        code: concurrency.version-mismatch
        detail: Version conflict
        extensions:
          current_version: 3
          expected_version: 2
        status: 409
        title: Version conflict
        trace_id: 4bf92f3577b34da6a3ce929d0e0e4736
        type: https://docs.breakdown.example/problems/scene.already-scheduled
      properties:
        code:
          description: Stable machine identity `{context}.{reason}` (the client contract).
          example: concurrency.version-mismatch
          type: string
        detail:
          description: Human-readable explanation; localized server-side (Tranche 3).
          example: Version conflict
          type: string
        extensions:
          additionalProperties: {}
          description: Declared S0/S1 extension fields, if any (ADR-031 D4).
          propertyNames:
            type: string
          type:
          - object
          - 'null'
        status:
          description: Canonical HTTP status of this problem.
          example: 409
          format: int32
          minimum: 0
          type: integer
        title:
          description: Constant English title (never localized; cacheable, spec-stable).
          type: string
        trace_id:
          description: W3C trace id of the request's otel span (support correlation).
          example: 4bf92f3577b34da6a3ce929d0e0e4736
          type: string
        type:
          description: Dereferencable documentation anchor, derived from the `code`.
          example: https://docs.breakdown.example/problems/scene.already-scheduled
          type: string
      required:
      - type
      - title
      - status
      - code
      - detail
      - trace_id
      type: object
    ProjectId:
      description: |-
        Opaque identifier for a `Project` — the tenant-level production container.

        `ProjectId` is an opaque UUIDv7 value type introduced by the
        `introduce-season-block-episode-hierarchy` change and renamed from
        `SeriesId` by issue #591 (ADR-035 D1/S1). The rename is **1:1**: the
        position, the UUIDv7 values and the tenant boundary are unchanged (ADR-035
        B1) — only the production-form-specific *word* is gone, so the container no
        longer claims to be a TV show.

        It remains a seam rather than an aggregate: every hierarchy entity
        (Season, Block, Episode) references it, but no `Project` aggregate exists
        yet. The children below it stay `Season`/`Block`/`Episode` until a second
        production form actually lands (ADR-035 D2/D3).

        **Wire and storage spelling (issues #591 and #599).** The *type* is
        `#[serde(transparent)]` over `Uuid`, so a field typed `ProjectId` serializes
        as a bare UUID string. Issue #599 (ADR-035 S1, layer 3) renamed the
        projection columns and every wire-visible property/query parameter from
        `series_id` to `project_id`. Persisted *event payloads* deliberately keep the
        historical key — see the note on [`EventMetadata::project_id`].
      format: uuid
      type: string
    ProjectorHealthSnapshot:
      description: 'Aggregate response of the projector-health read (issue #409).'
      properties:
        checkpoints:
          description: |-
            Checkpoint progress of every partition of every projection — the
            "is the projector advancing?" signal.
          items:
            $ref: '#/components/schemas/CheckpointProgress'
          type: array
        dead_letter_count:
          description: Number of distinct poison events currently dead-lettered.
          format: int64
          type: integer
        dead_letters:
          description: |-
            Latest dead-letter entries, most recently seen first (bounded by the
            request's `limit`).
          items:
            $ref: '#/components/schemas/DeadLetterEntry'
          type: array
      required:
      - dead_letter_count
      - dead_letters
      - checkpoints
      type: object
    RenameEpisodeRequest:
      properties:
        name:
          type:
          - string
          - 'null'
        version:
          $ref: '#/components/schemas/AggregateVersion'
      required:
      - version
      type: object
    RenameSeasonRequest:
      properties:
        title:
          type:
          - string
          - 'null'
        version:
          $ref: '#/components/schemas/AggregateVersion'
      required:
      - version
      type: object
    ReplanSceneShootRequest:
      properties:
        planned_order:
          $ref: '#/components/schemas/LexicalSortKey'
        version:
          $ref: '#/components/schemas/AggregateVersion'
      required:
      - planned_order
      - version
      type: object
    RevokeAiConfigRequest:
      properties:
        version:
          $ref: '#/components/schemas/AggregateVersion'
      required:
      - version
      type: object
    Role:
      description: |-
        Block-scoped costume-department role.

        Roles are **domain-local** and **block-scoped** (Decision 4): the same
        `UserId` may hold a different `Role` in two blocks of the same season
        because staff rotate roles at Block boundaries. The initial v1 set is
        `CostumeDesigner` + `WardrobeSupervisor`, plus `CostumeAssistant` which is
        the default role assigned to the block creator during the owner bootstrap
        (see `BootstrapOwner`).

        **Ubiquitous Language is English.** The enum variants and their `snake_case`
        serde form are the canonical domain vocabulary, so events and projection
        rows are persisted as English strings (`"costume_designer"`,
        `"wardrobe_supervisor"`, `"costume_assistant"`).

        The enum is **open for additive extension** (see `block-membership` spec,
        "Initial role set"): adding a new variant is a non-breaking change for
        writers, but renaming or removing an existing variant is a breaking change
        requiring a separate proposal. Variants are serialized by their stable
        `snake_case` name, so events/rows written today stay readable after a
        future addition.

        `OpsAdmin` (issue #409) is the one deployment-scoped capability: it rides
        on block-scoped membership rows like every other role, but the ops
        predicates check it across **all** blocks (`has_active_ops_role`) because
        projector health is deployment-wide infrastructure state, not production
        data. It cannot be granted through the block-scoped membership API by
        non-ops callers (API-edge escalation guard in the `invite_member` /
        `grant_role` handlers); the first ops holder is bootstrapped via the
        `OPS_ADMIN_SUBS` environment allowlist (see the API policy).
      enum:
      - costume_designer
      - wardrobe_supervisor
      - costume_assistant
      - ops_admin
      type: string
    SceneCostumeBeatView:
      description: |-
        One costume beat of a scene, enriched by the query layer: character and
        costume identity resolved by join (`projection_character`,
        `projection_costume`); a projection miss yields `None`, never an error
        (audit/derived metadata never blocks reads, issue #546).
      properties:
        character_id:
          format: uuid
          type: string
        character_name:
          type:
          - string
          - 'null'
        costume_category_id:
          format: uuid
          type:
          - string
          - 'null'
        costume_category_name:
          type:
          - string
          - 'null'
        costume_id:
          format: uuid
          type: string
        note:
          description: Optional free-text cue for the wardrobe crew.
          type:
          - string
          - 'null'
        order:
          description: Dense, zero-based, unique per character within this scene.
          format: int32
          minimum: 0
          type: integer
      required:
      - character_id
      - costume_id
      - order
      type: object
    SceneDetails:
      properties:
        is_schedule_set:
          type: boolean
        location:
          type:
          - string
          - 'null'
        mood:
          type:
          - string
          - 'null'
        scene_number:
          format: int32
          minimum: 0
          type:
          - integer
          - 'null'
        script_day:
          description: |-
            Fictional script-chronology day (e.g. "1. Spieltag"), distinct
            from the calendar `ShootingDay.date`. Free-form search index.
          type:
          - string
          - 'null'
        summary:
          description: Free-form scene description/prose summary.
          type:
          - string
          - 'null'
      required:
      - is_schedule_set
      type: object
    SceneShootId:
      description: |-
        Opaque identifier for a `SceneShoot` aggregate.

        A `SceneShoot` models the association between a `Scene` and a
        `ShootingDay`, carrying both planned and actual execution data.
        Each `(scene_id, shooting_day_id)` pair gets its own stream.
        Like the other identifiers it is a UUIDv7 opaque value type
        never decoded inside `core`.
      format: uuid
      type: string
    SceneShootStatus:
      description: |-
        The shoot status lifecycle of a `SceneShoot`.

        `Planned` — the scene is planned (Dispo), no execution data yet.
        `Scheduled` — the scene is scheduled but not yet in progress.
        `InProgress` — execution has started (`start_dt` or `actual_order` set).
        `Shot` — the scene shoot is finished (terminal for this pair).
        `Skipped` — the scene was skipped on this shooting day.
      enum:
      - Planned
      - Scheduled
      - InProgress
      - Shot
      - Skipped
      type: string
    SceneShootView:
      description: |-
        Complete scene-shoot read model.

        `updated_at` is sourced from the timestamp of the last applied
        `SceneShootEvent`, not from the UUIDv7 event id.
      properties:
        actual_order:
          oneOf:
          - $ref: '#/components/schemas/LexicalSortKey'
          - type: 'null'
        continuity_photo_ids:
          items:
            $ref: '#/components/schemas/PhotoId'
          type: array
        end_dt:
          format: date-time
          type:
          - string
          - 'null'
        id:
          $ref: '#/components/schemas/SceneShootId'
        notes:
          items:
            $ref: '#/components/schemas/SerializedNote'
          type: array
        planned_order:
          $ref: '#/components/schemas/LexicalSortKey'
        scene_id:
          format: uuid
          type: string
        shooting_day_id:
          $ref: '#/components/schemas/ShootingDayId'
        start_dt:
          format: date-time
          type:
          - string
          - 'null'
        status:
          $ref: '#/components/schemas/SceneShootStatus'
        updated_at:
          format: date-time
          type: string
        version:
          $ref: '#/components/schemas/AggregateVersion'
          description: Aggregate version of the last applied event; echo back in optimistic-locking commands.
      required:
      - id
      - scene_id
      - shooting_day_id
      - planned_order
      - status
      - notes
      - continuity_photo_ids
      - version
      - updated_at
      type: object
    SceneSource:
      description: |-
        Provenance discriminator for how a `Scene` came into existence.

        `Manual` is the user-created path (REST handler). `AiExtracted` marks a
        scene created by the AI script import, carrying the import `document_id`
        (the AI job id) and the `draft_ref` as `external_ref` — the data the EU AI
        Act transparency provenance needs (issue #517).

        `confidence` is `Option<f32>` from day one: the preview pipeline carries no
        model confidence value, so the AI apply records `None` instead of inventing
        one (in contrast to the legacy hard-coded `1.0` on `ShootingDaySource`).

        Serialized as an externally-tagged enum, e.g. `{"Manual":null}` or
        `{"AiExtracted":{"document_id":...,"external_ref":...,"confidence":null}}`,
        which maps directly onto the `source JSONB` projection column.
      oneOf:
      - enum:
        - Manual
        type: string
      - properties:
          AiExtracted:
            properties:
              confidence:
                format: float
                type:
                - number
                - 'null'
              document_id:
                format: uuid
                type: string
              external_ref:
                type:
                - string
                - 'null'
            required:
            - document_id
            type: object
        required:
        - AiExtracted
        type: object
    SceneView:
      description: |-
        Complete scene read model.

        `updated_at` is sourced from the timestamp of the last applied `SceneEvent`,
        not from the UUIDv7 event id (ADR-004 + ADR-015).
      properties:
        assigned_characters:
          items:
            format: uuid
            type: string
          type: array
        costume_beats:
          description: |-
            Ordered costume beats per (character, order) — the scene-side casting
            relation (issue #546). Additive on the wire; empty for scenes without
            beats.
          items:
            $ref: '#/components/schemas/SceneCostumeBeatView'
          type: array
        episode_id:
          $ref: '#/components/schemas/EpisodeId'
        id:
          format: uuid
          type: string
        is_schedule_set:
          type: boolean
        location:
          type:
          - string
          - 'null'
        mood:
          type:
          - string
          - 'null'
        scene_number:
          format: int32
          minimum: 0
          type:
          - integer
          - 'null'
        script_day:
          description: |-
            Fictional script-chronology day (e.g. "1. Spieltag"), distinct
            from the calendar `ShootingDay.date`.
          type:
          - string
          - 'null'
        shooting_day_ids:
          description: Shooting days this scene is scheduled on.
          items:
            $ref: '#/components/schemas/ShootingDayId'
          type: array
        source:
          oneOf:
          - $ref: '#/components/schemas/SceneSource'
            description: |-
              Provenance discriminator (EU AI Act transparency, issue #517).
              `Some(AiExtracted)` marks AI-imported scenes; `Some(Manual)` is the
              user-created path; `None` is only produced by clients that do not know
              the field (legacy caches). Serde-`default`-backed and additive on the
              wire (ADR-021 D3/MINOR).
          - type: 'null'
        summary:
          type:
          - string
          - 'null'
        updated_at:
          format: date-time
          type: string
        version:
          $ref: '#/components/schemas/AggregateVersion'
          description: Aggregate version of the last applied event; echo back in optimistic-locking commands.
      required:
      - id
      - episode_id
      - is_schedule_set
      - shooting_day_ids
      - assigned_characters
      - version
      - updated_at
      type: object
    ScheduleSceneRequest:
      description: Request body for linking a `Scene` to a `ShootingDay`.
      properties:
        shooting_day_id:
          $ref: '#/components/schemas/ShootingDayId'
        version:
          $ref: '#/components/schemas/AggregateVersion'
      required:
      - shooting_day_id
      - version
      type: object
    ScriptContext:
      description: |-
        Static LLM target for script extraction. Optional fields express the
        null-on-doubt rule: uncertain values must not be asserted by the model.
      properties:
        scenes:
          items:
            $ref: '#/components/schemas/DraftScene'
          type: array
        title:
          type:
          - string
          - 'null'
        uncertainties:
          items:
            $ref: '#/components/schemas/Uncertainty'
          type: array
      required:
      - scenes
      - uncertainties
      type: object
    SeasonId:
      description: Opaque identifier for a `Season` aggregate.
      format: uuid
      type: string
    SeasonMembershipDto:
      description: |-
        Season membership DTO — the single source of truth for the client-side
        AUTHZ-GATE (D2 of the `wire-flutter-oidc-auth` change).

        `has_active_costume_role_in_season` is the backend-computed predicate the
        client must NOT re-implement (CQRS-boundary rule). `capabilities` is derived
        server-side from the caller's active costume-dept role; the client consumes
        it with strict parsing (unknown entries reject the DTO).
      properties:
        capabilities:
          items:
            type: string
          type: array
        has_active_costume_role_in_season:
          type: boolean
        season_id:
          format: uuid
          type: string
      required:
      - season_id
      - has_active_costume_role_in_season
      - capabilities
      type: object
    SeasonView:
      description: |-
        Complete season read model.

        `updated_at` is sourced from the timestamp of the last applied `SeasonEvent`.
      properties:
        archived:
          description: |-
            Terminal lifecycle flag (issue #533): `true` once `SeasonArchived` was
            applied. Archived seasons keep number + inventory readable.
          type: boolean
        id:
          format: uuid
          type: string
        number:
          format: int32
          type: integer
        project_id:
          $ref: '#/components/schemas/ProjectId'
          description: |-
            The tenant-level production container this season belongs to (`project_id`
            on the wire, issue #599).
        title:
          type:
          - string
          - 'null'
        updated_at:
          format: date-time
          type: string
        version:
          $ref: '#/components/schemas/AggregateVersion'
          description: Aggregate version for optimistic-locking round-trips.
      required:
      - id
      - project_id
      - number
      - archived
      - version
      - updated_at
      type: object
    SerializedNote:
      description: A note as exposed in the read model (flattened for JSON serialisation).
      properties:
        body:
          type: string
        id:
          format: uuid
          type: string
      required:
      - id
      - body
      type: object
    SeriesMembershipDto:
      description: |-
        Series membership DTO — the series-level counterpart of
        [`SeasonMembershipDto`] for the client-side AUTHZ-GATE mirror of the
        costume-photo policy (issue #535, ADR-035 B2/S2: photos authorize
        series-wide, so the client needs a series-level, backend-computed signal).

        `has_active_costume_role_in_project` is the backend-computed predicate the
        client must NOT re-implement (CQRS-boundary rule). `capabilities` reuses
        the same v1 mapping; the photo gates read the predicate field directly.
      properties:
        capabilities:
          items:
            type: string
          type: array
        has_active_costume_role_in_series:
          type: boolean
        project_id:
          format: uuid
          type: string
      required:
      - project_id
      - has_active_costume_role_in_series
      - capabilities
      type: object
    SetActualOrderRequest:
      properties:
        actual_order:
          $ref: '#/components/schemas/LexicalSortKey'
        version:
          $ref: '#/components/schemas/AggregateVersion'
      required:
      - actual_order
      - version
      type: object
    SetCostumeCategoryRequest:
      description: |-
        Set (or clear) the costume's single category (issue #543). `category_id:
        None` clears the binding.
      properties:
        category_id:
          format: uuid
          type:
          - string
          - 'null'
        version:
          $ref: '#/components/schemas/AggregateVersion'
      required:
      - version
      type: object
    SettingsView:
      description: |-
        Reference view of an external credential binding. It contains no secret
        material or ciphertext.

        `owner` is the identity that bound the credential, recovered by the
        projector from `EventMetadata.actor` (issue #552). `None` for legacy rows
        projected before the column existed — the AI-config API edge treats an
        unknown owner as "not owned by the caller" (fail closed). Recovery is
        re-projection only (runbook §10); rotation deliberately does not backfill.
      properties:
        binding_state:
          $ref: '#/components/schemas/CredentialBindingState'
        id:
          format: uuid
          type: string
        owner:
          oneOf:
          - $ref: '#/components/schemas/UserId'
            description: |-
              Authenticated principal (`OIDC sub`) that created/owns the binding.
              `None` only for legacy rows awaiting re-projection or rotation backfill.
          - type: 'null'
        provider:
          type: string
        vault_key_id:
          type: string
        vault_version:
          format: int64
          minimum: 0
          type: integer
        version:
          $ref: '#/components/schemas/AggregateVersion'
      required:
      - id
      - provider
      - vault_key_id
      - vault_version
      - binding_state
      - version
      type: object
    ShootDayRow:
      description: A single row in the Shoot Day (execution / Ist) report.
      properties:
        actual_order:
          oneOf:
          - $ref: '#/components/schemas/LexicalSortKey'
          - type: 'null'
        continuity_photo_ids:
          items:
            $ref: '#/components/schemas/PhotoId'
          type: array
        end_dt:
          format: date-time
          type:
          - string
          - 'null'
        location:
          type:
          - string
          - 'null'
        notes:
          items:
            $ref: '#/components/schemas/SerializedNote'
          type: array
        scene_id:
          format: uuid
          type: string
        scene_number:
          format: int32
          minimum: 0
          type:
          - integer
          - 'null'
        script_day:
          type:
          - string
          - 'null'
        start_dt:
          format: date-time
          type:
          - string
          - 'null'
        status:
          $ref: '#/components/schemas/SceneShootStatus'
      required:
      - scene_id
      - status
      - notes
      - continuity_photo_ids
      type: object
    ShootingDayId:
      description: |-
        Opaque identifier for a `ShootingDay` aggregate.

        A `ShootingDay` is an Episode-scoped scheduling unit (a Drehtag). It is its
        own event-sourced aggregate, so it gets a dedicated UUIDv7 opaque id that
        is never decoded inside `core`.
      format: uuid
      type: string
    ShootingDaySource:
      description: |-
        Provenance discriminator for how a `ShootingDay` came into existence.

        `Manual` is the user-created path. `AiExtracted` marks a day created by the
        AI schedule import, carrying the import `document_id` (the AI job id), an
        optional `external_ref` and the extraction `confidence`.

        `confidence` is `Option<f32>` (issue #517): the import has no per-model or
        per-row confidence value, so the apply records `None` — the former
        hard-coded `1.0` was a misleading constant. Persisted events with a plain
        numeric value (pre-change apply) deserialize losslessly as `Some(...)`.

        Serialized as an externally-tagged enum, e.g. `{"Manual":null}` or
        `{"AiExtracted":{"document_id":...,"external_ref":...,"confidence":...}}`,
        which maps directly onto the `source JSONB` projection column.
      oneOf:
      - enum:
        - Manual
        type: string
      - properties:
          AiExtracted:
            properties:
              confidence:
                format: float
                type:
                - number
                - 'null'
              document_id:
                format: uuid
                type: string
              external_ref:
                type:
                - string
                - 'null'
            required:
            - document_id
            type: object
        required:
        - AiExtracted
        type: object
    ShootingDayView:
      description: |-
        Complete shooting-day read model.

        `updated_at` is sourced from the timestamp of the last applied
        `ShootingDayEvent`, not from the UUIDv7 event id.
      properties:
        archived:
          type: boolean
        date:
          format: date
          type:
          - string
          - 'null'
        episode_id:
          $ref: '#/components/schemas/EpisodeId'
        id:
          $ref: '#/components/schemas/ShootingDayId'
        label:
          type:
          - string
          - 'null'
        order_key:
          $ref: '#/components/schemas/LexicalSortKey'
        source:
          $ref: '#/components/schemas/ShootingDaySource'
        updated_at:
          format: date-time
          type: string
        version:
          $ref: '#/components/schemas/AggregateVersion'
          description: Aggregate version of the last applied event; echo back in optimistic-locking commands.
        wrapped_at:
          description: When this shooting day was wrapped (finalised). `None` means open.
          format: date-time
          type:
          - string
          - 'null'
      required:
      - id
      - episode_id
      - order_key
      - source
      - archived
      - version
      - updated_at
      type: object
    ShootingSchedule:
      properties:
        block_id:
          oneOf:
          - $ref: '#/components/schemas/BlockId'
          - type: 'null'
        rows:
          items:
            $ref: '#/components/schemas/ShootingScheduleRow'
          type: array
      required:
      - rows
      type: object
    ShootingScheduleRow:
      properties:
        date:
          format: date
          type:
          - string
          - 'null'
        episode_number:
          description: |-
            The episode half of a dot-separated `<Episode>.<Scene>` schedule
            reference (`"294.10"` → `Some(294)`, plain `"10"` → `None`) — issue
            #721. Additive on the wire: previews stored before this field existed
            still deserialize.
          format: int32
          type:
          - integer
          - 'null'
        location:
          type:
          - string
          - 'null'
        order:
          format: int32
          minimum: 0
          type:
          - integer
          - 'null'
        row_ref:
          type: string
        scene_number:
          format: int32
          minimum: 0
          type:
          - integer
          - 'null'
        shooting_day_label:
          type:
          - string
          - 'null'
        shooting_day_score:
          description: |-
            Hybrid quality score of this row's day assignment (issue #722),
            aggregated per `DraftShootingDay` group on the script path. `None`
            without a decision model / failed pass. Additive on the wire.
          format: float
          type:
          - number
          - 'null'
      required:
      - row_ref
      type: object
    SkipSceneShootRequest:
      properties:
        version:
          $ref: '#/components/schemas/AggregateVersion'
      required:
      - version
      type: object
    SollIstDiffRow:
      description: The Soll-Ist-Vergleich diff report for a single scene.
      properties:
        actual_order:
          oneOf:
          - $ref: '#/components/schemas/LexicalSortKey'
          - type: 'null'
        location:
          type:
          - string
          - 'null'
        missing:
          description: '`true` when planned but without execution data.'
          type: boolean
        moved:
          description: '`true` when `actual_order` differs from `planned_order`.'
          type: boolean
        planned_order:
          oneOf:
          - $ref: '#/components/schemas/LexicalSortKey'
          - type: 'null'
        reshot_candidate:
          description: '`true` when the same scene_id has a `Shot` record on another day.'
          type: boolean
        scene_id:
          format: uuid
          type: string
        scene_number:
          format: int32
          minimum: 0
          type:
          - integer
          - 'null'
        script_day:
          type:
          - string
          - 'null'
        skipped:
          description: '`true` when status is `Skipped`.'
          type: boolean
      required:
      - scene_id
      - moved
      - missing
      - skipped
      - reshot_candidate
      type: object
    SollIstReport:
      description: The overall Soll-Ist report.
      properties:
        is_final:
          type: boolean
        rows:
          items:
            $ref: '#/components/schemas/SollIstDiffRow'
          type: array
      required:
      - rows
      - is_final
      type: object
    SourceFormat:
      description: |-
        The declared format of an AI import source document, captured at the API
        edge from the upload's `Content-Type` and persisted on the job so the
        schedule worker can pick the extraction path without re-guessing the bytes
        (issue #221).

        Only `Csv` is parsed natively; `Pdf` and `PlainText` are routed through the
        LLM extraction path. Scripts are always `Pdf`.
      enum:
      - csv
      - pdf
      - plain_text
      type: string
    StartSceneShootRequest:
      properties:
        start_dt:
          format: date-time
          type:
          - string
          - 'null'
        version:
          $ref: '#/components/schemas/AggregateVersion'
      required:
      - version
      type: object
    TokenCostBreakdown:
      description: |-
        Token-based cost of one import, in nano-units. Rates are the snapshot
        rates active at completion time.
      properties:
        cached_input_rate_nano_per_million:
          description: |-
            Snapshot cache-hit rate; `None` when the catalog had none (cached
            tokens are then billed at the plain input rate).
          format: int64
          type:
          - integer
          - 'null'
        cached_tokens_in:
          format: int64
          minimum: 0
          type: integer
        input_rate_nano_per_million:
          format: int64
          type: integer
        output_rate_nano_per_million:
          format: int64
          type: integer
        tokens_in:
          format: int64
          minimum: 0
          type: integer
        tokens_out:
          format: int64
          minimum: 0
          type: integer
        total_nano:
          description: |-
            `uncached_input + cached_input + output` cost, half-up rounded to
            nano-units, as one total.
          format: int64
          type: integer
      required:
      - tokens_in
      - tokens_out
      - cached_tokens_in
      - input_rate_nano_per_million
      - output_rate_nano_per_million
      - total_nano
      type: object
    UnappliedCostume:
      description: |-
        Why a costume row did not become a `Costume`. Shown to the reviewer as
        *missing with a reason* instead of as a successful apply.
      properties:
        character_name:
          type: string
        description:
          type: string
        detail:
          description: |-
            Short diagnostic (e.g. the rejection the aggregate returned). The UI
            branches on [`Self::reason`], never on this text.
          type:
          - string
          - 'null'
        draft_ref:
          type: string
        ordinal:
          minimum: 0
          type: integer
        reason:
          $ref: '#/components/schemas/UnappliedCostumeReason'
      required:
      - draft_ref
      - ordinal
      - character_name
      - description
      - reason
      type: object
    UnappliedCostumeReason:
      enum:
      - character_not_planned
      - character_unavailable
      - create_rejected
      - notes_rejected
      - binding_rejected
      - beat_rejected
      type: string
    Uncertainty:
      properties:
        field:
          type: string
        kind:
          $ref: '#/components/schemas/UncertaintyKind'
          description: |-
            `serde(default)` so a preview stored before this field existed keeps
            blocking exactly as it did: an absent kind is a `FieldAmbiguity`.
        note:
          type: string
        scene_index:
          minimum: 0
          type: integer
        suggested_value:
          type:
          - string
          - 'null'
      required:
      - scene_index
      - field
      - note
      type: object
    UncertaintyAcknowledgement:
      description: |-
        The reviewer's acknowledgement of ONE blocking uncertainty (issue #663).

        Request-carried by design: a stored preview is an immutable payload blob
        (content-addressed handle, no update path), so the resolution lives in the
        apply request next to the other reviewer decisions (`mappings`,
        `episode_groups`) instead of mutating the preview. Acknowledge semantics:
        the reviewer confirms the ambiguous (or absent) value is acceptable and the
        row applies as extracted — `Uncertainty.suggested_value` is display-only;
        correcting a *wrong* value happens post-apply via normal scene editing.
        Identifying pair is `(scene_index, field)` — exactly the fields the
        extraction prompt reports an uncertainty with.
      properties:
        field:
          description: The field the uncertainty names (`Uncertainty.field`).
          type: string
        scene_index:
          description: The scene the uncertainty is attached to (`Uncertainty.scene_index`).
          minimum: 0
          type: integer
      required:
      - scene_index
      - field
      type: object
    UncertaintyKind:
      description: |-
        Why the reviewer is shown an uncertainty.

        The distinction is what the apply gate turns on. It did not exist before the
        costume work: the gate blocked a whole preview on *any* uncertainty, which is
        right for a field the model could not read, but would have made a single
        rejected costume row unappliable for an entire 85-chunk import — with a paid
        re-import as the only remedy, since a stored preview is immutable and a
        reviewer has no way to dismiss an entry.
      enum:
      - field_ambiguity
      - dropped_row
      type: string
    UpdateAiConfigRequest:
      properties:
        assistant_model:
          type: string
        cost_display_preference:
          oneOf:
          - $ref: '#/components/schemas/CostDisplayPreference'
            description: |-
              See [`CreateAiConfigRequest`] (issue #675). `None` (omitted) keeps
              the stored preference — an omitted field must not reset an existing
              `energy` preference back to `token`.
          - type: 'null'
        decision_model:
          type:
          - string
          - 'null'
        decision_provider:
          oneOf:
          - $ref: '#/components/schemas/LlmProvider'
            description: |-
              Decision Model slot (issue #722), tri-state: an omitted field keeps
              the stored configuration, `null` clears it, a value replaces it.
              `deserialize_optional_nullable` is what makes the outer `Some` an
              EXPLICIT signal — plain `#[serde(default)]` would fold `null` and
              "absent" together and the clear path would be unreachable.
          - type: 'null'
        decision_vault_key_id:
          type:
          - string
          - 'null'
        image_model:
          type:
          - string
          - 'null'
        prompts:
          additionalProperties:
            type: string
          propertyNames:
            description: The two document kinds supported by the import pipeline.
            enum:
            - script
            - schedule
            type: string
          type: object
        provider:
          $ref: '#/components/schemas/LlmProvider'
        vault_key_id:
          type: string
        version:
          $ref: '#/components/schemas/AggregateVersion'
      required:
      - provider
      - assistant_model
      - prompts
      - vault_key_id
      - version
      type: object
    UpdateBlockTimeSpanRequest:
      properties:
        end_date:
          format: date
          type:
          - string
          - 'null'
        start_date:
          format: date
          type:
          - string
          - 'null'
        version:
          $ref: '#/components/schemas/AggregateVersion'
      required:
      - version
      type: object
    UpdateCharacterCategoryRequest:
      properties:
        category:
          $ref: '#/components/schemas/CharacterCategory'
        version:
          $ref: '#/components/schemas/AggregateVersion'
      required:
      - category
      - version
      type: object
    UpdateContactInfoRequest:
      properties:
        contact_info:
          $ref: '#/components/schemas/ContactInfo'
        version:
          $ref: '#/components/schemas/AggregateVersion'
      required:
      - contact_info
      - version
      type: object
    UpdateCostumeCategoryRequest:
      properties:
        name:
          type:
          - string
          - 'null'
        order_key:
          oneOf:
          - $ref: '#/components/schemas/LexicalSortKey'
          - type: 'null'
        version:
          $ref: '#/components/schemas/AggregateVersion'
      required:
      - version
      type: object
    UpdateCostumeDetailRequest:
      description: |-
        Replace an existing costume detail in full (issue #544).

        The body carries the **whole** detail, not a patch: a patch-merge would
        leave the field merging to the client and make an emptied `subject`
        ambiguous (cleared on purpose vs. lost). `detail.id` must equal the
        `detail_id` path parameter — the aggregate validates the id against its
        state and answers 404 `costume-detail.not-found` without emitting an
        event when the detail is unknown.
      properties:
        detail:
          $ref: '#/components/schemas/CostumeDetailRequest'
        version:
          $ref: '#/components/schemas/AggregateVersion'
      required:
      - detail
      - version
      type: object
    UpdateCostumeNotesRequest:
      properties:
        notes:
          type: string
        version:
          $ref: '#/components/schemas/AggregateVersion'
      required:
      - notes
      - version
      type: object
    UpdateMeasurementsRequest:
      properties:
        measurements:
          $ref: '#/components/schemas/CharacterMeasurements'
        version:
          $ref: '#/components/schemas/AggregateVersion'
      required:
      - measurements
      - version
      type: object
    UpdateNoteRequest:
      properties:
        body:
          type: string
        version:
          $ref: '#/components/schemas/AggregateVersion'
      required:
      - body
      - version
      type: object
    UpdateSceneCostumeBeatRequest:
      description: |-
        Request body for updating a costume beat in place at the path-addressed
        `(character_id, order)` (issue #546).
      properties:
        costume_id:
          format: uuid
          type: string
        note:
          type:
          - string
          - 'null'
        version:
          $ref: '#/components/schemas/AggregateVersion'
      required:
      - costume_id
      - version
      type: object
    UpdateSceneDetailsRequest:
      properties:
        details:
          $ref: '#/components/schemas/SceneDetails'
        version:
          $ref: '#/components/schemas/AggregateVersion'
      required:
      - details
      - version
      type: object
    UpdateShootingDayRequest:
      description: |-
        Request body for mutating a `ShootingDay`.

        Exactly one of `order_key` / `date` / `label` should be set; the handler
        dispatches the matching command (reorder > reschedule > rename). `date`
        and `label` are presence-tracked (`Option<Option<..>>`): an absent field
        means "no update", an explicit JSON `null` (`Some(None)`) clears the
        value (unschedule / rename-to-null), and a value (`Some(Some(v))`) sets it.
      properties:
        date:
          format: date
          type:
          - string
          - 'null'
        label:
          type:
          - string
          - 'null'
        order_key:
          oneOf:
          - $ref: '#/components/schemas/LexicalSortKey'
          - type: 'null'
        version:
          $ref: '#/components/schemas/AggregateVersion'
      required:
      - version
      type: object
    UserId:
      description: |-
        Opaque identifier for a user, wrapping the OIDC `sub` claim.

        `UserId` references the authenticated principal without ever decoding,
        storing, or dereferencing identity attributes in `core`. The backend only
        trusts the IdP-issued `sub`; account lifecycle lives exclusively in the
        OIDC provider (ADR-010). Unlike the hierarchy ids, `UserId` is *not* a
        UUIDv7 — it is the raw string subject the IdP assigns.
      type: string
    VariantStatus:
      description: |-
        The generation status of a single photo variant.

        Every variant starts as `Pending` on upload. The thumbnail saga
        transitions it to `Ready` on success or `Failed` on error.
      enum:
      - Pending
      - Ready
      - Failed
      type: string
    VersionRequest:
      properties:
        version:
          $ref: '#/components/schemas/AggregateVersion'
      required:
      - version
      type: object
    WrapShootingDayRequest:
      properties:
        version:
          $ref: '#/components/schemas/AggregateVersion'
      required:
      - version
      type: object
info:
  description: |-
    Costume scheduling API for Breakdown RS (ADR-006). Routes are mounted under the /v1 path prefix; the path version is bumped only on a breaking wire change (ADR-021).
    Error contract (ADR-031): every error response (status ≥ 400) is an RFC 9457 `application/problem+json` document carrying a stable `code` (`{context}.{reason}` kebab-case) and a `trace_id` extension. The full code registry is exposed under `x-code-registry`; per-code documentation lives at `docs/errors/`.
  license:
    identifier: AGPL-3.0
    name: AGPL-3.0
  title: Breakdown RS API
  version: v1
openapi: 3.1.0
paths:
  /v1/ai-import/config:
    get:
      operationId: list_ai_configs
      parameters:
      - in: query
        name: limit
        required: false
        schema:
          default: 50
          format: int64
          type:
          - integer
          - 'null'
      - in: query
        name: offset
        required: false
        schema:
          default: 0
          format: int64
          type:
          - integer
          - 'null'
      - in: query
        name: episode_id
        required: false
        schema:
          oneOf:
          - $ref: '#/components/schemas/EpisodeId'
          - type: 'null'
      - in: query
        name: season_id
        required: false
        schema:
          oneOf:
          - $ref: '#/components/schemas/SeasonId'
          - type: 'null'
      - in: query
        name: project_id
        required: false
        schema:
          oneOf:
          - $ref: '#/components/schemas/ProjectId'
          - type: 'null'
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/AiConfigView'
                type: array
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      tags:
      - handlers
    post:
      operationId: create_ai_config
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAiConfigRequest'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdVersionResponse'
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      tags:
      - handlers
  /v1/ai-import/config/{id}:
    get:
      operationId: get_ai_config
      parameters:
      - in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiConfigView'
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      tags:
      - handlers
    patch:
      operationId: update_ai_config
      parameters:
      - in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAiConfigRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AggregateVersion'
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      tags:
      - handlers
  /v1/ai-import/config/{id}/revoke:
    post:
      operationId: revoke_ai_config
      parameters:
      - in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RevokeAiConfigRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AggregateVersion'
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      tags:
      - handlers
  /v1/ai-import/defaults:
    get:
      operationId: get_ai_import_defaults
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiImportDefaults'
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '503':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      tags:
      - handlers
  /v1/ai-import/jobs:
    get:
      operationId: list_ai_import_jobs
      parameters:
      - in: query
        name: limit
        required: false
        schema:
          default: 50
          format: int64
          type:
          - integer
          - 'null'
      - in: query
        name: offset
        required: false
        schema:
          default: 0
          format: int64
          type:
          - integer
          - 'null'
      - in: query
        name: episode_id
        required: false
        schema:
          oneOf:
          - $ref: '#/components/schemas/EpisodeId'
          - type: 'null'
      - in: query
        name: season_id
        required: false
        schema:
          oneOf:
          - $ref: '#/components/schemas/SeasonId'
          - type: 'null'
      - in: query
        name: project_id
        required: false
        schema:
          oneOf:
          - $ref: '#/components/schemas/ProjectId'
          - type: 'null'
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/AiImportJobResponse'
                type: array
        '400':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      tags:
      - handlers
  /v1/ai-import/jobs/{id}:
    delete:
      operationId: delete_ai_import_job
      parameters:
      - in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
      responses:
        '204':
          description: AI import job deleted; payloads removed and the dedup key freed
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
          description: Not authorized for this job
        '404':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
          description: Job not found (or already deleted)
        '409':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
          description: Job is not in a deletable (terminal) state
        '503':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
          description: Payload storage unavailable; nothing was deleted
      tags:
      - handlers
    get:
      operationId: get_ai_import_job
      parameters:
      - in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiImportJobResponse'
        '404':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      tags:
      - handlers
  /v1/ai-import/jobs/{id}/apply:
    post:
      operationId: apply_ai_import
      parameters:
      - in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplyAiImportRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplyAiImportResponse'
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      tags:
      - handlers
  /v1/ai-import/jobs/{id}/events:
    get:
      description: |-
        Snapshot-first: the first frame on every initial connect AND every
        `Last-Event-ID` reconnect is the full authoritative
        [`AiImportJobResponse`] — no catch-up polling and no server-side replay
        buffer are needed (the header is accepted per the SSE contract, but a
        fresh snapshot makes replaying old events unnecessary).

        Subsequent frames are pushed via the queue's storage-agnostic
        [`subscribe`](breakdown_core::ai::AiImportQueue::subscribe) wake-up port;
        every frame re-reads the authoritative row, so duplicate notifications
        (local hub + echoed `pg_notify`) and receiver lag are harmless.

        The stream closes immediately after emitting a frame whose job status is
        terminal (`succeeded`, `dead_letter`, `payload_unavailable`); retryable
        `failed` keeps it open across the backoff window.
      operationId: stream_ai_import_job_events
      parameters:
      - in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
      responses:
        '200':
          content:
            text/event-stream: {}
          description: 'SSE stream of AiImportJobResponse frames (event: job)'
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
          description: Not authorized
        '404':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
          description: Job not found or AI import disabled
      summary: 'Push-based job progress stream (issue #664, ADR-038 D1).'
      tags:
      - handlers
  /v1/ai-import/jobs/{id}/preview:
    get:
      operationId: get_ai_import_preview
      parameters:
      - in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiImportPreviewResponse'
        '404':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '422':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      tags:
      - handlers
  /v1/ai-import/providers:
    get:
      operationId: list_ai_providers
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/AiProviderInfo'
                type: array
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      tags:
      - handlers
  /v1/ai-import/providers/{provider}/decision-models:
    get:
