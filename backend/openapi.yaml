        binds `user_id` to the authenticated `sub`, so a caller can only accept
        their own invitation. Gated `Authenticated` (not `BlockMember`) because the
        invitee is not yet an active member; the domain command enforces that a
        pending invitation exists for this block.
      operationId: accept_invitation
      parameters:
      - description: Block id
        in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
      responses:
        '204':
          description: Invitation accepted; caller is now an active member
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
          description: Unauthorized
        '409':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
          description: No pending invitation for the caller in this block
      summary: Accept a pending invitation for the authenticated caller.
      tags:
      - handlers
  /v1/blocks/{id}/members/leave:
