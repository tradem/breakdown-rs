      - handlers
    post:
      description: |-
        Gated `BlockMember`: the caller must be an active member of the active
        block (see `authorize_middleware`). The actor is the authenticated caller.
      operationId: invite_member
      parameters:
      - description: Block id
        in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InviteMemberRequest'
        required: true
      responses:
        '204':
          description: Invitation created (pending until the invitee accepts)
        '400':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
          description: Invalid request (e.g., malformed user_id)
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
          description: Caller is not an active member of the active block (X-Active-Block header)
        '409':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
          description: Conflicting state (e.g., user is already a member)
      summary: Invite a user to the block with a proposed role (pending until accepted).
      tags:
      - handlers
  /v1/blocks/{id}/members/accept:
