          type: boolean
        moved:
          description: '`true` when `actual_order` differs from `planned_order`.'
          type: boolean
        planned_order:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/LexicalSortKey'
        reshot_candidate:
          description: '`true` when the same scene_id has a `Shot` record on another day.'
          type: boolean
        scene_id:
          format: uuid
          type: string
        scene_number:
          format: int32
          minimum: 0
          type:
          - integer
          - 'null'
        script_day:
          type:
          - string
          - 'null'
        skipped:
          description: '`true` when status is `Skipped`.'
          type: boolean
      required:
      - scene_id
      - moved
      - missing
      - skipped
      - reshot_candidate
      type: object
    SollIstReport:
