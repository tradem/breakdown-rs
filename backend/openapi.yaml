  /v1/costumes/{costume_id}/photos:
    post:
      description: |-
        The request body is raw image bytes; the `Content-Type` header MUST be one of
        `image/jpeg`, `image/png`, or `image/webp`. HEIC/HEIF is rejected with 415.
        The file size MUST NOT exceed `PHOTO_MAX_SIZE_MB` (default 20 MB).
        Authorization is checked per-request via season-scoped membership.
      operationId: upload_costume_photo
      parameters:
      - description: Costume id
        in: path
        name: costume_id
        required: true
        schema:
          format: uuid
          type: string
      requestBody:
        content:
          image/jpeg:
            schema:
              type: string
        description: Raw image bytes (JPEG/PNG/WebP)
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhotoView'
          description: Photo uploaded
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
          description: Not authorized
        '413':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
          description: Payload too large
        '415':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
          description: Unsupported media type
        '422':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
          description: Validation error
      summary: Upload a photo and link it to a costume.
      tags:
      - handlers
  /v1/costumes/{costume_id}/photos/{photo_id}:
    delete:
      description: |-
        Authorization is checked per-request via season-scoped membership.
        The photo bytes are only deleted when the refcount reaches zero.
      operationId: delete_costume_photo
      parameters:
      - description: Costume id
        in: path
        name: costume_id
        required: true
        schema:
          format: uuid
          type: string
      - description: Photo id
        in: path
        name: photo_id
        required: true
        schema:
          format: uuid
          type: string
      responses:
        '204':
          description: Photo unlinked
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
          description: Not authorized
        '404':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
          description: Costume not found
      summary: Unlink a photo from a costume (deletion saga handles refcount + bytes cleanup).
      tags:
      - handlers
  /v1/costumes/{costume_id}/photos/{photo_id}/bytes:
    get:
      description: |-
        Authorization is checked on every request via season-scoped membership.
        The response includes `Cache-Control: private, max-age=300`.
      operationId: get_costume_photo_bytes
      parameters:
      - description: Costume id
        in: path
        name: costume_id
        required: true
        schema:
          format: uuid
          type: string
      - description: Photo id
        in: path
        name: photo_id
        required: true
        schema:
          format: uuid
          type: string
      - description: 'Variant: original, thumb, or medium'
        in: query
        name: variant
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            image/jpeg:
              schema:
                description: Raw costume photo variant bytes (JPEG/PNG/WebP).
                format: binary
                type: string
          description: Photo bytes
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
          description: Not authorized
        '404':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
          description: Photo or costume not found
      summary: Download photo bytes (proxy download with per-request authorization).
      tags:
      - handlers
