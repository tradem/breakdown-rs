        existed; a detail was permanent once added. The body is a `VersionRequest`
        — the echo of the **costume** aggregate's version, the same fence every
        other costume write uses.
      operationId: remove_costume_detail
      parameters:
      - description: Costume id
        in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
      - description: Costume detail id
        in: path
        name: detail_id
        required: true
        schema:
          format: uuid
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VersionRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AggregateVersion'
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
          description: Caller holds no costume role in any season scope of the costume
        '404':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
          description: Costume or detail not found
        '409':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
          description: Version conflict
        '422':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
          description: Validation error
      summary: 'Remove a costume detail (issue #544).'
      tags:
      - handlers
    patch:
      description: |-
        The command carries the full detail, so the event is a snapshot: replay
        needs no field-merge logic and the projector reuses its `DetailAdded`
        upsert unchanged (no migration). An unknown `detail_id` is rejected by the
        aggregate **before** any event is appended, so a typo can never create a
        second detail.
      operationId: update_costume_detail
      parameters:
      - description: Costume id
        in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
      - description: Costume detail id
        in: path
        name: detail_id
        required: true
        schema:
          format: uuid
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCostumeDetailRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AggregateVersion'
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
          description: Caller holds no costume role in any season scope of the costume
        '404':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
          description: Costume or detail not found
        '409':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
          description: Version conflict
        '422':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
          description: Validation error
      summary: 'Replace an existing costume detail in place (issue #544).'
      tags:
      - handlers
