tags:
- description: 'Production hierarchy: Series > Season'
  name: Seasons
- description: 'Production hierarchy: Season > Block'
  name: Blocks
- description: 'Production hierarchy: Season > Episode'
  name: Episodes
- description: Scene read/write endpoints (scoped to an Episode)
  name: Scenes
- description: Character read/write endpoints (scoped to a Season)
  name: Characters
- description: Costume read/write endpoints (scope-free; bound to a Character)
  name: Costumes
- description: Costume photo upload/download/delete endpoints
  name: Photos
