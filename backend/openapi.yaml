      - provider
      - vault_key_id
      - vault_version
      - binding_state
      - version
      type: object
    ShootDayRow:
      description: A single row in the Shoot Day (execution / Ist) report.
      properties:
        actual_order:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/LexicalSortKey'
        continuity_photo_ids:
          items:
            $ref: '#/components/schemas/PhotoId'
          type: array
        end_dt:
          format: date-time
          type:
          - string
          - 'null'
        location:
          type:
          - string
          - 'null'
        notes:
          items:
            $ref: '#/components/schemas/SerializedNote'
          type: array
        scene_id:
          format: uuid
          type: string
        scene_number:
          format: int32
          minimum: 0
          type:
          - integer
          - 'null'
        script_day:
          type:
          - string
          - 'null'
        start_dt:
          format: date-time
          type:
          - string
          - 'null'
        status:
          $ref: '#/components/schemas/SceneShootStatus'
      required:
      - scene_id
      - status
      - notes
      - continuity_photo_ids
      type: object
    ShootingDayId:
      description: |-
        Opaque identifier for a `ShootingDay` aggregate.

        A `ShootingDay` is an Episode-scoped scheduling unit (a Drehtag). It is its
        own event-sourced aggregate, so it gets a dedicated UUIDv7 opaque id that
        is never decoded inside `core`.
      format: uuid
      type: string
    ShootingDaySource:
      description: |-
        Provenance discriminator for how a `ShootingDay` came into existence.

        `Manual` is the user-created path. `AiExtracted` reserves the shape for the
        future AI call-sheet extraction increment; retrofitting this onto already
        persisted events would be impossible, so the field exists from day one.

        Serialized as an externally-tagged enum, e.g. `{"Manual":null}` or
        `{"AiExtracted":{"document_id":...,"external_ref":...,"confidence":...}}`,
        which maps directly onto the `source JSONB` projection column.
      oneOf:
      - enum:
        - Manual
        type: string
      - properties:
          AiExtracted:
            properties:
              confidence:
                format: float
                type: number
              document_id:
                format: uuid
                type: string
              external_ref:
                type:
                - string
                - 'null'
            required:
            - document_id
            - confidence
            type: object
        required:
        - AiExtracted
        type: object
    ShootingDayView:
      description: |-
        Complete shooting-day read model.

        `updated_at` is sourced from the timestamp of the last applied
        `ShootingDayEvent`, not from the UUIDv7 event id.
      properties:
        archived:
          type: boolean
        date:
          format: date
          type:
          - string
          - 'null'
        episode_id:
          $ref: '#/components/schemas/EpisodeId'
        id:
          $ref: '#/components/schemas/ShootingDayId'
        label:
          type:
          - string
          - 'null'
        order_key:
          $ref: '#/components/schemas/LexicalSortKey'
        source:
          $ref: '#/components/schemas/ShootingDaySource'
        updated_at:
          format: date-time
          type: string
        version:
          $ref: '#/components/schemas/AggregateVersion'
          description: Aggregate version of the last applied event; echo back in optimistic-locking commands.
        wrapped_at:
          description: When this shooting day was wrapped (finalised). `None` means open.
          format: date-time
          type:
          - string
          - 'null'
      required:
      - id
      - episode_id
      - order_key
      - source
      - archived
      - version
      - updated_at
      type: object
    SkipSceneShootRequest:
