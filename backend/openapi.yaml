              schema:
                $ref: '#/components/schemas/HealthReport'
          description: All dependencies healthy or degraded
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthReport'
          description: At least one dependency is unhealthy
      summary: '`GET /v1/health` — public, unversioned-by-policy readiness surface.'
      tags:
      - handlers
  /v1/meta/credits:
    get:
      description: |-
        **Authenticated, not Public** (same decision as `/meta/versions`, issue
        #656, applied to this route per user decision on issue #655): the route
        serves the signed-in app's credits screen, carries no tenant data and no
        block-scoped action, so `Authenticated` is the whole gate — no
        handler-internal auth gate needed. The handler performs no I/O.
      operationId: get_meta_credits
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetaCreditsResponse'
          description: Deduped LLM co-authors and human contributors
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
          description: Missing or invalid OIDC token
      summary: '`GET /v1/meta/credits` — deduped LLM co-authors + human contributors.'
      tags:
      - handlers
  /v1/meta/versions:
    get:
      description: |-
        **Authenticated, not Public** (decided in the #656 change proposal):
        unlike `/health` (a container probe that must run without any token),
        this route serves the signed-in app's About screen, so requiring a valid
        OIDC token costs the client nothing while denying anonymous probes a
        backend version fingerprint. The response carries no tenant data and no
        block-scoped action, so no membership requirement and no handler-internal
        auth gate is needed — the `Authenticated` middleware classification is
        the whole gate. The handler performs no I/O whatsoever.
      operationId: get_meta_versions
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetaVersionsResponse'
          description: Compile-time versions of the workspace crates
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
          description: Missing or invalid OIDC token
      summary: '`GET /v1/meta/versions` — compile-time workspace crate versions.'
      tags:
      - handlers
