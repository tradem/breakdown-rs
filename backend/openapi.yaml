  /v1/shooting-days/{day_id}/scenes/{scene_id}/scene-shoots:
    get:
      description: |-
        The listing is **day-scoped**: `scene_id` is part of the hierarchy path but
        does not filter the result, exactly like the sibling handlers on this route
        family, which address a globally unique `shoot_id` and ignore the parent
        segments. Filtering by `(scene_id, day_id)` would return at most one row
        (pair-uniqueness), which is what [`get_scene_shoot`] is for.
      operationId: list_scene_shoots
      parameters:
      - description: Shooting day id
        in: path
        name: day_id
        required: true
        schema:
          $ref: '#/components/schemas/ShootingDayId'
      - description: Scene id
        in: path
        name: scene_id
        required: true
        schema:
          format: uuid
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/SceneShootView'
                type: array
        '404':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
          description: Shooting day or scene not found
      summary: Lists the planned shoots of a shooting day.
      tags:
      - handlers
    post:
      description: |-
        Wrap semantics (issue #376): planning stays supported on a **wrapped**
        day — the wrap freezes only execution transitions (`start`,
        `actual-order`, `finish`, `skip`, notes), which respond 409
        `scene-shoot.shooting-day-wrapped` post-wrap.
      operationId: plan_scene_shoot
      parameters:
      - in: path
        name: day_id
        required: true
        schema:
          $ref: '#/components/schemas/ShootingDayId'
      - in: path
        name: scene_id
        required: true
        schema:
          format: uuid
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlanSceneShootRequest'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdVersionResponse'
          description: Planned (also on a wrapped day)
        '404':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
          description: Scene or shooting day not found
        '409':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
          description: Conflict
        '422':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
          description: Validation error
      summary: Plans a new scene shoot (Soll) on a shooting day.
      tags:
      - handlers
