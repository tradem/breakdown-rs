; stunnel sidecar fronting SierraDB (ADR-024 / issue #156).
;
; `tqwewe/sierradb:0.3.1` has NO native TLS listener (verified against the
; upstream sources: the server config carries no TLS options), so TLS for the
; event-store link is terminated here. The `api` container connects over TLS
; (`rediss://stunnel:9091/`) with the step-ca root pinned; stunnel forwards
; plaintext RESP3 to `sierradb:9090` on the Docker-internal network only.
; SierraDB publishes no host port in the production compose — it is reachable
; solely from this sidecar.
;
; The cert/key (`/tls/stunnel.crt` + `/tls/stunnel.key`, leaf + intermediate
; chain, SAN stunnel/localhost) are issued by the `tls-provision` loop.

foreground = yes
pid = /tmp/stunnel.pid
debug = notice

[sierradb]
accept = 0.0.0.0:9091
connect = sierradb:9090
cert = /tls/stunnel.crt
key = /tls/stunnel.key
