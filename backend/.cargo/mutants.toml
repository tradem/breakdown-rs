# == File-based exclusion ==

# Exclude the `integration-tests` crate from mutation testing: it operates on real external
# resources (Docker) and exercises the public API, not the whitebox code surface, so only
# inline `#[cfg(test)]` modules in the other crates are mutated. (This is also cargo-mutants'
# default behaviour, stated here explicitly to document the intent.)
exclude_globs = [
    "crates/integration-tests/**",
    # Exclude the `fuzz-targets` crate: it requires nightly cargo-fuzz and the
    # `fuzzing` cfg-gate; it is excluded from CI builds (`--exclude
    # breakdown-fuzz-targets`) and does not compile under mutation testing.
    "crates/fuzz-targets/**",
    # `test_support` is a test-helper crate with no domain logic to mutate;
    # covering it adds runtime with zero defect-finding value.
    "crates/test_support/**",
    # Exclude vendored path-patched crates under `.patches/`. These crates
    # (kameo_es, kameo_es_core, kameo_es_macros) do not declare the
    # `test-support` feature, so the unqualified `features = ["test-support"]
    # below causes the unmutated baseline to fail (exit 4) when a shard
    # happens to land only on `.patches/` mutants (issue #273, shards 28-31).
    ".patches/**",
]

# == Security-critical allowlist (documentation) ==
#
# The `mutate-security` job in `mutation-testing-pr.yml` uses `-f` glob filters to restrict
# mutation testing to these security-critical paths and fails on any surviving mutant:
#
#   - crates/core/src/membership/**   # Domain membership & authorization policy
#   - crates/core/src/shared/lex_sort* # LexicalSortKey (fractional ordering safety)
#   - crates/api/src/auth/**          # OIDC/JWKS, deny-by-default middleware, auth-state
#
# These patterns are documented here so they stay in sync between the workflow and the config.
# The broad `mutate-core` job (continue-on-error) still covers the entire `breakdown_core` crate.

# Enable the test-support feature to match CI: `cargo test --workspace --features test-support`
# Using unqualified `test-support` (not `infra/test-support`) so cargo-mutants can apply
# it to any package — cargo-mutants with --test-workspace false runs
# `cargo test --package=<pkg> --features=<feat>`, and the package-qualified syntax
# `infra/test-support` fails when <pkg> != infra (issue #267).
features = ["test-support"]

# == Regex-based survivor acceptance (known false-positives) ==
#
# Only pure routing/metadata constants (CommandName, EventType, category) and
# API bootstrap functions are excluded here.  Mutating them produces wrong
# constant values but does not affect domain behaviour — the tests that would
# catch them are more like "test the constant is correct" which adds noise for
# no domain benefit.
#
# Every other mutant outside these patterns is a genuine test gap and should be
# fixed by strengthening the corresponding test — not by adding another regex.
exclude_re = [
    # kameo_es routing constants: CommandName → wrong &str
    "command_name -> &'static str with",
    # kameo_es event-type markers: EventType → wrong &str
    "event_type -> &'static str with",
    # Aggregate Entity category strings: category → wrong &str
    "category -> &'static str with",
    # API startup / bootstrap (no behavioural logic)
    "init_otel_tracer",
    "replace main -> Result",
    "routes -> Router",
    "app_router -> Router",
    # Command adapter methods (Scene/Character/Costume/Calculation `*CommandsImpl`) delegate to
    # `kameo_es::CommandService::execute`, which only runs against a live SierraDB event store
    # (Docker). They are covered end-to-end by the Docker-gated `crates/integration-tests` suite,
    # which is excluded from mutation for the same reason; spinning the same containers up inside
    # the mutated infra crate would make every mutant rebuild run them and is not viable. These
    # mutants therefore cannot be killed by fast whitebox unit tests in `infra`.
    "CommandsImpl>::",
    # `version_from_expected` is dead code (`#[expect(dead_code)]`). Its `Empty`-arm deletion is a
    # semantically equivalent mutant: both the explicit `Empty` arm and the catch-all `_` arm map
    # to `AggregateVersion::INITIAL`, so removing the arm does not change behaviour and it cannot
    # be caught by a behavioural test. The other two arms are covered by a unit test. The regex is
    # anchored to `version_from_expected` so it does not accidentally exclude unrelated
    # `ExpectedVersion::Empty` arms elsewhere (e.g. in `.patches/kameo_es`).
    "ExpectedVersion::Empty in version_from_expected",
    # LexicalSortKey::midpoint: the loop-bound `<`→`<=` mutants are behaviour-preserving
    # (the `av[i] == bv[i]` equality guard short-circuits the scan before `i` can ever reach
    # the bound for any valid a<b input), and the `i += 1`→`i *= 1` mutant is an untestable
    # infinite loop (the mutated program never terminates). Both are scoped to this function so
    # unrelated mutants are not affected.
    "replace < with <= in LexicalSortKey::midpoint",
    "replace \\+= with \\*= in LexicalSortKey::midpoint",
    # --- Batch 4 / P4.1: audit-projector live-DB mutants (see tasks.md) ---
    "AuditProjector>::handle .* with Ok\\(\\)\\)",
    "write_audit_row -> sqlx::Result<\\(\\)> with Ok\\(\\)\\)",
    "BlockProjector>::handle .* with Ok\\(\\)\\)",
    # --- Batch 4 / P4.2: report-backup worker live-DB / jitter mutants (see tasks.md) ---
    "SceneShootReportDataLoader>::load .* with Ok\\(Default::default\\)\\)",
    "ReportBackupWorker<L>::tick -> bool with (false|true)",
    "ReportBackupWorker<L>::process_job -> Result<\\(\\), String> with Ok\\(\\(\\)\\)",
    "delete match arm .* in ReportBackupWorker<L>::process_job",
    "replace != with == in ReportBackupWorker<L>::process_job",
    "delete ! in ReportBackupWorker<L>::process_job",
    "ReportBackupWorker<L>::fail_retryable .* with \\(\\)",
    "ReportBackupWorker<L>::reconcile with \\(\\)",
    "delete ! in ReportBackupWorker<L>::reconcile",
    "compute_backoff -> Duration with Default::default\\(\\)",
    "spawn_backup_worker with \\(\\)",
    "delete ! in spawn_backup_worker",
    # --- Batch 4 / P4.3: report-trigger live-DB / SierraDB mutants (see tasks.md) ---
    "enqueue_for_day -> Result<usize> with Ok\\([01]\\)",
    "delete ! in enqueue_for_day",
    "replace \\+= with \\*= in enqueue_for_day",
    "replace \\+= with -= in enqueue_for_day",
    "spawn_schedule_ticker with \\(\\)",
    "delete ! in spawn_schedule_ticker",
    "run_schedule_once -> Result<\\(\\)> with Ok\\(\\)",
    "ReportArchivalOnWrapSaga>::handle -> Result<\\(\\), Self::Error> with Ok\\(\\)",
    "ReportArchivalOnWrapSaga>::start_from .* with Ok",
    "replace != with == in ReportArchivalOnWrapSaga>::process_event",
    "ReportArchivalOnWrapSaga>::process_event .* with Ok\\(\\)",
    "spawn_wrap_archival_saga -> Result<\\(\\)> with Ok\\(\\)",
    # --- Batch 4 / P4.4: reporting-jobs / typst-renderer live-DB / font mutants (see tasks.md) ---
    "PgReportArchivalQueue::claim_next -> Result<Option<ReportJobRow>, ReportArchivalError> with Ok\\(None\\)",
    "PgReportArchivalQueue::mark_staged -> Result<\\(\\), ReportArchivalError> with Ok\\(\\)",
    "PgReportArchivalQueue::mark_uploading -> Result<\\(\\), ReportArchivalError> with Ok\\(\\)",
    "PgReportArchivalQueue::mark_succeeded -> Result<\\(\\), ReportArchivalError> with Ok\\(\\)",
    "replace \\+ with \\* in PgReportArchivalQueue::mark_failure",
    "replace \\+ with - in PgReportArchivalQueue::mark_failure",
    "RestrictedWorld>::font -> Option<Font> with None",
    "replace > with (>=|<|==) in TypstReportRenderer>::render",
    "load_system_fonts -> Result<Vec<Font>, String> with Ok\\(vec!\\[\\]\\)",
    # --- Batch 5 / P5.1: photo-thumbnail saga live-DB / SierraDB mutants (see tasks.md) ---
    # handle / process_upload / process_upload_with_recovery dispatch storage +
    # command operations that need live Garage + SierraDB. Covered end-to-end by
    # the excluded integration-tests suite (photo_round_trip). The pure
    # process_image variants are killed by inline unit tests in thumbnail.rs.
    "PhotoThumbnailSaga>::handle",
    "PhotoThumbnailSaga::process_upload",
    # --- Batch 5 / P5.2: photo-deletion saga live-DB / SierraDB mutants (see tasks.md) ---
    # handle / process_event / start_from mutate the in-memory refcount map AND
    # dispatch DeletePhoto via CommandService (live SierraDB) + read the photo
    # projection via PhotoRepositoryImpl (live Postgres). Whitebox unit tests
    # cannot construct a CommandService or PgPool without containers, and the
    # Docker-gated integration-tests crate is excluded from mutation. The
    # refcount guard logic is covered end-to-end by photo_nm_deletion_round_trip.
    "PhotoDeletionSaga>::handle",
    "PhotoDeletionSaga>::start_from",
    "PhotoDeletionSaga>::process_event",
    "spawn_photo_deletion_saga",
    # --- Batch 5 / P5.3: continuity-deletion saga live-DB / SierraDB mutants ---
    # Same live-DB / SierraDB constraint as P5.2; covered end-to-end by the
    # excluded integration-tests suite (continuity_photo_round_trip).
    "ContinuityDeletionSaga>::handle",
    "ContinuityDeletionSaga>::start_from",
    "ContinuityDeletionSaga>::process_event",
    "spawn_continuity_deletion_saga",
    # --- Batch 5 / P5.4: photo-GC live-DB / Garage mutants ---
    # run_gc_sweep / try_run_sweep read Garage (PhotoStorage::list/fetch_stored_at)
    # and Postgres (PhotoRepository::list_known_ids, advisory lock, history INSERT).
    # Covered end-to-end by photo_gc_sweep.rs (excluded integration-tests crate).
    "run_gc_sweep",
    "try_run_sweep",
    "spawn_gc_scheduler",
    # --- Batch 5 / P5.5: photo-repository / projector live-PG mutants ---
    # find_by_id / list_known_ids / count_links run SQL against Postgres;
    # handle / touch_photo run SQL within a Postgres transaction. Covered by the
    # excluded integration-tests suite (photo_round_trip, photo_nm_deletion).
    "PhotoRepositoryImpl>::find_by_id",
    "PhotoRepositoryImpl>::list_known_ids",
    "PhotoRepositoryImpl>::count_links",
    "PhotoProjector>::handle",
    "PhotoProjector::touch_photo",
    # --- Batch 6 / P6.1–P6.3: query-repository live-PG mutants (see tasks.md) ---
    # All query impl methods run SQL against Postgres. The pure parse helpers
    # (parse_variant/parse_status) are killed by inline unit tests; the query
    # methods are covered end-to-end by the excluded integration-tests suite.
    "MembershipRepositoryImpl",
    "CostumeRepositoryImpl",
    "CostumeCategoryRepositoryImpl",
    "CharacterRepositoryImpl",
    "EpisodeRepositoryImpl",
    "SeasonRepositoryImpl",
    "BlockRepositoryImpl",
    "ShootingDayRepositoryImpl",
    "SceneShootReportRepositoryImpl",
    # --- Batch 6 / P6.4: domain_to_stream_checked live-DB guard ---
    # The pure function is killed by an inline unit test; this catches any
    # remaining call-site mutants that reach into live SierraDB state.
    "domain_to_stream_checked",
    # --- Batch 6 / P6.6: API shutdown / state live-runtime mutants ---
    # wait_for_shutdown / shutdown_ai_import coordinate live task shutdown;
    # AppState Debug redaction and main() are not unit-testable without
    # refactoring. Covered indirectly by the excluded integration-tests suite.
    "wait_for_shutdown",
    "shutdown_ai_import",
    "ai_import_shutdown_max_budget",
    "Debug for AppState",
    "replace != with == in main",
    "delete ! in main",
    # --- Batch 6 / P6.7: problem-surface runtime/FTL mutants ---
    # The JSON-from_request match guard and parsed_resource locale routing
    # need live HTTP / FTL bundle infrastructure. AxumBytes::from is killed by
    # an inline unit test.
    "replace match guard error.is_syntax() || error.is_eof() with true",
    "replace == with != in parsed_resource",
    # --- Batch 6 / P6.8: migrate_gdrive_credentials CLI bin ---
    # parse_options match arms and run() guards are only reachable through the
    # live binary entry point; extracting the parser for unit testing would be
    # a larger refactor. Covered by manual CLI smoke tests.
    "parse_options",
    "replace run -> Result",
    "replace != with == in run",
    "delete ! in run",
    "replace && with || in run",
    "replace == with != in run",
]
