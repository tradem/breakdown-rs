# CQRS boundary: write-side code (command adapters, sagas, aggregates) must
# never query a read-model projection to resolve audit/derived context (e.g.
# series_id for EventMetadata). Context must come from the event data itself
# or a command field populated at the API edge (AGENTS.md §1).
#
# Scan scope is restricted to the write-side dirs in the CI job:
#   crates/infra/src/event_store crates/infra/src/sagas crates/infra/src/photo/sagas
#
# A non-audit read-model lookup (e.g. the ExpectedVersion concurrency guard in
# the photo deletion sagas) is permitted only with an explicit suppression:
#   // ast-grep-ignore: cqrs-boundary
# on the same line as the call, carrying a justification comment above it.
id: cqrs-boundary
message: >-
  Write-side code queries a read-model projection via find_by_id. Command
  adapters, sagas and aggregates must never resolve audit/derived context
  (e.g. series_id) from projections — take it from the event data or a command
  field populated at the API edge (AGENTS.md §1). If this lookup is NOT
  audit-context resolution (e.g. a concurrency version guard), suppress it with
  an explicit `// ast-grep-ignore: cqrs-boundary` comment and a justification.
severity: error
language: Rust
rule:
  any:
    - pattern: $REPO.find_by_id($$$ARGS)
    - pattern: $REPO::find_by_id($$$ARGS)
