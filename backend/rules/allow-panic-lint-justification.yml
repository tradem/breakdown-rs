# Justified allows only: the no-panic / no-unsafe invariant is enforced by
# the workspace clippy lints (clippy::unwrap_used, clippy::expect_used,
# clippy::panic, rust::unsafe_code — all `deny`). The one escape hatch is a
# local `#[allow(...)]`, which AGENTS.md §3 permits ONLY for (a) const-time
# construction from a known-valid literal or (b) test code — and BOTH must
# carry a justification comment on the same line.
#
# clippy cannot enforce "every allow has a comment" (it has no such lint),
# so this gate checks the structural sibling adjacency: an `#[allow(...)]`
# for the panic/unsafe family MUST be immediately followed by a `// ...`
# comment node. The constrained LINT set is the panic/unsafe family only —
# `#[allow(dead_code)]`, `#[allow(async_fn_in_trait)]`, `#[allow(too_many_arguments)]`
# etc. are intentionally NOT in scope (they are style/perf escapes with no
# panic-safety implication and may stand without a comment).
#
# Scan scope is restricted to production source files (crates/*/src, test
# modules excluded) — test code may use bare allows freely. Bins are
# included.
#
# If a bare allow is genuinely intentional and the justification is better
# placed above the attribute as a `///` doc-comment rather than trailing,
# suppress:
#   // const-time: Berlin CET offset is always +3600s (FixedOffset::east_opt).
#   #[allow(clippy::expect_used)] // ast-grep-ignore: allow-panic-lint-justification
# (the suppression itself documents intent; the comment above is the
# standing rationale reviewed at audit time).
#
# The `not.precedes` relational with `stopBy: neighbor` mirrors the proven
# sibling traversal in test-helper-gate.yml (which uses `not.follows` +
# `stopBy: neighbor` on the `#[cfg(feature = "test-support")]` attribute).
id: allow-panic-lint-justification
message: >-
  An `#[allow(...)]` for a panic/unsafe-family lint (unwrap_used / expect_used
  / panic / todo / unimplemented / unreachable / unsafe_code) carries no
  trailing `//` justification comment. AGENTS.md §3 permits such allows ONLY
  with a same-line justification (const-time construction or test code).
  Add a trailing `// <why this cannot panic / is sound>` comment, or
  suppress with `// ast-grep-ignore: allow-panic-lint-justification` and a
  justification above.
severity: error
language: Rust
rule:
  all:
    - any:
        # Path-qualified clippy lint allows (e.g. `#[allow(clippy::unwrap_used)]`)
        # — the `$LINT` metavariable captures the trailing path segment so the
        # constraint below matches the lint name without the `clippy::` prefix.
        - pattern: '#[allow(clippy::$LINT)]'
        # Bare rustc lint allows (e.g. `#[allow(unsafe_code)]`). ast-grep's
        # `#[allow($LINT)]` matches only the bare-ident form, so the clippy
        # variant is matched separately above (verified against ast-grep 0.44).
        - pattern: '#[allow($LINT)]'
    - not:
        precedes:
          regex: '^//'
          stopBy: neighbor
constraints:
  LINT:
    # Substring regex on the lint name segment (no `clippy::` prefix).
    # Excludes `too_many_arguments`, `async_fn_in_trait`, `type_complexity`,
    # `dead_code` etc. — only the panic/unsafe family requires a comment.
    # `panic` deliberately also catches `panic_in_result_fn` /
    # `panicking_unwrap` (same family, same comment requirement).
    regex: 'unsafe_code|unwrap_used|expect_used|panic|unimplemented|unreachable|todo'
