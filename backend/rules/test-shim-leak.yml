# Test-shim leak: production api code must never call test-only helpers
# (aggressive_test_flush / test_profile) and must never use spawn_*_with_config
# without ProjectorFlushConfig::default(). Production boot uses the plain
# spawn_* wrapper with ProjectorFlushConfig::default() (commit 96fbd47).
#
# Scan scope is restricted to production files under crates/api/src (test
# modules *_tests.rs / *_test.rs / test_helpers.rs are excluded by the CI job).
#
# Add any new test-only helper function name to `known_test_helpers` below.
id: test-shim-leak
message: >-
  Production api code calls a test-only helper or a spawn_*_with_config
  variant without ProjectorFlushConfig::default(). 'test_profile' /
  'aggressive_*' must never be used outside tests; production boot must use the
  plain spawn_* wrapper or pass ProjectorFlushConfig::default() explicitly.
severity: error
language: Rust
utils:
  known_test_helpers:
    any:
      - pattern: test_profile($$$ARGS)
      - pattern: $SELF.test_profile($$$ARGS)
      - pattern: $TYPE::test_profile($$$ARGS)
      - pattern: aggressive_test_flush($$$ARGS)
      - pattern: $SELF.aggressive_test_flush($$$ARGS)
      - pattern: $TYPE::aggressive_test_flush($$$ARGS)
  with_config_without_default:
    all:
      - pattern: spawn_$NAME_with_config($$$ARGS)
      - not:
          has:
            pattern: ProjectorFlushConfig::default()
rule:
  any:
    - matches: known_test_helpers
    - matches: with_config_without_default
