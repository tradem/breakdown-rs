# Vault overlay for the host-run dev API (issue #468).
#
# The base dev compose runs no Vault (ADR-027 is prod-only). A host-run
# `cargo run -p api` therefore cannot reach the transit + KV-v2 engines the
# `/settings` credential and AI-config `vault_key_id` flows need, so those
# endpoints 503. This overlay provides a local Vault for dev, mirroring the
# IdP overlay pattern (`docker-compose.idp.yml`): a compose overlay + a
# bootstrap driver (`scripts/enable-dev-vault.sh`).
#
# It publishes Vault's HTTP API on loopback `127.0.0.1:8200` only — dev-only
# plaintext (`tls_disable = true` in `vault/config.dev.hcl`); never acceptable
# in production (ADR-024 / ADR-027). The `vault-bootstrap` one-shot reuses the
# same `scripts/vault-bootstrap.sh` as prod (Transit, KV-v2, `breakdown-app`
# policy, least-privilege 24 h app token), parameterized so TLS is opt-in.
# The unseal key and app token persist into the git-ignored host directory
# `.vault-dev/`, so the host-run API and later re-runs can read them.
#
# Usage (from `backend/`): ./scripts/enable-dev-vault.sh

services:
  vault:
    # Same image + digest as the prod Vault (ADR-027). Docker-internal in prod;
    # the dev overlay additionally publishes the HTTP API to the host.
    image: hashicorp/vault:1.20.4@sha256:3d6aade4847c9642ac7ef1ab770cfa46f47874a24996dfde5d9cfb48f4118a73
    restart: unless-stopped
    cap_add:
      - IPC_LOCK
    environment:
      # Also configures the Vault CLI used by the healthcheck; this is not a
      # credential and is not exposed outside the Docker network.
      VAULT_ADDR: http://localhost:8200
    command: ["server"]
    ports:
      # Loopback-only: dev Vault holds no real secret material, but the HTTP
      # listener must never be reachable from the LAN.
      - "127.0.0.1:8200:8200"
    volumes:
      - vault_dev_data:/vault/file
      - ./vault/config.dev.hcl:/vault/config/config.hcl:ro
    healthcheck:
      # 0 = initialized/unsealed, 1 = initialized/sealed, 2 = uninitialized —
      # all are a running service: vault-bootstrap performs init/unseal.
      test: ["CMD-SHELL", "vault status >/dev/null 2>&1; code=$$?; test $$code -ge 0 -a $$code -le 2"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  vault-bootstrap:
    # One-shot first-boot setup (same script + image as prod). Writes the
    # unseal key and the least-privilege app token into the git-ignored host
    # `.vault-dev/` directory via bind mounts, so the host-run API can consume
    # `VAULT_APP_TOKEN_FILE=$(pwd)/.vault-dev/app-token/app.token`. The
    # dev-only bootstrap token is generated by `scripts/enable-dev-vault.sh`
    # (random, gitleaks-clean, never valid outside this local Vault).
    image: hashicorp/vault:1.20.4@sha256:3d6aade4847c9642ac7ef1ab770cfa46f47874a24996dfde5d9cfb48f4118a73
    restart: "no"
    # The helper writes the app-token file for the non-root API uid (1000);
    # `enable-dev-vault.sh` re-aligns ownership to the invoking host user after
    # the one-shot completes.
    user: "0:0"
    entrypoint: ["/bin/sh", "/scripts/vault-bootstrap.sh"]
    environment:
      # Dev plaintext: no VAULT_CACERT, http:// scheme.
      VAULT_ADDR: http://vault:8200
      VAULT_BOOTSTRAP_TOKEN_FILE: /bootstrap-token/token
    volumes:
      - ./.vault-dev/unseal:/vault/unseal
      - ./.vault-dev/app-token:/vault/app-token
      - ./.vault-dev/bootstrap.token:/bootstrap-token/token:ro
      - ./scripts/vault-bootstrap.sh:/scripts/vault-bootstrap.sh:ro
    depends_on:
      vault:
        condition: service_started

volumes:
  vault_dev_data:
