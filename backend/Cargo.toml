[workspace]
resolver = "2"
members = [
    "crates/core",              # Domain-Modell, Event-Sourcing-Logik, Ports (Traits)
    "crates/api",               # Axum-Server, HTTP-Grenze
    "crates/infra",             # Infrastruktur-Implementierungen (PostgreSQL, Event Store)
    "crates/integration-tests", # Black-box Integrationstests (dev-only)
    "crates/test_support",      # Shared test helpers (make_ctx)
    "crates/architecture",      # Architekturtests (rust_arkitect + cargo-deny, ADR-017)
    "crates/fuzz-targets",      # Nightly cargo-fuzz targets for request-body deserialization
]

[workspace.package]
version = "0.3.0"
edition = "2024"
authors = ["Tobias Rademacher <your.email@example.com>"]
license = "AGPL-3.0"
# MSRV (ADR-020 D2/D5): the workspace dependency floor — matches the
# Dockerfile builder image (rust:1.94-bookworm). A future bump is a MAJOR
# change per crate and must be coordinated across core → infra → api (D3).
rust-version = "1.94"

[workspace.dependencies]
# Web & API
axum = "0.8"
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Datenbank & Event Sourcing
sqlx = { version = "0.9", features = ["postgres", "runtime-tokio", "tls-native-tls", "uuid", "chrono", "json", "migrate"] }
uuid = { version = "1", features = ["v4", "v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# Logging / Tracing
tracing = "0.1"
tracing-subscriber = "0.3"

# OpenTelemetry / Observability
tracing-opentelemetry = "0.33"
opentelemetry = { version = "0.32", features = ["trace"] }
opentelemetry-otlp = { version = "0.32", default-features = false, features = ["http-proto", "grpc-tonic", "trace"] }
opentelemetry_sdk = { version = "0.32", features = ["rt-tokio"] }
tower-http = { version = "0.7", features = ["trace"] }

# Event Sourcing (ES)
kameo = "0.22"      # Das zugrundeliegende Actor-Framework
kameo_es = { path = ".patches/kameo_es", version = "0.1.0", features = ["postgres"] }
# SierraDB RESP3 client (used by kameo_es). TLS features power the
# rediss:// link to the stunnel sidecar (ADR-024) with a pinned step-ca
# root via `Client::build_with_tls` (issue #156).
redis = { version = "1.4", features = ["tls-rustls", "tokio-rustls-comp"] }
sierradb-client = "0.3" 
thiserror = "2.0"
anyhow = "1.0"
rust_decimal = { version = "1.36", features = ["db-postgres"] }
rand = "0.10"

# Async traits (object-safe, mockable ports)
async-trait = "0.1"
zeroize = "1.8"
aes-gcm = "0.10"
base64 = "0.22"
getrandom = "0.3"

# OpenAPI generation (ADR-006)
utoipa = { version = "5", features = ["axum_extras", "chrono", "uuid"] }
utoipa-swagger-ui = { version = "9", features = ["axum"] }

# JSON Schema generation for LLM schema-constrained decoding (ADR-013 / ai context).
# Coexists with `utoipa`: utoipa documents the API, schemars derives the JSON
# Schema fed to the provider `response_format` parameter. Core must NOT depend
# on this crate (architecture-tested) — only infra generates schemas.
schemars = "1"

# Native parsing of CSV shooting schedules (Drehplan) in the ai context.
csv = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# ─── ADR-020 D5: cargo-release, per-crate independent flow ────────────────
#
# The release owner runs `cargo release -p <crate> --dependent` locally (not
# a CI/PR job). Each release cuts a per-crate tag `{crate}-v{version}`
# (core-v0.3.0, infra-v…, api-v…) that the api Docker image build consumes
# (ADR-020 D6). `shared-version = false`: crates diverge on individual
# release. Releases are opt-in per crate: only crates with
# `[package.metadata.release] release = true` (core, infra, api) are touched.
[workspace.metadata.release]
shared-version = false
tag-name = "{{crate}}-v{{version}}"
release = false

[workspace.lints.rust]
# `unsafe` is forbidden in production code. Use `deny` (not `forbid`) so test
# binaries that need `unsafe` for legit reasons (JWT/socket stubs in
# auth tests) can `#![allow(unsafe_code)]` locally. `forbid` is un-overridable.
unsafe_code = "deny"
# Predeclare the `fuzzing` cfg so `cfg(fuzzing)` (cargo-fuzz targets) does
# not trigger `unexpected_cfgs` warnings. Hoisted to the workspace so the
# fuzz-targets crate can inherit all lints via `[lints] workspace = true`
# (cargo disallows mixing `workspace = true` with a local `[lints.rust]`
# override). Harmless for non-fuzz crates — they simply learn the cfg name.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(fuzzing)'] }

# Panics are the "safe" equivalent of `unsafe` for crashing production:
# they bypass structured error handling, produce no tracing span, and (in
# spawned tasks like projectors/sagas) silently kill the worker. The
# architecture forbids `unwrap()`/`expect()`/`panic!()` in production code
# (AGENTS.md §3).  Test code and const-time construction may `#[allow]` them
# with a justification comment.
[workspace.lints.clippy]
expect_used = "deny"
unwrap_used = "deny"
panic = "deny"
# `dbg_macro` and `print_stdout` leak test scaffolding into prod; deny to
# keep production output clean (use `tracing` instead).
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"

# No abrupt process termination in a server with structured shutdown / Drop
# (AGENTS.md §3 no-panics rule). `std::process::exit` bypasses Drop, so
# zeroize-on-drop secrets and graceful projector flush never run.
exit = "deny"
# Holding a std::sync guard across `.await` deadlocks the async runtime;
# event-sourced projectors/sagas are async by design — catch the mistake here
# rather than at a production deadlock (no std::sync::Mutex/RwLock in tree).
await_holding_lock = "deny"
await_holding_refcell_ref = "deny"
# `mem::forget` prevents destructors from running, so `zeroize`-on-Drop
# never executes and credential material lingers in leaked storage
# (security: secrets would not be wiped on drop).
mem_forget = "deny"