# Development IdP overlay (self-hosted Logto) for local OIDC testing.
# Usage: docker compose -f docker-compose.dev.yml -f docker-compose.idp.yml up -d
#
# This overlay provides a self-hosted Logto instance for development and CI,
# decoupling the dev loop from the production IdP decision (ADR-010).
# Production IdP runtime is NOT provided by this overlay.
#
# Logto image: svhd/logto:1.13.0 (pinned minor tag for reproducibility)
#
# Services:
#   - logto-db    : Dedicated Postgres for Logto's internal state
#   - logto       : Self-hosted Logto IdP (HTTPS on :3301)
#
# Ports:
#   - 3301 : Logto OIDC endpoint (HTTPS, cert signed by the dev CA)
#   - 3302 : Logto Admin UI and Admin API (HTTPS)
#
# TLS:
#   The dev CA + leaf certs are generated by `./scripts/generate-dev-certs.sh`
#   and mounted from `./dev-certs`. Logto is configured with HTTPS_CERT /
#   HTTPS_KEY to serve TLS natively. The same CA signs the API cert
#   (`:3000`) so the Flutter client can pin one CA set for both hosts
#   (D1 primary of the `wire-flutter-oidc-auth` change).
#
# After boot, run: ./scripts/seed-logto-dev.sh to provision the OIDC application
# and generate .env.idp with OIDC_ISS, OIDC_AUDIENCE, and OIDC_JWKS_URL.
#
# Emulator reachability: the idp leaf cert includes 10.0.2.2 as a SAN, so the
# Android emulator can reach the IdP at https://10.0.2.2:3301.

services:
  logto-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: logto_user
      POSTGRES_PASSWORD: logto_pass
      POSTGRES_DB: logto_db
    volumes:
      - logto_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U logto_user"]
      interval: 5s
      timeout: 3s
      retries: 5

  logto:
    image: svhd/logto:1.13.0
    depends_on:
      logto-db:
        condition: service_healthy
    entrypoint: ["sh", "-c", "npm run cli db seed -- --swe && npm start"]
    environment:
      DB_URL: postgres://logto_user:logto_pass@logto-db:5432/logto_db
      ENDPOINT: https://localhost:3301
      ADMIN_ENDPOINT: https://localhost:3302
      HTTPS_CERT: /tls/idp.pem
      HTTPS_KEY: /tls/idp.key
    ports:
      - "3301:3301"
      - "3302:3302"
    volumes:
      - ./dev-certs/idp.pem:/tls/idp.pem:ro
      - ./dev-certs/idp.key:/tls/idp.key:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsSL --insecure https://localhost:3301/status || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  logto_db_data:
