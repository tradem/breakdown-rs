# Production runtime for the two-tier stack (ADR-015 / ADR-016) with
# in-transit TLS on every DB / event-store / object-store link (ADR-024,
# issue #156).
#
# Choice recorded in ADR-016: docker-compose (not k8s) for v1. Symmetric with the
# dev surface; upgradeable to k8s later without changing the pinned-tag/policy
# decisions.
#
# Covers: Postgres (read-model projections) + SierraDB (RESP3 event store) with
# pinned tags, persistent named volumes, healthchecks, OpenTelemetry hooks
# (ADR-011), backup/recovery (see docs/operations/runbooks.md), the Caddy edge
# (ADR-025) and the internal TLS mesh (ADR-024):
#
#   step-ca (internal CA, first-boot bootstrap from $STEP_CA_PASSWORD)
#     -> tls-provision loop issues 24h leaf certs into the tls_data volume
#        (postgres, stunnel, caddy)
#     -> postgres: native TLS (ssl=on)
#     -> stunnel sidecar: TLS termination for the SierraDB RESP3 link
#     -> caddy: TLS termination for the Garage S3 link (internal :9443 site)
#     -> api: verify-full + sslrootcert (Postgres), rediss:// (SierraDB),
#        https:// (Garage) — pinned to the step-ca root
#
# Usage:
#   STEP_CA_PASSWORD=... POSTGRES_PASSWORD=... DOMAIN=... \
#     docker compose -f docker-compose.prod.yml up -d
#
# Configure via the `.env` file or real env vars before booting the API binary
# (see `services.api.environment`).

services:
  vault:
    # HashiCorp Vault OSS (ADR-027). The image is pinned by digest and the
    # service is Docker-internal only; no Vault port is published to the host.
    image: hashicorp/vault:1.20.4@sha256:3d6aade4847c9642ac7ef1ab770cfa46f47874a24996dfde5d9cfb48f4118a73
    restart: unless-stopped
    cap_add:
      - IPC_LOCK
    environment:
      # Also configures the Vault CLI used by the healthcheck; this is not a
      # credential and is not exposed outside the Docker network.
      VAULT_ADDR: https://localhost:8200
      VAULT_CACERT: /tls/root_ca.crt
    # The official entrypoint loads all files from /vault/config.
    command: ["server"]
    volumes:
      - vault_data:/vault/file
      - tls_data:/tls:ro
      - ./vault/config.hcl:/vault/config/config.hcl:ro
    depends_on:
      tls-provision:
        condition: service_healthy
    healthcheck:
      # Vault returns 1 while initialized but sealed; that is still a healthy
      # service because vault-bootstrap performs the unseal operation.
      test: ["CMD-SHELL", "vault status >/dev/null 2>&1; code=$$?; test $$code -eq 0 -o $$code -eq 1"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  vault-bootstrap:
    # One-shot first-boot setup. The root/bootstrap token is scoped to this
    # service only and is not present in vault or api environment.
    image: hashicorp/vault:1.20.4@sha256:3d6aade4847c9642ac7ef1ab770cfa46f47874a24996dfde5d9cfb48f4118a73
    restart: "no"
    # The helper writes the app-token file for the non-root API uid (1000).
    user: "0:0"
    entrypoint: ["/bin/sh", "/scripts/vault-bootstrap.sh"]
    environment:
      VAULT_ADDR: https://vault:8200
      VAULT_CACERT: /tls/root_ca.crt
      # Keep interpolation optional so static `docker compose config` CI gates
      # can validate the file without receiving a production secret. The
      # mounted bootstrap script still rejects an empty value at runtime.
      VAULT_BOOTSTRAP_TOKEN_FILE: /run/secrets/vault_bootstrap_token
    volumes:
      - vault_unseal:/vault/unseal
      - vault_app_token:/vault/app-token
      - tls_data:/tls:ro
      - ./scripts/vault-bootstrap.sh:/scripts/vault-bootstrap.sh:ro
    secrets:
      - source: vault_bootstrap_token
        target: vault_bootstrap_token
    depends_on:
      vault:
        condition: service_started

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    # Native TLS (ADR-024): server cert + key issued by the internal step-ca
    # (tls-provision loop) and mounted read-only from the shared tls_data
    # volume. Clients must connect with sslmode=verify-full + the pinned root.
    command:
      - postgres
      - -c
      - ssl=on
      - -c
      - ssl_cert_file=/tls/postgres.crt
      - -c
      - ssl_key_file=/tls/postgres.key
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-breakdown}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - tls_data:/tls:ro
    depends_on:
      tls-provision:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  sierradb:
    # Pinned upstream image (ADR-016). SierraDB speaks RESP3 only.
    # Internal-only (ADR-024): no host port — the event store is reachable
    # exclusively from the `stunnel` sidecar over the Docker network.
    image: tqwewe/sierradb:0.3.1
    restart: unless-stopped
    command: ["--dir", "/app/data"]
    volumes:
      - sierradb_data:/app/data
      - ./scripts/sierradb-healthcheck.sh:/scripts/sierradb-healthcheck.sh:ro
    healthcheck:
      # The image ships no redis-cli/perl; the script probes RESP3 PING over
      # raw TCP via bash (present in the base). SierraDB answers +PONG to a
      # raw PING.
      test: ["CMD-SHELL", "bash /scripts/sierradb-healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 5

  stunnel:
    # TLS sidecar for SierraDB (ADR-024, fallback branch): `tqwewe/sierradb`
    # ships no native TLS listener (verified against upstream sources), so TLS
    # for the event-store link terminates here. The API connects rediss:// to
    # this sidecar; plaintext RESP3 flows only stunnel -> sierradb on the
    # Docker-internal network. Image pinned by digest (issue #156); upstream
    # publishes only `latest`, the digest is the pin.
    image: dweomer/stunnel:latest@sha256:c46e11e6cc135275566de318d739f815c272c23084fc1e65704f7e228992e9ef
    restart: unless-stopped
    # The image entrypoint (/srv/stunnel.sh) is an env-var-driven generator
    # that demands STUNNEL_* vars and writes a self-signed fallback cert;
    # override it and drive stunnel from our versioned config + step-ca certs.
    entrypoint: ["/usr/bin/stunnel"]
    command: ["/etc/stunnel/stunnel.conf"]
    volumes:
      - ./tls/stunnel.conf:/etc/stunnel/stunnel.conf:ro
      - tls_data:/tls:ro
    depends_on:
      sierradb:
        condition: service_healthy
      tls-provision:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 9091"]
      interval: 10s
      timeout: 5s
      retries: 5

  step-ca:
    # Internal certificate authority (ADR-024 / issue #156). First boot
    # bootstraps the CA from $STEP_CA_PASSWORD (the only allowed `.env` use,
    # ADR-027); the CA key material lives on the LUKS-protected step_ca_data
    # volume (ADR-023). The built-in image entrypoint runs `step ca init`
    # non-interactively when no CA exists yet. Image pinned by digest.
    image: smallstep/step-ca:0.28.4@sha256:0f88382ac5af5c6b7bbba0c6e8fcefef52aee6f22ea364df8e02a09ffd0d22f3
    restart: unless-stopped
    environment:
      # CA name + DNS must include the compose service name (`step-ca`):
      # clients (tls-provision loop) verify the CA URL hostname against the
      # CA's own certificate SANs.
      DOCKER_STEPCA_INIT_NAME: ${STEP_CA_NAME:-Breakdown Internal CA}
      DOCKER_STEPCA_INIT_DNS_NAMES: step-ca,localhost
      DOCKER_STEPCA_INIT_PROVISIONER_NAME: ${STEP_CA_PROVISIONER:-admin}
      DOCKER_STEPCA_INIT_ADDRESS: :9000
      DOCKER_STEPCA_INIT_PASSWORD: ${STEP_CA_PASSWORD:?STEP_CA_PASSWORD is required}
    volumes:
      - step_ca_data:/home/step
    healthcheck:
      # The CA cert carries DNS SANs (step-ca, localhost) but no IP SAN, so
      # verification against https://127.0.0.1 would fail; probe with curl -k.
      test: ["CMD-SHELL", "curl -kfsS https://127.0.0.1:9000/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  tls-provision:
    # Certificate provision loop (ADR-024 / issue #156): copies the step-ca
    # root into the shared tls_data volume, issues short-TTL (24h) leaf certs
    # for postgres/stunnel/caddy, then re-issues every 12h so rotation is
    # automatic and transparent (old certs stay valid until their TTL, so
    # servers keep serving a trusted chain until restarted/reloaded).
    image: smallstep/step-ca:0.28.4@sha256:0f88382ac5af5c6b7bbba0c6e8fcefef52aee6f22ea364df8e02a09ffd0d22f3
    restart: unless-stopped
    # The step-ca image runs as non-root (uid 1000) by default, but this
    # provisioner must write the shared tls_data volume (root-owned) and the
    # step CLI only touches files — no privileged syscalls.
    user: "0:0"
    entrypoint: ["/bin/sh", "/tls/provision.sh"]
    environment:
      STEP_CA_PASSWORD: ${STEP_CA_PASSWORD:?STEP_CA_PASSWORD is required}
      CA_URL: https://step-ca:9000
      PROVISIONER: ${STEP_CA_PROVISIONER:-admin}
      TLS_CERT_TTL: ${TLS_CERT_TTL:-24h}
      TLS_RENEW_INTERVAL: ${TLS_RENEW_INTERVAL:-12h}
    volumes:
      - ./tls/provision.sh:/tls/provision.sh:ro
      - step_ca_data:/home/step:ro
      - tls_data:/tls
    depends_on:
      step-ca:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "test -f /tls/root_ca.crt -a -f /tls/postgres.crt -a -f /tls/postgres.key -a -f /tls/stunnel.crt -a -f /tls/stunnel.key -a -f /tls/caddy.crt -a -f /tls/caddy.key -a -f /tls/vault.crt -a -f /tls/vault.key",
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  garage:
    # Garage is an S3-compatible object store for costume-photo bytes (ADR-019).
    # Internal-only: no host port mapping; only the Caddy internal TLS site
    # (and the provisioning tooling) reach it. The plaintext :3900 endpoint is
    # never published to the host (ADR-024).
    #
    # The `dxflrs/garage` image is a bare static binary (no shell, no
    # env-var config) — the TOML is rendered into the garage_config volume by
    # the `garage-config` one-shot service from $GARAGE_* (gitleaks-clean).
    image: dxflrs/garage:v1.0.1
    restart: unless-stopped
    # The image CMD (`/garage server`) uses the default config search path;
    # point it at the rendered TOML explicitly.
    command: ["/garage", "-c", "/etc/garage/config.toml", "server"]
    volumes:
      - garage_data:/var/lib/garage
      - garage_config:/etc/garage:ro
    depends_on:
      garage-config:
        condition: service_completed_successfully
    healthcheck:
      # Exec form (no shell in the image): `garage status` against the local
      # admin endpoint answers 0 while the S3/API server is up.
      test: ["CMD", "/garage", "-c", "/etc/garage/config.toml", "status"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  garage-config:
    # One-shot: renders the Garage TOML config from $GARAGE_* env vars into
    # the shared garage_config volume (Garage does not interpolate env in its
    # config file, and the image has no shell to generate it). Image pinned by
    # digest (issue #156).
    image: alpine:3.20@sha256:d9e853e87e55526f6b2917df91a2115c36dd7c696a35be12163d44e6e2a4b6bc
    restart: "no"
    entrypoint: ["/bin/sh", "/scripts/garage-config.sh"]
    environment:
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN:?GARAGE_ADMIN_TOKEN is required}
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:?GARAGE_RPC_SECRET is required}
      GARAGE_METRICS_TOKEN: ${GARAGE_METRICS_TOKEN:-}
    volumes:
      - ./scripts/garage-config.sh:/scripts/garage-config.sh:ro
      - garage_config:/config


  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      stunnel:
        condition: service_healthy
      sierradb:
        condition: service_healthy
      tls-provision:
        condition: service_healthy
      garage:
        condition: service_healthy
    environment:
      # Vault is optional at API boot. Credential endpoints return 503 until
      # the bootstrap helper has produced a valid app token.
      VAULT_ADDR: https://vault:8200
      VAULT_TLS_ROOT_CERT: /certs/root_ca.crt
      VAULT_APP_TOKEN_FILE: /run/secrets-vault/app.token
      # App role (DML only) – connects as breakdown_app in production. TLS is
      # mandatory: sslmode=verify-full + the pinned step-ca root (ADR-024).
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-breakdown}?sslmode=verify-full&sslrootcert=/certs/root_ca.crt
      # Migrator role (DDL) – connects as breakdown_migrator; used only during
      # boot migration, then the pool is dropped. Falls back to DATABASE_URL.
      # In production, set MIGRATOR_DATABASE_URL as a separate secret AND with
      # the same sslmode=verify-full&sslrootcert=… query params (main.rs
      # validates this when REQUIRE_IN_TRANSIT_TLS=true).
      MIGRATOR_DATABASE_URL: ${MIGRATOR_DATABASE_URL:-}
      # SierraDB link terminates TLS at the stunnel sidecar (ADR-024). The
      # root is pinned via SIERRADB_TLS_ROOT_CERT (rediss:// + build_with_tls).
      SIERRADB_URL: rediss://stunnel:9091/?protocol=resp3
      SIERRADB_TLS_ROOT_CERT: /certs/root_ca.crt
      BIND_ADDR: "0.0.0.0:3000"
      # Startup gate: refuses plaintext prod URLs (missing sslmode,
      # redis:// SIERRADB_URL, http:// S3_ENDPOINT).
      REQUIRE_IN_TRANSIT_TLS: "true"
      # --- Photo storage (Garage / S3 via Caddy internal TLS site) ---
      S3_ENDPOINT: https://caddy:9443
      S3_TLS_ROOT_CERT: /certs/root_ca.crt
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?S3_ACCESS_KEY is required}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?S3_SECRET_KEY is required}
      S3_BUCKET: ${S3_BUCKET:-costume-photos}
      PHOTO_MAX_SIZE_MB: ${PHOTO_MAX_SIZE_MB:-20}
      PHOTO_GC_ENABLED: ${PHOTO_GC_ENABLED:-true}
      PHOTO_GC_INTERVAL_SECS: ${PHOTO_GC_INTERVAL_SECS:-3600}
      PHOTO_GC_MAX_AGE_SECS: ${PHOTO_GC_MAX_AGE_SECS:-86400}
      PHOTO_GC_BATCH_SIZE: ${PHOTO_GC_BATCH_SIZE:-1000}
      PHOTO_GC_DRY_RUN: ${PHOTO_GC_DRY_RUN:-false}
      # --- Report archival destination (credentials live only in Vault) ---
      REPORT_BACKUP_PROVIDER: ${REPORT_BACKUP_PROVIDER:-s3}
      # Opaque Settings aggregate id; never put GDrive credential fields here.
      REPORT_BACKUP_SETTINGS_ID: ${REPORT_BACKUP_SETTINGS_ID:-}
      REPORT_BACKUP_PREFIX: ${REPORT_BACKUP_PREFIX:-report-backup/}
      # --- OpenTelemetry hooks (ADR-011) ---
      # Enable OTEL export by setting OTEL_EXPORTER_OTLP_ENDPOINT.
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-breakdown-rs}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL:-http/protobuf}
      OTEL_TRACES_EXPORTER: ${OTEL_TRACES_EXPORTER:-otlp}
      OTEL_METRICS_EXPORTER: ${OTEL_METRICS_EXPORTER:-otlp}
      OTEL_LOGS_EXPORTER: ${OTEL_LOGS_EXPORTER:-none}
      RUST_LOG: ${RUST_LOG:-info,breakdown=info,sqlx=warn}
    volumes:
      # Pinned step-ca root, mounted read-only (ADR-024): the app never
      # writes certificates itself.
      - tls_data:/certs:ro
      # Only the least-privilege Vault app token is visible to the API. The
      # bootstrap/unseal/root material is in a different volume.
      - vault_app_token:/run/secrets-vault:ro
    # Internal-only (ADR-025 / issue #155): no `ports:` — the API is reachable
    # only on the Docker network from the `caddy` edge. The public internet
    # reaches the stack exclusively through Caddy on :80/:443.

  caddy:
    # Edge reverse proxy / TLS termination (ADR-025). Sole public entry point:
    # only Caddy's :80/:443 are published to the host; the `api` service above
    # is Docker-internal only. Also fronts the Garage S3 API on the internal
    # :9443 TLS site (ADR-024 / issue #156). Image pinned by digest.
    #
    # ACME account state + issued certificates live in the caddy_data volume
    # (on the LUKS-encrypted volume, ADR-023) so renewal survives restarts and
    # re-deploys. Caddy's admin API (:2019) stays internal-only (not published).
    image: caddy:2.9.1-alpine@sha256:b4e3952384eb9524a887633ce65c752dd7c71314d2c2acf98cd5c715aaa534f0
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
      tls-provision:
        condition: service_healthy
    ports:
      - "${CADDY_HTTP_PORT:-80}:80"
      - "${CADDY_HTTPS_PORT:-443}:443"
    environment:
      # Public site address — required before first boot. Caddy issues/rotates
      # the ACME certificate for this domain automatically (HTTP-01 by
      # default; DNS-01 via a Caddy DNS-provider plugin is a documented
      # follow-up, ADR-025 / ADR-027).
      DOMAIN: ${DOMAIN:?DOMAIN is required}
      # Edge request-body ceiling, kept aligned with the API's PHOTO_MAX_SIZE_MB
      # (the Caddyfile reads it via {$PHOTO_MAX_SIZE_MB}).
      PHOTO_MAX_SIZE_MB: ${PHOTO_MAX_SIZE_MB:-20}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      # step-ca-issued cert for the internal Garage site (ADR-024).
      - tls_data:/certs:ro

volumes:
  postgres_data:
  sierradb_data:
  garage_data:
  # Caddy ACME state (issuance account + certs) and runtime config (ADR-025).
  # Must live on the LUKS-encrypted volume (ADR-023).
  caddy_data:
  caddy_config:
  # step-ca CA key material (ADR-024). MUST live on the LUKS-encrypted volume
  # (ADR-023): compromise of this volume compromises the whole internal PKI.
  step_ca_data:
  # Shared leaf-cert mesh: step-ca root + postgres/stunnel/caddy certs issued
  # by the tls-provision loop, mounted read-only into the consumers (ADR-024).
  tls_data:
  # Rendered Garage TOML (ADR-019): written by the garage-config one-shot
  # from $GARAGE_* env vars, mounted read-only into the garage container.
  garage_config:
  # Vault file storage. The production host must place named volumes on the
  # LUKS-protected data device (ADR-023).
  vault_data:
  # Separate persistent unseal-key volume. Back it up only as encrypted,
  # offline key custody; never include it in ordinary Vault data snapshots.
  vault_unseal:
  # Separate least-privilege app-token volume; never share vault_data with api.
  vault_app_token:

secrets:
  # The bootstrap seed is mounted as a file and is never placed in
  # vault-bootstrap's Config.Env. Static Compose validation works when the
  # host variable is absent; the bootstrap script then fails closed at runtime.
  vault_bootstrap_token:
    environment: VAULT_BOOTSTRAP_TOKEN
