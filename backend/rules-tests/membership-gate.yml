# Rule tests for `membership-gate` (issue #537). Run via
# `ast-grep test -c sgconfig.yml -t rules-tests`.
#
# `valid` cases must NOT match (the shared helper's error path, non-membership
# receivers, predicates without the swallowed-error pattern, suppression with
# an explicit ignore comment); `invalid` cases MUST match (the pre-#537
# hand-written fail-closed-but-error-swallowing gate), for both receiver
# shapes actually used in `crates/api/src/handlers/mod.rs`.
id: membership-gate
language: Rust
valid:
  - |
    // The post-#537 pattern: the predicate error flows through the shared
    // helper — nothing is swallowed, so no match.
    async fn gate(state: &State) -> Result<(), ApiError> {
        membership_gate(
            state
                .ports
                .membership_repo()
                .has_active_costume_role_in_season(season_id, user.clone()),
            || ApiError::Forbidden("not authorized to view reports"),
        )
        .await?;
        Ok(())
    }
  - |
    // A different repository's predicate is not in scope.
    fn other_repo(repo: Repo) -> u8 {
        if repo.find_by_series_and_number(a, b).await.unwrap_or(false) { 1 } else { 0 }
    }
invalid:
  - |
    // Canonical pre-#537 shape: bare `membership_repo()` receiver.
    fn gate(state: &State) -> Result<(), ApiError> {
        let is_authorized = membership_repo()
            .has_active_costume_role_in_season(season_id, current_user.sub.clone())
            .await
            .unwrap_or(false);
        Ok(())
    }
  - |
    // The shape actually used by the handlers: chained field access up to the
    // `membership_repo()` call (must be caught too).
    fn gate(state: &State) -> Result<(), ApiError> {
        let authorized = state
            .ports
            .membership_repo()
            .has_active_credential_role(current_user.sub.clone())
            .await
            .unwrap_or(false);
        Ok(())
    }
  - |
    // The series-membership family.
    fn audit_gate(state: &State) -> Result<(), ApiError> {
        let authorized = membership_repo()
            .has_active_membership_in_series(series_id, user.clone())
            .await
            .unwrap_or(false);
        Ok(())
    }
  - |
    // The report-archive family.
    fn archive_gate(state: &State) -> Result<(), ApiError> {
        let is_authorized = membership_repo()
            .has_active_report_archive_role_in_season(block.season_id, user.clone())
            .await
            .unwrap_or(false);
        Ok(())
    }
  - |
    // The ops-role family — same swallow, same fix.
    fn ops_gate(state: &State) -> Result<(), ApiError> {
        let is_authorized = membership_repo()
            .has_active_ops_role(user.clone())
            .await
            .unwrap_or(false);
        Ok(())
    }
