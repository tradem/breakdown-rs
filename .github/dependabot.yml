version: 2
updates:
  - package-ecosystem: cargo
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    labels:
      - dependencies
    commit-message:
      prefix: "chore(deps)"
    # Group minor/patch bumps into one weekly PR to reduce PR noise; the PR
    # intentionally includes the backend/Cargo.lock diff — Cargo.lock is
    # committed (service workspace, reproducible builds, cargo-deny scanning)
    # and Dependabot always rewrites it together with the Cargo.toml
    # requirement. Major bumps stay as individual PRs for focused review.
    groups:
      cargo-minor-patch:
        update-types:
          - "minor"
          - "patch"
      # The OpenTelemetry crate family shares `opentelemetry`-types across crate
      # boundaries and MUST move in lockstep: bumping only one member leaves two
      # versions of `opentelemetry`/`opentelemetry_sdk` in the dependency graph
      # and fails to compile (E0277/E0308/E0599, "multiple different versions of
      # crate ..."). Dependabot classifies the pre-1.0 `0.x -> 0.y` jump of these
      # crates as a major update, so `cargo-minor-patch` (update-types-based) does
      # NOT catch them and it used to open one broken PR per crate.
      #
      # This group omits `update-types` on purpose, so it captures the 0.x
      # family bump (major included) and moves all members together. Keep
      # `tracing-opentelemetry` in the pattern set — it tracks the same
      # `opentelemetry` version with a +1 offset (OTEL 0.33 <-> tracing-otel 0.34),
      # so it is part of the lockstep even though its major digit differs.
      opentelemetry:
        patterns:
          - "opentelemetry"
          - "opentelemetry-*"
          - "opentelemetry_*"
          - "tracing-opentelemetry"
      # The utoipa family: `utoipa-swagger-ui` 10 depends on `utoipa` ^6 (9.x on
      # utoipa 5). Bumping a single member leaves two `utoipa` versions in the
      # graph and fails to compile in `crates/api/src/lib.rs`
      # (E0308, "expected `utoipa::openapi::OpenApi`, found a different ...").
      # Same lockstep situation as the OpenTelemetry family above, so this
      # patterns-based group moves utoipa and utoipa-swagger-ui together.
      # Pairing: utoipa 6 <-> utoipa-swagger-ui 10.
      utoipa:
        patterns:
          - "utoipa"
          - "utoipa-*"
          - "utoipa_*"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    labels:
      - ci
      - dependencies
    commit-message:
      prefix: "chore(ci)"
    # 18 distinct actions are in use across .github/workflows/, so with the
    # limit above a single update wave could not even be opened (Dependabot
    # silently skips PRs past the limit). Grouping keeps the wave reviewable.
    # SHA pins are still bumped by Dependabot together with the `# vX` comment,
    # so review is by trailing comment + CI.
    #
    # TWO groups are needed, and the order matters — Dependabot assigns a
    # dependency to the FIRST group it matches:
    #
    # 1. `github-actions-minor-patch` — version-classifiable minor/patch bumps.
    # 2. `github-actions-unclassified` — the catch-all. It carries NO
    #    `update-types` on purpose: an `update-types` filter forces Dependabot
    #    to derive a semver for the dependency first, and for SHA-pinned
    #    actions it does that from the release TAG. Pins whose commit has no
    #    tag (Swatinem/rust-cache was pinned to an untagged commit, so #756
    #    escaped the group as a single-action PR while tagged actions like
    #    taiki-e/install-action and docker/login-action were grouped in #754)
    #    are unclassifiable and would fall out of a filtered group. Without
    #    `update-types` they land here instead — grouped, not per-action.
    #    Action MAJORS also end up here (deliberate: they stay isolated from the
    #    routine wave — an action major can change inputs/permissions), so the
    #    worst case is 2 action PRs per week instead of one per action.
    #    Do NOT add `update-types: [major]` here — that would re-introduce the
    #    very filter that dropped the untagged pins.
    groups:
      github-actions-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      github-actions-unclassified:
        patterns:
          - "*"
  # Flutter app — Dart/pub dependencies for frontend-flutter/.
  # Dependabot's pub updater resolves with native `pub` and commits the
  # updated pubspec.lock itself, so a pub PR normally includes the lockfile
  # diff. Reviewer runbook: confirm the pubspec.lock diff is present and that
  # `flutter pub get` resolves cleanly on the pinned Flutter SDK. Do NOT run
  # `flutter pub upgrade` on a pub PR — it ignores the committed lockfile and
  # would override Dependabot's curated resolution. Full checklist:
  # .github/PULL_REQUEST_TEMPLATE/flutter.md.
  - package-ecosystem: pub
    directory: /frontend-flutter
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    labels:
      - dependencies
    commit-message:
      prefix: "chore(deps)"
    groups:
      flutter-pub-deps:
        patterns:
          - "*"
  # Android-first — Gradle/AGP + Kotlin plugin bumps for the Android target.
  # Caution: Flutter pins an AGP-compatibility floor per Flutter version;
  # validate major AGP bumps against the currently pinned Flutter SDK before
  # merging. macOS is a later target; no cocoapods block until native pods
  # are introduced.
  - package-ecosystem: gradle
    directory: /frontend-flutter/android
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: "chore(deps-android)"
