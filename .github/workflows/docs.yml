name: Docs Build & Publish

# Builds the arc42 architecture documentation from
# backend/docs/architecture/arc42-typst/:
#   - PDF and HTML per run (versioned on release tags)
#   - HTML published to GitHub Pages on main (always latest)
#   - versioned PDF + HTML attached to the GitHub Release on api-v* tags
#
# The release itself is triggered by cutting a tag (api-vX.Y.Z) from a
# release branch that carries the changelog dates (ADR-020). This workflow
# only builds and publishes the documentation artifacts.

on:
  push:
    branches: [main]
    tags:
      - "api-v*"
  workflow_dispatch:

concurrency:
  group: docs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/main' }}

permissions:
  contents: read

env:
  TYPST_VERSION: 0.15.1
  # Pin the official typst binary (musl, full features incl. `--features html`)
  # by SHA-256 of the tarball to avoid moving builds.
  TYPST_SHA256: a6d077d0a95eed5a2eba715b2dae06be954f624ccbf85758a03f389ded33118c
  # Multi-arch digest of plantuml/plantuml:1.2026.6 (renders .puml -> .svg)
  PLANTUML_IMAGE: plantuml/plantuml@sha256:47870c1f76cfb3747bc7090bfe83013a4e3105b5a0bb1515e2baf5d3e2b3ee9d

jobs:
  docs:
    name: Build + publish documentation
    runs-on: ubuntu-latest
    permissions:
      contents: write # gh release create/upload on tags
      pages: write     # GitHub Pages deployment
      id-token: write  # GitHub Pages OIDC
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # --- determine version (tag api-vX.Y.Z -> X.Y.Z, otherwise dev-<sha>) ---
      - name: Compute docs version
        id: version
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ "${REF_NAME}" == api-v* ]]; then
            version="${REF_NAME#api-v}"
          else
            version="dev-${GITHUB_SHA:0:7}"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      # --- build date: commit timestamp on push, today otherwise -------
      - name: Compute build date
        id: date
        env:
          HEAD_COMMIT_TS: ${{ github.event.head_commit.timestamp || '' }}
        run: |
          set -euo pipefail
          if [[ -n "${HEAD_COMMIT_TS}" ]]; then
            echo "date=$(date -d "${HEAD_COMMIT_TS}" +%F)" >> "$GITHUB_OUTPUT"
          else
            echo "date=$(date +%F)" >> "$GITHUB_OUTPUT"
          fi

      # --- PlantUML -> SVG ---------------------------------------------------
      - name: Render PlantUML diagrams to SVG
        env:
          PLANTUML_IMAGE: ${{ env.PLANTUML_IMAGE }}
        run: |
          set -euo pipefail
          mkdir -p backend/docs/architecture/arc42-typst/diagrams
          docker run --rm \
            -v "$PWD/backend/docs/architecture/diagrams:/src:ro" \
            -v "$PWD/backend/docs/architecture/arc42-typst/diagrams:/out" \
            "$PLANTUML_IMAGE" \
            -tsvg -o /out /src/*.puml
          ls backend/docs/architecture/arc42-typst/diagrams/

      # --- install pinned typst CLI ------------------------------------------
      - name: Install typst CLI (pinned)
        env:
          TYPST_VERSION: ${{ env.TYPST_VERSION }}
          TYPST_SHA256: ${{ env.TYPST_SHA256 }}
        run: |
          set -euo pipefail
          url="https://github.com/typst/typst/releases/download/v${TYPST_VERSION}/typst-x86_64-unknown-linux-musl.tar.xz"
          curl -sSfL -o typst.tar.xz "$url"
          echo "${TYPST_SHA256}  typst.tar.xz" | sha256sum -c -
          tar -xJf typst.tar.xz
          mkdir -p "$HOME/.local/bin"
          mv typst-x86_64-unknown-linux-musl/typst "$HOME/.local/bin/typst"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          typst --version

      # --- build PDF + HTML --------------------------------------------------
      - name: Build documentation (PDF + HTML)
        working-directory: backend/docs/architecture/arc42-typst
        env:
          DOCS_VERSION: ${{ steps.version.outputs.version }}
          DOCS_BUILD_DATE: ${{ steps.date.outputs.date }}
        run: |
          set -euo pipefail
          ./build.sh
          ls -la dist/

      # --- publish HTML to GitHub Pages (main only) ---------------------------
      - name: Stage HTML for GitHub Pages
        if: github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          mkdir -p pages
          cp backend/docs/architecture/arc42-typst/dist/architecture-*.html pages/index.html

      - name: Upload GitHub Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: pages

      - name: Deploy to GitHub Pages
        if: github.ref == 'refs/heads/main'
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

      # --- attach versioned artifacts to the release (tags only) --------------
      - name: Publish documentation to GitHub Release
        if: startsWith(github.ref, 'refs/tags/api-v')
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          DOCS_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          artifacts=(backend/docs/architecture/arc42-typst/dist/architecture-*.pdf \
                     backend/docs/architecture/arc42-typst/dist/architecture-*.html)
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" "${artifacts[@]}" --clobber
          else
            gh release create "${RELEASE_TAG}" \
              --title "${RELEASE_TAG}" \
              --generate-notes
            gh release upload "${RELEASE_TAG}" "${artifacts[@]}"
          fi
          echo "Published docs v${DOCS_VERSION} to release ${RELEASE_TAG}"
