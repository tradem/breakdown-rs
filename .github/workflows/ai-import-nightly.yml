# AI Import Nightly — reads the real GDrive documents and runs the live LLM
# ingestion smoke (provider/model from AI_LLM_* variables, key from the
# AI_LLM_API_KEY secret). Runs after the nightly fuzz run (03:00 UTC) and
# before the standard CI daily runs.
#
# Since issue #808 it also runs the **Decision Model** live smoke: the System
# One wire contract was wrong in both directions for months while CI stayed
# green, because every unit test mocked the provider with our own assumption.
# That test is `#[ignore]`-gated in the PR gate (it needs the network, a real
# credential and spends money) and is the only artifact that detects a
# provider-side schema change — so a nightly red here is the signal we want.
#
# Note: this workflow was originally claimed to exist before the feature
# branch; it did not. It is defined here so the nightly document-ingestion
# check is actually scheduled.

name: AI Import Nightly

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-import-nightly-${{ github.ref }}
  cancel-in-progress: true

env:
  SIERRADB_IMAGE: tqwewe/sierradb:0.3.1
  POSTGRES_IMAGE: docker.io/postgres:16-alpine
  VAULT_IMAGE: hashicorp/vault:1.17

jobs:
  ai-import-nightly:
    name: AI document ingestion (GDrive + LLM)
    runs-on: ubuntu-latest
    timeout-minutes: 75
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Read-only job: no authenticated git commands are run after checkout.
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Verify Docker is available
        run: docker info

      - name: Pre-pull Docker images (with retries)
        run: |
          pull_with_retry() {
            local image=$1
            local max_attempts=3
            local attempt=1
            while [ $attempt -le $max_attempts ]; do
              if docker pull "$image"; then
                echo "Pulled $image"
                return 0
              fi
              sleep 5
              attempt=$((attempt + 1))
            done
            echo "ERROR: failed to pull $image" >&2
            return 1
          }
          pull_with_retry "$SIERRADB_IMAGE"
          pull_with_retry "$POSTGRES_IMAGE"
          pull_with_retry "$VAULT_IMAGE"

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@eedcf2fb1c22f010a0eb66b92f378c110977f266 # v2
        with:
          workspaces: "backend"

      - name: Install poppler-utils (pdftotext for the AI script path)
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: GDrive document source smoke (nightly)
        env:
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
          GDRIVE_ROOT: ${{ secrets.GDRIVE_ROOT }}
        run: |
          echo "GDRIVE lengths: client_id=${#GDRIVE_CLIENT_ID} secret=${#GDRIVE_CLIENT_SECRET} refresh=${#GDRIVE_REFRESH_TOKEN} root=${#GDRIVE_ROOT}"
          cargo test -p integration-tests --test ai_gdrive_fixture_test -- --nocapture

      # Two levels, both live (see the test module docs): a small canary with the
      # PRODUCTION prompt, and the real fixture scripts (292/293/294/Drehbuch_1/
      # Drehbuch_2.pdf) through the production path — GDrive → `pdftotext -layout`
      # → the deterministic splitter → one paid call on each document's LARGEST
      # chunk at the production output budget.
      #
      # Why both: until 2026-11-20 this step sent a hard-coded three-line prompt
      # and a toy three-scene snippet, so it stayed green while a real import
      # dead-lettered with "LLM response contained no content". A green line here
      # must mean "the product can read our documents", not "the provider answers
      # a trivial request".
      - name: Live LLM ingestion smoke (nightly)
        timeout-minutes: 25
        env:
          AI_LLM_API_KEY: ${{ secrets.AI_LLM_API_KEY }}
          AI_LLM_PROVIDER: ${{ vars.AI_LLM_PROVIDER }}
          AI_LLM_MODEL: ${{ vars.AI_LLM_MODEL }}
          # The real-document half reads the fixture folder through the same
          # Vault-backed GDrive source the product uses.
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
          GDRIVE_ROOT: ${{ secrets.GDRIVE_ROOT }}
        run: |
          if [ -z "$AI_LLM_API_KEY" ]; then
            echo "AI_LLM_API_KEY not configured — live LLM smoke will skip (asserts nothing)."
          else
            echo "AI_LLM_PROVIDER=${AI_LLM_PROVIDER:-eurouter} AI_LLM_MODEL=${AI_LLM_MODEL:-mistral-large-3}"
            if [ -z "$GDRIVE_CLIENT_ID" ]; then
              echo "GDRIVE_CLIENT_ID not configured — the real-document half will skip (asserts nothing)."
            else
              echo "Required fixtures: 292.pdf 293.pdf 294.pdf Drehbuch_1.pdf Drehbuch_2.pdf"
            fi
          fi
          cargo test -p integration-tests --test ai_llm_smoke_test -- --nocapture

      # 2026-11-20 output-budget investigation: does pinning the provider-side
      # `reasoning_effort` remove the pathology the run of that date proved — a
      # reasoning model that spends its whole output ceiling before emitting one
      # content token (`finish_reason=length`, `content=null`, 8_192 billable
      # output tokens, 70-85 s upstream per 4 KB scene)?
      #
      # Deliberately a SEPARATE provider/model/key (`AI_LLM_PROBE_*`): the step
      # above must keep guarding what ships (eurouter/mistral-large-3), and the
      # 2026-11-20 outage silenced two checks at once because both shared one
      # provider. This one is a measurement — the numbers are in the log lines
      # `reasoning-effort row` and `reasoning-effort comparison`.
      - name: Reasoning-effort probe (nightly, measurement)
        if: ${{ !cancelled() }}
        # The document pass alone is 40 sequential paid calls (~4 min at
        # `low`, ~17 min at the provider default), so the step needs room for
        # the A/B *and* the full document on one provider.
        timeout-minutes: 30
        env:
          AI_LLM_PROBE_API_KEY: ${{ secrets.AI_LLM_PROBE_API_KEY }}
          AI_LLM_PROBE_PROVIDER: ${{ vars.AI_LLM_PROBE_PROVIDER }}
          AI_LLM_PROBE_MODELS: ${{ vars.AI_LLM_PROBE_MODELS }}
          AI_LLM_PROBE_EFFORTS: ${{ vars.AI_LLM_PROBE_EFFORTS }}
          AI_LLM_PROBE_DOC_MODEL: ${{ vars.AI_LLM_PROBE_DOC_MODEL }}
          AI_LLM_PROBE_DOC_VARIANTS: ${{ vars.AI_LLM_PROBE_DOC_VARIANTS }}
          AI_LLM_PROBE_DOC_CHUNKS: ${{ vars.AI_LLM_PROBE_DOC_CHUNKS }}
          AI_LLM_PROBE_DOCUMENT: ${{ vars.AI_LLM_PROBE_DOCUMENT }}
          # Optional: the published price so the pass reports money, not just
          # tokens (`glm-5.3-flash`: 0.15 in / 0.50 out per million tokens).
          AI_LLM_PROBE_PRICE_IN_PER_MTOK: ${{ vars.AI_LLM_PROBE_PRICE_IN_PER_MTOK }}
          AI_LLM_PROBE_PRICE_OUT_PER_MTOK: ${{ vars.AI_LLM_PROBE_PRICE_OUT_PER_MTOK }}
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
          GDRIVE_ROOT: ${{ secrets.GDRIVE_ROOT }}
        run: |
          if [ -z "$AI_LLM_PROBE_API_KEY" ]; then
            echo "AI_LLM_PROBE_API_KEY not configured — reasoning-effort probe will skip (asserts nothing)."
          else
            echo "probe provider=${AI_LLM_PROBE_PROVIDER:-neuralwatt}"
            echo "probe models=${AI_LLM_PROBE_MODELS:-glm-5.3-flash,deepseek-v4.1-flash} efforts=${AI_LLM_PROBE_EFFORTS:-default,low}"
            echo "probe document=${AI_LLM_PROBE_DOCUMENT:-292.pdf} model=${AI_LLM_PROBE_DOC_MODEL:-<first>} variants=${AI_LLM_PROBE_DOC_VARIANTS:-low} chunks=${AI_LLM_PROBE_DOC_CHUNKS:-all}"
          fi
          # `--test-threads=1`: two probes against one provider in parallel would
          # distort exactly what they measure (wall clock and rate-limit
          # behaviour).
          cargo test -p integration-tests --test ai_llm_smoke_test reasoning_effort -- --nocapture --test-threads=1

      # Issue #808: one question of each kind against the curated System One
      # endpoint — `200` and a parsed answer per kind, or the provider's own
      # `details[].path` in the failure. It never prints the credential and
      # skips itself when the key is absent.
      # Runs even when an earlier smoke step failed: the System One check is
      # independent of the GDrive/LLM ones, and its whole purpose is to be the
      # signal that a provider-side schema change is caught. A cancelled run is
      # still cancelled (`!cancelled()`), so it cannot outlive the job.
      - name: Live Decision Model smoke (nightly)
        if: ${{ !cancelled() }}
        env:
          # A dedicated decision credential wins; the current deployment uses
          # the same EURouter key for script extraction and scoring, so the
          # assistant key is the fallback rather than a silent no-op.
          DECISION_LIVE_KEY: ${{ secrets.DECISION_LIVE_KEY || secrets.AI_LLM_API_KEY }}
          DECISION_LIVE_PROVIDER: ${{ vars.DECISION_LIVE_PROVIDER }}
          DECISION_LIVE_MODEL: ${{ vars.DECISION_LIVE_MODEL }}
        run: |
          if [ -z "$DECISION_LIVE_KEY" ]; then
            echo "DECISION_LIVE_KEY not configured — the live System One smoke will skip."
          else
            echo "DECISION_LIVE_PROVIDER=${DECISION_LIVE_PROVIDER:-eurouter} DECISION_LIVE_MODEL=${DECISION_LIVE_MODEL:-clef-flash}"
          fi
          cargo test -p infra --lib \
            ai::decision_client::decision_client_tests::live_systemone \
            -- --ignored --nocapture
