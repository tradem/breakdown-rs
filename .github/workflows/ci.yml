name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    working-directory: backend

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - uses: Swatinem/rust-cache@258712b0b7b1ddf8bddc9fc3b0faca682b2736c3 # v2
        with:
          workspaces: "backend"
      - run: cargo build --workspace --all-targets --all-features --exclude breakdown-fuzz-targets

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - uses: Swatinem/rust-cache@258712b0b7b1ddf8bddc9fc3b0faca682b2736c3 # v2
        with:
          workspaces: "backend"
      # `ai::tests::script_pdf_round_trip_reaches_scene_apply` shells out to
      # the `pdftotext` binary (poppler-utils); ubuntu-latest does not ship it.
      - name: Install poppler-utils (pdftotext for AI script PDF tests)
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: cargo test --workspace --features infra/test-support --exclude integration-tests --exclude breakdown-fuzz-targets
      # The patched kameo_es crate is not a workspace member, so its ack
      # tracker tests are run explicitly here (issue #165 ack semantics).
      - run: cargo test --manifest-path .patches/kameo_es/Cargo.toml --test ack_tracker

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@258712b0b7b1ddf8bddc9fc3b0faca682b2736c3 # v2
        with:
          workspaces: "backend"
      - run: cargo clippy --workspace --all-targets --all-features --exclude breakdown-fuzz-targets -- -D warnings

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@258712b0b7b1ddf8bddc9fc3b0faca682b2736c3 # v2
        with:
          workspaces: "backend"
      - run: cargo fmt --all -- --check

  # Fuzz targets are built by cargo-fuzz on nightly only; they need cfg(fuzzing)
  # to provide a main function, so they are excluded from the CI build above.

  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - uses: Swatinem/rust-cache@258712b0b7b1ddf8bddc9fc3b0faca682b2736c3 # v2
        with:
          workspaces: "backend"
      - run: cargo check --workspace --all-targets --all-features --exclude breakdown-fuzz-targets

  # ADR-020 D2/D5: the declared MSRV floor (workspace rust-version = 1.94,
  # matching the Dockerfile builder) is verified on every PR with the pinned
  # 1.94.0 toolchain. A future MSRV bump is a MAJOR change per crate (D2).
  msrv:
    name: MSRV (rust-version 1.94)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # 1.94
        with:
          toolchain: 1.94.0
      - uses: Swatinem/rust-cache@258712b0b7b1ddf8bddc9fc3b0faca682b2736c3 # v2
        with:
          workspaces: "backend"
      - uses: taiki-e/install-action@b6b84cf49ebfe0176417bdce007c624f0db37f20
        with:
          tool: cargo-hack
      - run: cargo hack check --workspace --all-targets --rust-version --exclude breakdown-fuzz-targets
        working-directory: backend

  # Compose + Caddyfile validation (issue #155 / ADR-025 + issue #156 / ADR-024):
  # `docker compose config` is daemon-free; the Caddy `caddy validate` steps
  # pull the digest-pinned edge image once to catch Caddyfile errors before
  # they reach a prod boot. The prod Caddyfile references the step-ca-issued
  # internal-site certs (ADR-024), so validation generates throwaway
  # self-signed placeholders into a /certs mount first.
  compose-config:
    name: Compose + Caddyfile validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Validate compose files (prod + dev overlays)
        run: |
          set -e
          # Placeholders satisfy the `:?`-required vars for `config` parsing.
          export POSTGRES_PASSWORD=ci-placeholder
          export GARAGE_ADMIN_TOKEN=ci-placeholder
          export GARAGE_RPC_SECRET=ci-placeholder
          export GARAGE_METRICS_TOKEN=ci-placeholder
          export S3_ACCESS_KEY=ci-placeholder
          export S3_SECRET_KEY=ci-placeholder
          export DOMAIN=ci.example.com
          export STEP_CA_PASSWORD=ci-placeholder
          docker compose -f docker-compose.prod.yml config --quiet
          docker compose -f docker-compose.dev.yml -f docker-compose.idp.yml config --quiet
          docker compose -f docker-compose.dev.yml -f docker-compose.caddy.yml config --quiet
          docker compose -f docker-compose.dev.yml -f docker-compose.idp.yml -f docker-compose.caddy.yml config --quiet
          echo "OK: all compose configurations validate"

      - name: Validate Caddyfile syntax (prod + dev)
        run: |
          set -e
          IMAGE="caddy:2.9.1-alpine@sha256:b4e3952384eb9524a887633ce65c752dd7c71314d2c2acf98cd5c715aaa534f0"
          # The prod Caddyfile's internal Garage site (ADR-024) uses
          # file-based certs from the tls_data volume; provide throwaway
          # self-signed placeholders so `caddy validate` can provision them.
          mkdir -p /tmp/certs
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -subj "/CN=caddy" -addext "subjectAltName=DNS:caddy,DNS:localhost" \
            -keyout /tmp/certs/caddy.key -out /tmp/certs/caddy.crt 2>/dev/null
          docker run --rm -e DOMAIN=ci.example.com -e PHOTO_MAX_SIZE_MB=20 \
            -v "$PWD/Caddyfile:/etc/caddy/Caddyfile:ro" \
            -v "/tmp/certs:/certs:ro" "$IMAGE" \
            caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
          docker run --rm -e DOMAIN=localhost -e PHOTO_MAX_SIZE_MB=20 \
            -v "$PWD/Caddyfile.dev:/etc/caddy/Caddyfile:ro" "$IMAGE" \
            caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
          echo "OK: Caddyfiles validate"


