name: Integration Tests

permissions:
  contents: read

# Tier 1-3: Postgres-only projector/repository tests.
# Tier 4 (ADR-016): full `command -> SierraDB -> projector -> Postgres` round-trip.
# The Tier-4 tests pull `tqwewe/sierradb:0.3.1` via testcontainers in addition to
# the Postgres image, so the only host prerequisite is Docker (or a compatible
# container runtime) with network access to Docker Hub. See
# `backend/AGENTS.md` Sec. Integration tests and `backend/docs/operations/runbooks.md`.
#
# AI import/payload tests (issue #226): the Postgres-only AI test files added in
# follow-up PRs to #169 were never wired into CI. They are split by weight: the
# four light files run in the main job's Postgres-only step; the four heavy files
# (up to 13 Postgres + 4 Garage containers per binary) run in the separate
# `ai-import-integration-tests` job so the main job stays within its 30-minute
# budget. SierraDB-requiring AI tests (`ai_payload_storage_round_trip`) stay in
# the sequential group; `ai_llm_smoke_test` is nightly-only by design (see
# ai-import-nightly.yml), while `ai_gdrive_fixture_test` also runs here for
# trusted pushes and trusted pull requests (see the AI GDrive fixture smoke
# test step below).
#
# Flaky-test prevention:
# - Docker images are pre-pulled with retries to handle transient network failures.
# - Rust dependency caching reduces build time on repeat runs.
# - Concurrency control prevents parallel runs on the same branch.
# - Job timeout prevents runaway tests from blocking the queue.
#
# Recommended: Run CI (build, test, clippy, fmt) first. If CI passes,
# integration tests are more likely to succeed. However, we don't use
# workflow_call dependency here because ci.yml doesn't support it yet.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Prevent concurrent runs on the same branch to avoid Docker resource contention.
concurrency:
  group: integration-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration-tests:
    name: Testcontainers integration tests (Postgres + SierraDB)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend

    env:
      SIERRADB_IMAGE: tqwewe/sierradb:0.3.1
      POSTGRES_IMAGE: docker.io/postgres:16-alpine
      VAULT_IMAGE: hashicorp/vault:1.17
      GARAGE_IMAGE: dxflrs/garage:v1.0.1

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Read-only job: no authenticated git commands are run after checkout.
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Verify Docker is available
        run: |
          docker info
          # This step must fail loudly if Docker is missing. Do not silently
          # pass; missing Docker masks test failures. The Tier-4 tests also
          # pull `tqwewe/sierradb:0.3.1`, so Docker Hub connectivity is required.

      # Pre-pull Docker images with retries to avoid flaky failures from
      # transient network issues during test execution.
      - name: Pre-pull Docker images (with retries)
        run: |
          pull_with_retry() {
            local image=$1
            local max_attempts=3
            local attempt=1
            
            while [ $attempt -le $max_attempts ]; do
              echo "Pulling $image (attempt $attempt/$max_attempts)..."
              if docker pull "$image"; then
                echo "Successfully pulled $image"
                return 0
              fi
              echo "Pull failed, retrying in 5s..."
              sleep 5
              attempt=$((attempt + 1))
            done
            
            echo "ERROR: Failed to pull $image after $max_attempts attempts" >&2
            return 1
          }
          
          pull_with_retry "$SIERRADB_IMAGE"
          pull_with_retry "$POSTGRES_IMAGE"
          pull_with_retry "$VAULT_IMAGE"
          # Garage is started by the photo and AI payload round-trip tests
          # (photo_storage_tests, ai_payload_storage_round_trip, …) via
          # `spawn_garage`; pre-pull it with the same retry policy so a
          # transient pull failure cannot flake a test run.
          pull_with_retry "$GARAGE_IMAGE"

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          workspaces: "backend"

      - name: Check production crates do not depend on integration-tests
        run: |
          for pkg in breakdown_core infra api; do
            if cargo tree -p "$pkg" -e normal --depth 1 --prefix none | grep -q '^integration-tests '; then
              echo "ERROR: package '$pkg' depends on integration-tests" >&2
              exit 1
            fi
          done
          echo "OK: no production crate depends on integration-tests"

      - name: Vault Testcontainers fixture
        env:
          RUST_LOG: info
        run: cargo test -p integration-tests --test vault_fixture_test -- --nocapture

      - name: AI GDrive fixture smoke test
        # CWE-522 / CWE-200: the step injects live GDrive credentials into code
        # that runs the PR's merge ref. Only run it for trusted contexts —
        # pushes to main, or PRs authored by an OWNER/MEMBER/COLLABORATOR — so
        # untrusted PR code cannot exfiltrate the secrets (they are masked in
        # logs, but an attacker could encode and exfiltrate them).
        if: >-
          github.event_name == 'push' ||
          (github.event_name == 'pull_request' &&
           contains(fromJson('["OWNER", "MEMBER", "COLLABORATOR"]'),
                    github.event.pull_request.author_association))
        env:
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
          GDRIVE_ROOT: ${{ secrets.GDRIVE_ROOT }}
        run: |
          # Diagnostic: GitHub masks the values but not the shell string
          # lengths. Expected: client_id=72 secret=35 refresh=103 root=17
          # (refresh=1//… is the working token; root=breakdown-rs-test).
          echo "GDRIVE lengths: client_id=${#GDRIVE_CLIENT_ID} secret=${#GDRIVE_CLIENT_SECRET} refresh=${#GDRIVE_REFRESH_TOKEN} root=${#GDRIVE_ROOT}"
          cargo test -p integration-tests --test ai_gdrive_fixture_test -- --nocapture

      - name: Postgres-only integration tests (parallel)
        env:
          RUST_LOG: info
        run: |
          # Note: --test <name> flags go BEFORE the first -- (Cargo option);
          # --nocapture goes AFTER -- (test runner option).
          # Light AI import/payload tests (issue #226) run here; the heavy AI
          # files run in the dedicated `ai-import-integration-tests` job.
          cargo test -p integration-tests \
            --test ai_concurrency_shutdown \
            --test ai_import_mapping_reservation \
            --test ai_import_queue_telemetry \
            --test ai_payload_restart_recovery \
            --test photo_gc_sweep \
            --test photo_storage_tests \
            --test projector_scene_test \
            --test repository_scene_test \
            --test role_separation_tests \
            --test scene_shoot_repository_tests \
            --test smoke_costume_round_trip \
            --test smoke_postgres_harness \
            --test supervisor_budget_test \
            -- \
            --nocapture

      - name: SierraDB round-trip integration tests (sequential)
        env:
          RUST_LOG: info,sierradb=debug,kameo_es=debug
        run: |
          # SierraDB containers require ~400 MB each (Postgres + SierraDB pair).
          # ubuntu-latest has ~7 GB RAM — running too many in parallel OOMs.
          # We run them sequentially (one test file at a time) to avoid
          # resource exhaustion. See ADR-014 / ADR-016 and AGENTS.md §
          # "Integration tests" for the background.
          #
          # Note: --test <name> flags go BEFORE the first -- (Cargo option);
          # --test-threads=1 goes AFTER -- (test runner option).
          cargo test -p integration-tests \
            --test sierradb_round_trip \
            --test audit_projector_tests \
            --test audit_cross_cutting_tests \
            --test continuity_photo_round_trip \
            --test photo_round_trip \
            --test photo_nm_deletion \
            --test membership_round_trip \
            --test scene_shoot_idempotency_tests \
            --test scene_shoot_round_trip \
            --test shooting_day_round_trip \
            --test costume_category_round_trip \
            --test ai_payload_storage_round_trip \
            --test projector_tests \
            --test query_repository_tests \
            --test command_adapter_tests \
            -- \
            --test-threads=1 \
            --nocapture

      # GDrive archival provider contract test.
      # Only runs when the GDRIVE_CLIENT_ID secret is configured AND the PR is
      # trusted (same trust gate as the AI GDrive fixture step above).
      - name: GDrive archival provider contract test
        if: >-
          env.REPORT_BACKUP_GDRIVE_CLIENT_ID != '' &&
          (github.event_name == 'push' ||
           (github.event_name == 'pull_request' &&
            contains(fromJson('["OWNER", "MEMBER", "COLLABORATOR"]'),
                     github.event.pull_request.author_association)))
        env:
          REPORT_BACKUP_PROVIDER: gdrive
          REPORT_BACKUP_GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          REPORT_BACKUP_GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          REPORT_BACKUP_GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
          REPORT_BACKUP_GDRIVE_ROOT: ${{ secrets.GDRIVE_ROOT }}
          REPORT_BACKUP_PREFIX: ci/
        run: cargo test -p infra -- reporting::storage_contract_test::gdrive_contract -- --nocapture

      - name: GDrive archival provider contract test (skipped)
        if: >-
          env.REPORT_BACKUP_GDRIVE_CLIENT_ID == '' &&
          (github.event_name == 'push' ||
           (github.event_name == 'pull_request' &&
            contains(fromJson('["OWNER", "MEMBER", "COLLABORATOR"]'),
                     github.event.pull_request.author_association)))
        env:
          REPORT_BACKUP_GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
        run: echo SKIP - GDrive contract test - set GDRIVE_CLIENT_ID secret to enable

  # Heavy AI import/payload integration tests (issue #226). The main job's
  # Postgres-only step stays lean; these binaries spawn up to 13 Postgres
  # containers (plus Garage for the GC sweep) each, which would push the main
  # job past its 30-minute budget. Postgres-only: no SierraDB, so no
  # `--test-threads=1` needed. Separate runner => no Docker contention with the
  # main job; same `concurrency` group => same-ref runs still cancel each other.
  ai-import-integration-tests:
    name: AI import integration tests (Postgres + Garage)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend

    env:
      POSTGRES_IMAGE: docker.io/postgres:16-alpine
      GARAGE_IMAGE: dxflrs/garage:v1.0.1

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Read-only job: no authenticated git commands are run after checkout.
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Verify Docker is available
        run: |
          docker info
          # This step must fail loudly if Docker is missing. Do not silently
          # pass; missing Docker masks test failures.

      # Pre-pull Docker images with retries to avoid flaky failures from
      # transient network issues during test execution.
      - name: Pre-pull Docker images (with retries)
        run: |
          pull_with_retry() {
            local image=$1
            local max_attempts=3
            local attempt=1

            while [ $attempt -le $max_attempts ]; do
              echo "Pulling $image (attempt $attempt/$max_attempts)..."
              if docker pull "$image"; then
                echo "Successfully pulled $image"
                return 0
              fi
              echo "Pull failed, retrying in 5s..."
              sleep 5
              attempt=$((attempt + 1))
            done

            echo "ERROR: Failed to pull $image after $max_attempts attempts" >&2
            return 1
          }

          pull_with_retry "$POSTGRES_IMAGE"
          # Garage is started by ai_payload_gc_cleanup_state via `spawn_garage`;
          # pre-pull it with the same retry policy so a transient pull failure
          # cannot flake a test run.
          pull_with_retry "$GARAGE_IMAGE"

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          workspaces: "backend"

      - name: AI import Postgres-only integration tests (parallel)
        env:
          RUST_LOG: info
        run: |
          # Heavy AI import/payload files (issue #226): each spawns up to 13
          # Postgres containers (ai_payload_gc_cleanup_state also spawns
          # Garage). They run with parallel test threads — Postgres-only, so
          # no `--test-threads=1` and no SierraDB memory concern.
          #
          # Note: --test <name> flags go BEFORE the first -- (Cargo option);
          # --nocapture goes AFTER -- (test runner option).
          cargo test -p integration-tests \
            --test ai_concurrency_permit_cancellation \
            --test ai_import_permit_reconciliation \
            --test ai_import_queue_lease \
            --test ai_payload_gc_cleanup_state \
            -- \
            --nocapture
