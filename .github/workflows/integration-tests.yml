name: Integration Tests

permissions:
  contents: read

# Tier 1-3: Postgres-only projector/repository tests.
# Tier 4 (ADR-016): full `command -> SierraDB -> projector -> Postgres` round-trip.
# The Tier-4 tests pull `tqwewe/sierradb:0.3.1` via testcontainers in addition to
# the Postgres image, so the only host prerequisite is Docker (or a compatible
# container runtime) with network access to Docker Hub. See
# `backend/AGENTS.md` Sec. Integration tests and `backend/docs/operations/runbooks.md`.
#
# Flaky-test prevention:
# - Docker images are pre-pulled with retries to handle transient network failures.
# - Rust dependency caching reduces build time on repeat runs.
# - Concurrency control prevents parallel runs on the same branch.
# - Job timeout prevents runaway tests from blocking the queue.
#
# Recommended: Run CI (build, test, clippy, fmt) first. If CI passes,
# integration tests are more likely to succeed. However, we don't use
# workflow_call dependency here because ci.yml doesn't support it yet.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Prevent concurrent runs on the same branch to avoid Docker resource contention.
concurrency:
  group: integration-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration-tests:
    name: Testcontainers integration tests (Postgres + SierraDB)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend

    env:
      SIERRADB_IMAGE: tqwewe/sierradb:0.3.1
      POSTGRES_IMAGE: docker.io/postgres:16-alpine

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Verify Docker is available
        run: |
          docker info
          # This step must fail loudly if Docker is missing. Do not silently
          # pass; missing Docker masks test failures. The Tier-4 tests also
          # pull `tqwewe/sierradb:0.3.1`, so Docker Hub connectivity is required.

      # Pre-pull Docker images with retries to avoid flaky failures from
      # transient network issues during test execution.
      - name: Pre-pull Docker images (with retries)
        run: |
          pull_with_retry() {
            local image=$1
            local max_attempts=3
            local attempt=1
            
            while [ $attempt -le $max_attempts ]; do
              echo "Pulling $image (attempt $attempt/$max_attempts)..."
              if docker pull "$image"; then
                echo "Successfully pulled $image"
                return 0
              fi
              echo "Pull failed, retrying in 5s..."
              sleep 5
              attempt=$((attempt + 1))
            done
            
            echo "ERROR: Failed to pull $image after $max_attempts attempts" >&2
            return 1
          }
          
          pull_with_retry "$SIERRADB_IMAGE"
          pull_with_retry "$POSTGRES_IMAGE"

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: "backend"

      - name: Check production crates do not depend on integration-tests
        run: |
          for pkg in breakdown_core infra api; do
            if cargo tree -p "$pkg" -e normal --depth 1 --prefix none | grep -q '^integration-tests '; then
              echo "ERROR: package '$pkg' depends on integration-tests" >&2
              exit 1
            fi
          done
          echo "OK: no production crate depends on integration-tests"

      - name: Run integration tests
        env:
          RUST_LOG: info,sierradb=debug,kameo_es=debug
          # Enable testcontainers image reuse to speed up parallel tests
          # within the same CI run.
          TESTCONTAINERS_REUSE: "1"
        run: cargo test -p integration-tests -- --nocapture

      # GDrive archival provider contract test.
      # Only runs when the GDRIVE_CLIENT_ID secret is configured.
      - name: GDrive archival provider contract test
        if: env.REPORT_BACKUP_GDRIVE_CLIENT_ID != ''
        env:
          REPORT_BACKUP_PROVIDER: gdrive
          REPORT_BACKUP_GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          REPORT_BACKUP_GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          REPORT_BACKUP_GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
          REPORT_BACKUP_GDRIVE_ROOT: ${{ secrets.GDRIVE_ROOT }}
          REPORT_BACKUP_PREFIX: ci/
        run: cargo test -p infra -- reporting::storage_contract_test::gdrive_contract -- --nocapture

      - name: GDrive archival provider contract test (skipped)
        if: env.REPORT_BACKUP_GDRIVE_CLIENT_ID == ''
        env:
          REPORT_BACKUP_GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
        run: echo SKIP - GDrive contract test - set GDRIVE_CLIENT_ID secret to enable
