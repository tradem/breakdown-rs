name: Architecture Checks

permissions:
  contents: read

# Six-layer enforcement:
#   Layer 1: cargo-deny — checks advisories, bans, licenses, and sources
#   Layer 2: rust_arkitect — inspects actual `use` statements for boundary violations
#   Layer 3: no-string-interpolation-sql — forbids dynamic SQL construction in repository adapters
#   Layer 4: cqrs-boundary — ast-grep: write-side code (adapters, sagas) must not query read-model projections
#   Layer 5: test-shim-leak — ast-grep: production api code must not call test-only helpers
#   Layer 6: error-hygiene — ast-grep: no discarded results (`let _ = <call>`), test helpers must be cfg-gated,
#            UUIDv4 generation forbidden (UUIDv7 only), panic/unsafe-family `#[allow]` must carry a justification comment
#   Layer 7: problem-code-registry — every `pub const …: ProblemCode` must be declared through the problem_codes!
#            macro in error_registry.rs (a standalone declaration would compile but never be registered, issue #232)
#   Layer 8: gitleaks — blocks accidental secret commits against 150+ patterns
#   Layer 9: rust-security-ast-grep — ast-grep: no reqwest TLS bypasses
#            (danger_accept_invalid_{certs,hostnames}(true)) and no hardcoded
#            HTTP auth credentials (.basic_auth/.bearer_auth string literals);
#            vendored from coderabbitai/ast-grep-essentials (issue #262)
#
# See backend/AGENTS.md § Testing & Guardrails and § Security
# See backend/docs/architecture/adrs/ADR-017-architecture-testing-strategy.md

on:
  pull_request:
    paths:
      - "backend/crates/**"
      - "backend/Cargo.toml"
      - "backend/Cargo.lock"
      - "backend/deny.toml"
      - "backend/rules/**"
      - "backend/rules/reqwest-no-dangerous-tls.yml"
      - "backend/rules/reqwest-no-hardcoded-auth.yml"
      - "backend/rules-tests/**"
      - "backend/scripts/**"
      - "backend/sgconfig.yml"
      - ".gitleaks.toml"
      - ".github/workflows/architecture-checks.yml"
  workflow_dispatch:

jobs:
  cargo-deny:
    name: cargo-deny (advisories + bans + licenses + sources)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Install and run cargo-deny
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check bans advisories licenses sources
          manifest-path: backend/Cargo.toml

  no-string-interpolation-sql:
    name: No string-interpolated SQL
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Forbid dynamic SQL string construction in repository adapters
        run: |
          set -e
          # grep for format!/string-concat inside sqlx::query/query_as/query_scalar calls
          #   Pattern A: sqlx::query(format!(...)) or sqlx::query(&format!(...))
          #   Pattern B: sqlx::query("..." + ...) — inline string concatenation
          PATTERNS='sqlx::(query|query_as|query_scalar)\s*\(\s*format!|sqlx::(query|query_as|query_scalar)\s*\(&?format|sqlx::(query|query_as|query_scalar)\s*\([^)]*\+'
          DIR=crates/infra/src/queries
          if grep -rnE "$PATTERNS" "$DIR"; then
            echo "" >&2
            echo "ERROR: dynamic SQL string construction detected in $DIR" >&2
            echo "All sqlx::query(...) / query_as(...) / query_scalar(...) calls must use a static" >&2
            echo "&str literal with \$1-style placeholders. Use .bind() for all dynamic values." >&2
            echo "See backend/AGENTS.md § Security for the complete rule." >&2
            exit 1
          fi
          echo "OK: no string-interpolated SQL found in $DIR"

  cqrs-boundary:
    name: CQRS boundary (no read-model queries in write-side)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Read-only job: no authenticated git commands are run after checkout.
          persist-credentials: false

      - name: Install ast-grep 0.45.0 (SHA-pinned)
        run: |
          set -e
          curl -fsSL -o /tmp/ast-grep.zip https://github.com/ast-grep/ast-grep/releases/download/0.45.0/app-x86_64-unknown-linux-gnu.zip
          echo "78931ae35ebac33d9a72b3aecea3e3d62d6e5b0b718ac8bbedfbe69d68421e41  /tmp/ast-grep.zip" | sha256sum -c -
          unzip -q /tmp/ast-grep.zip -d /tmp/ast-grep-install
          sudo mv /tmp/ast-grep-install/ast-grep /usr/local/bin/
          ast-grep --version

      - name: Forbid read-model find_by_id in write-side code (ast-grep)
        run: |
          set -e
          # Write-side code (command adapters, sagas, aggregates) must never
          # resolve audit/derived context (e.g. series_id for EventMetadata)
          # from read-model projections — CQRS-boundary rule (AGENTS.md §1).
          # The API layer (handlers) is the only legitimate consumer.
          #
          # AST-based rule: backend/rules/cqrs-boundary.yml. A non-audit
          # read-model lookup (e.g. the ExpectedVersion concurrency guard in
          # the photo deletion sagas) is permitted only with an explicit
          # `// ast-grep-ignore: cqrs-boundary` suppression on the call line
          # and a justification comment above it.
          # Scan scope = the write-side directories only.
          ast-grep scan -r rules/cqrs-boundary.yml \
            crates/infra/src/event_store \
            crates/infra/src/sagas \
            crates/infra/src/photo/sagas \
            crates/infra/src/ai
          echo "OK: no CQRS-boundary violations found"

  test-shim-leak:
    name: Test-shim leak (no test helpers in production)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Read-only job: no authenticated git commands are run after checkout.
          persist-credentials: false

      - name: Install ast-grep 0.45.0 (SHA-pinned)
        run: |
          set -e
          curl -fsSL -o /tmp/ast-grep.zip https://github.com/ast-grep/ast-grep/releases/download/0.45.0/app-x86_64-unknown-linux-gnu.zip
          echo "78931ae35ebac33d9a72b3aecea3e3d62d6e5b0b718ac8bbedfbe69d68421e41  /tmp/ast-grep.zip" | sha256sum -c -
          unzip -q /tmp/ast-grep.zip -d /tmp/ast-grep-install
          sudo mv /tmp/ast-grep-install/ast-grep /usr/local/bin/
          ast-grep --version

      - name: Forbid test-only helpers in production api code (ast-grep)
        run: |
          set -e
          # Production files under crates/api/src — test modules excluded
          # (*_tests.rs, *_test.rs, test_helpers.rs, any tests/ dir).
          mapfile -t FILES < <(find crates/api/src -name '*.rs' \
            ! -name '*_tests.rs' ! -name '*_test.rs' ! -name 'test_helpers.rs' \
            ! -path '*/tests/*' ! -path '*/test_helpers/*')
          # AST-based rule: backend/rules/test-shim-leak.yml — denies test-only
          # helpers (test_profile / aggressive_*) and any spawn_*_with_config
          # call that does not pass ProjectorFlushConfig::default().
          if [ "${#FILES[@]}" -gt 0 ]; then
            ast-grep scan -r rules/test-shim-leak.yml "${FILES[@]}"
          fi
          echo "OK: no test-only helpers reachable from production api code"

  error-hygiene:
    name: Error hygiene (no discarded results, test helpers cfg-gated)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Read-only job: no authenticated git commands are run after checkout.
          persist-credentials: false

      - name: Install ast-grep 0.45.0 (SHA-pinned)
        run: |
          set -e
          curl -fsSL -o /tmp/ast-grep.zip https://github.com/ast-grep/ast-grep/releases/download/0.45.0/app-x86_64-unknown-linux-gnu.zip
          echo "78931ae35ebac33d9a72b3aecea3e3d62d6e5b0b718ac8bbedfbe69d68421e41  /tmp/ast-grep.zip" | sha256sum -c -
          unzip -q /tmp/ast-grep.zip -d /tmp/ast-grep-install
          sudo mv /tmp/ast-grep-install/ast-grep /usr/local/bin/
          ast-grep --version

      - name: Forbid discarded results, ungated test helpers, UUIDv4, and bare panic/unsafe allows (ast-grep)
        run: |
          set -e
          # Production source files under crates/*/src — test modules excluded
          # (*_tests.rs, *_test.rs, test_helpers.rs, any tests/ dir). Bins are
          # included (they are production code).
          mapfile -t FILES < <(find crates -path '*/src/*' -name '*.rs' \
            ! -name '*_tests.rs' ! -name '*_test.rs' ! -name 'test_helpers.rs' \
            ! -path '*/tests/*' ! -path '*/test_helpers/*')
          # AST-based rules (all share the error-hygiene scan scope):
          #   backend/rules/discard-result.yml — `let _ = <call>` silently
          #     swallows errors (issue #165: delete failures were hidden).
          #   backend/rules/test-helper-gate.yml — *_for_test helpers must be
          #     gated behind #[cfg(feature = "test-support")].
          #   backend/rules/uuid-v7-only.yml — Uuid::new_v4 is forbidden;
          #     every entity/event ID must be a UUIDv7 (now_v7) for index
          #     locality (AGENTS.md §3 — "No UUIDv4").
          #   backend/rules/allow-panic-lint-justification.yml — a panic-family
          #     `#[allow(...)]` (unwrap_used / expect_used / panic /
          #     unsafe_code / todo / …) must carry a trailing `//` justification
          #     comment (AGENTS.md §3 escape-hatch requirement).
          # Intentional cases require an explicit
          # `// ast-grep-ignore: <rule-id>` + justification.
          if [ "${#FILES[@]}" -gt 0 ]; then
            ast-grep scan -r rules/discard-result.yml "${FILES[@]}"
            ast-grep scan -r rules/test-helper-gate.yml "${FILES[@]}"
            ast-grep scan -r rules/uuid-v7-only.yml "${FILES[@]}"
            ast-grep scan -r rules/allow-panic-lint-justification.yml "${FILES[@]}"
          fi
          # UUIDv7-only rule also applies to test files (AGENTS.md §3 —
          # "Strictly use UUIDv7 ... No UUIDv4" applies everywhere).
          mapfile -t TEST_FILES < <(find crates -path '*/tests/*' -name '*.rs' \
            -o -name '*_tests.rs' -o -name '*_test.rs')
          if [ "${#TEST_FILES[@]}" -gt 0 ]; then
            ast-grep scan -r rules/uuid-v7-only.yml "${TEST_FILES[@]}"
          fi
          # UUIDv7-only rule also applies to test_helpers.rs files
          # (same scope rationale as test files).
          mapfile -t HELPER_FILES < <(find crates -type f \( \
            -name 'test_helpers.rs' -o -path '*/test_helpers/*.rs' \) -print)
          if [ "${#HELPER_FILES[@]}" -gt 0 ]; then
            ast-grep scan -r rules/uuid-v7-only.yml "${HELPER_FILES[@]}"
          fi
          # S2 person identifiers (`sub`, `email`) are structurally banned
          # from problem-builder code (ADR-031 D4, issue #230 Tranche 2).
          # Scoped to the problem module — the only place problems are built.
          # Fail closed: the module must exist and the scan must run, so a
          # future relocation of the problem builder cannot silently skip
          # the S2 enforcement.
          test -d crates/api/src/problems
          ast-grep scan -r rules/s2-extension-ban.yml crates/api/src/problems
          echo "OK: no discarded results / ungated test helpers / UUIDv4 / bare panic allows / no S2 extensions found"

  problem-code-registry:
    name: Problem-code registry (every code registered via the macro)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Read-only job: no authenticated git commands are run after checkout.
          persist-credentials: false

      - name: Install ast-grep 0.45.0 (SHA-pinned)
        run: |
          set -e
          curl -fsSL -o /tmp/ast-grep.zip https://github.com/ast-grep/ast-grep/releases/download/0.45.0/app-x86_64-unknown-linux-gnu.zip
          echo "78931ae35ebac33d9a72b3aecea3e3d62d6e5b0b718ac8bbedfbe69d68421e41  /tmp/ast-grep.zip" | sha256sum -c -
          unzip -q /tmp/ast-grep.zip -d /tmp/ast-grep-install
          sudo mv /tmp/ast-grep-install/ast-grep /usr/local/bin/
          ast-grep --version

      - name: Forbid standalone ProblemCode declarations outside the registry macro
        run: |
          set -e
          # Shared, syntax-aware checker (issue #232): every `pub const
          # <NAME>: ProblemCode` must be declared through the problem_codes!
          # macro in crates/core/src/error_registry.rs. A standalone
          # declaration compiles but is never registered (problem_code()
          # returns None, the bundle-coverage lint never fires, the uniqueness
          # test never sees it). The rule (rules/problem-code-registry.yml)
          # matches canonical/spaced/multiline declarations and does not bind
          # to the macro's `pub const $name` template; the script fails closed
          # on scanner errors. The in-tree compile-time count assertion
          # (PROBLEM_CODE_COUNT) is an independent build-time guard.
          bash scripts/check-problem-code-registry.sh crates/
          # The checker itself is guarded by its rule test-suite (fixtures for
          # canonical/spaced/multiline/template/malformed inputs).
          bash scripts/check-problem-code-registry.sh --self-test

  rust-security-ast-grep:
    name: Rust security rules (no TLS bypass, no hardcoded auth)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Read-only job: no authenticated git commands are run after checkout.
          persist-credentials: false

      - name: Install ast-grep 0.45.0 (SHA-pinned)
        run: |
          set -e
          curl -fsSL -o /tmp/ast-grep.zip https://github.com/ast-grep/ast-grep/releases/download/0.45.0/app-x86_64-unknown-linux-gnu.zip
          echo "78931ae35ebac33d9a72b3aecea3e3d62d6e5b0b718ac8bbedfbe69d68421e41  /tmp/ast-grep.zip" | sha256sum -c -
          unzip -q /tmp/ast-grep.zip -d /tmp/ast-grep-install
          sudo mv /tmp/ast-grep-install/ast-grep /usr/local/bin/
          ast-grep --version

      - name: Forbid reqwest TLS bypasses and hardcoded auth credentials (ast-grep)
        run: |
          set -e
          # Production source files under crates/*/src — test modules excluded
          # (*_tests.rs, *_test.rs, test_helpers.rs, any tests/ dir). Bins are
          # included (they are production code). Same scope as error-hygiene.
          mapfile -t FILES < <(find crates -path '*/src/*' -name '*.rs' \
            ! -name '*_tests.rs' ! -name '*_test.rs' ! -name 'test_helpers.rs' \
            ! -path '*/tests/*' ! -path '*/test_helpers/*')
          # AST-based security rules, vendored from coderabbitai/
          # ast-grep-essentials and re-id'd (issue #262):
          #   backend/rules/reqwest-no-dangerous-tls.yml — a reqwest builder
          #     must never disable certificate/hostname verification
          #     (CWE-295); ADR-024 mandates rustls + pinned root CAs.
          #   backend/rules/reqwest-no-hardcoded-auth.yml — .basic_auth /
          #     .bearer_auth must never receive an inline string literal
          #     (CWE-798); complements the gitleaks text scan with structural
          #     AST-level detection.
          # Intentional cases require an explicit
          # `// ast-grep-ignore: <rule-id>` + justification.
          if [ "${#FILES[@]}" -gt 0 ]; then
            ast-grep scan -r rules/reqwest-no-dangerous-tls.yml "${FILES[@]}"
            ast-grep scan -r rules/reqwest-no-hardcoded-auth.yml "${FILES[@]}"
          fi
          echo "OK: no reqwest TLS bypasses / hardcoded auth credentials found"

  gitleaks:
    name: Gitleaks (secrets)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Enables SARIF upload to GitHub code scanning so secret findings
      # surface inline on the PR (Security tab + annotations), replacing the
      # gitleaks-action inline-comment feature we drop below (issue #271).
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Install Gitleaks (SHA-pinned)
        # Pinned binary + checksum (mirrors the repo's ast-grep install
        # discipline, AGENTS.md §4 CI hardening). gitleaks v8.30.1 is the
        # current release; bump via Dependabot alongside the action pins.
        run: |
          set -euo pipefail
          GITLEAKS_VERSION=8.30.1
          GITLEAKS_SHA256=551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          curl -fsSL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo mv /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Detect secrets with Gitleaks (full PR range)
        # gitleaks-action's ScanPullRequest mode only reads the first page
        # (~30 commits) of a PR's commit list (GitHub's default page size),
        # so secrets in later commits of a large PR escape detection
        # (issue #271). We run the gitleaks CLI directly and pass an explicit
        # commit range so the FULL PR is scanned regardless of size. On a PR
        # we scan `main..HEAD` (the PR's commits); on push / schedule /
        # workflow_dispatch we scan the entire git history.
        run: |
          set -euo pipefail
          REPORT="${{ github.workspace }}/gitleaks-report.sarif"
          ARGS=(
            detect
            --source=.
            --config=.gitleaks.toml
            --report-format=sarif
            --report-path="${REPORT}"
            --exit-code=1
            --log-level=info
          )
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin --no-tags main:main
            ARGS+=(--log-opts=main..HEAD)
          fi
          gitleaks "${ARGS[@]}"

      - name: Upload Gitleaks SARIF to code scanning
        # Surface findings inline on the PR (Security tab). Restricted to
        # same-repo PRs and pushes to main where code-scanning upload is
        # permitted; fork PRs still get the hard job failure above.
        if: >-
          always() &&
          (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) ||
          (github.event_name == 'push' && github.ref == 'refs/heads/main')
        uses: github/codeql-action/upload-sarif@6d786de4d6f3531a740e445b53a42b622bbbace8 # v3
        with:
          sarif_file: ${{ github.workspace }}/gitleaks-report.sarif
          category: gitleaks
        continue-on-error: true

  architecture-tests:
    name: rust_arkitect (source-level rules)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          workspaces: "backend"

      - name: Run architecture tests
        run: cargo test -p architecture_tests
