#
# Flutter CI — gates changes under frontend-flutter/**.
# See openspec change `add-flutter-app-foundation` (Task 3) and
# `frontend-flutter/AGENTS.md` §6 "CI quality gates" (decision D8).
#
# Foundation posture (until follow-up changes land):
#  - `dart format` / `flutter analyze` run. `flutter analyze` enforces the
#    standard analyzer/lint rules. The `breakdown_lints` custom rules
#    (no_throw_in_data_domain, discard_result, no_insecure_tls,
#    no_hardcoded_secrets) are enforced via a custom lint runner
#    (`tool/breakdown_lints_runner`), because the `analysis_server_plugin`
#    package only loads in IDE/LSP mode, not in the batch CLI (issue #299).
#  - `gitleaks` IS enforced now (secret hygiene gate).
#  - The OpenAPI-client drift check IS enforced now (regenerates
#    lib/api/generated/ into a throwaway, diffs against the committed tree,
#    fails on difference). `backend/openapi.yaml` is in the `paths:` filters
#    so a backend-only OpenAPI change triggers it.
#  - The coverage gate IS enforced now (`flutter test --coverage` +
#    `coverde` threshold; see job above).
#  - The `coverde` coverage gate and the `flutter test --coverage` step are
#    DEFERRED to the `add-flutter-ci-tests` follow-up (needs broader test/
#    coverage to raise the threshold meaningfully).
#
# CI hardening:
#  - Every third-party action is SHA-pinned (40-char SHA + `# vX` comment),
#    mirroring the backend's CI-hardening rules (AGENTS.md §4 / ADR-notes).
#  - Dependabot (`.github/dependabot.yml`) bumps these SHAs: the existing
#    `github-actions` entry on `directory: /` already covers every workflow
#    file in the repo (including this one), so no dependabot extension is
#    needed for frontend-flutter. A `pub`-ecosystem Dependabot entry is
#    deferred until `scaffold-flutter-project` lands pubspec.yaml.

name: Flutter CI

on:
  push:
    branches: [main]
    paths:
      - "frontend-flutter/**"
      - "backend/openapi.yaml"
      - ".github/workflows/flutter-ci.yml"
      - ".gitleaks.toml"
  pull_request:
    paths:
      - "frontend-flutter/**"
      - "backend/openapi.yaml"
      - ".github/workflows/flutter-ci.yml"
      - ".gitleaks.toml"

permissions:
  contents: read

concurrency:
  group: flutter-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format-and-analyze:
    name: Format & Analyze
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-flutter
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # No later step needs authenticated Git operations; do not leave
          # the GITHUB_TOKEN on disk for plugin/analyzer code to read.
          persist-credentials: false

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true

      # `dart format --set-exit-if-changed` — fails if any tracked Dart source
      # is not formatted. Until the scaffold lands there are no .dart sources,
      # so this no-ops with a notice. `lib/api/generated/**` is rebuild-only
      # (see .pi/skills/flutter-codegen-conventions/) and is excluded.
      - name: dart format (set-exit-if-changed)
        run: |
          set -euo pipefail
          if [ ! -f pubspec.yaml ]; then
            echo "::notice::frontend-flutter has no pubspec.yaml yet (scaffold-flutter-project follow-up not landed); dart format is advisory-only and skipped."
            exit 0
          fi
          SRC="$(find lib test integration_test -name '*.dart' -not -path 'lib/api/generated/*' 2>/dev/null || true)"
          if [ -z "${SRC}" ]; then
            echo "::notice::No hand-written Dart sources to format yet."
            exit 0
          fi
          # shellcheck disable=SC2086 # word-splitting is intentional here
          dart format --set-exit-if-changed ${SRC}

      # `flutter analyze` — enforces the standard analyzer/lint rules.
      # The `breakdown_lints` custom rules are NOT enforced here because the
      # `analysis_server_plugin` package only loads in IDE/LSP mode. They are
      # enforced via the custom lint runner step below (issue #299).
      - name: flutter analyze
        run: |
          set -euo pipefail
          if [ ! -f pubspec.yaml ]; then
            echo "::notice::frontend-flutter has no pubspec.yaml yet (scaffold-flutter-project follow-up not landed); flutter analyze is skipped."
            exit 0
          fi
          flutter pub get
          # `--no-fatal-infos` keeps info-level diagnostics non-fatal.
          flutter analyze --no-fatal-infos

      # Custom lint runner — enforces the four `breakdown_lints` rules
      # (no_throw_in_data_domain, discard_result, no_insecure_tls,
      # no_hardcoded_secrets) using the `analyzer` package directly, because
      # the `analysis_server_plugin` package only loads in IDE/LSP mode and
      # the batch CLI does not load plugins (issue #299).
      - name: breakdown_lints (custom runner)
        run: |
          set -euo pipefail
          if [ ! -f pubspec.yaml ]; then
            echo "::notice::frontend-flutter has no pubspec.yaml yet (scaffold-flutter-project follow-up not landed); breakdown_lints is skipped."
            exit 0
          fi
          cd tool/breakdown_lints_runner
          dart pub get
          dart run bin/run_lints.dart ../..

  gitleaks:
    name: Gitleaks (secrets)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Enables SARIF upload to GitHub code scanning so secret findings
      # surface inline on the PR (Security tab + annotations), replacing the
      # gitleaks-action inline-comment feature we drop below (issue #271).
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Gitleaks (SHA-pinned)
        # Pinned binary + checksum (mirrors the repo's ast-grep install
        # discipline, AGENTS.md §4 CI hardening). gitleaks v8.30.1 is the
        # current release; bump via Dependabot alongside the action pins.
        run: |
          set -euo pipefail
          GITLEAKS_VERSION=8.30.1
          GITLEAKS_SHA256=551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          curl -fsSL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo mv /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version
      - name: Detect secrets with Gitleaks (full PR range)
        # gitleaks-action's ScanPullRequest mode only reads the first page
        # (~30 commits) of a PR's commit list (GitHub's default page size),
        # so secrets in later commits of a large PR escape detection
        # (issue #271). We run the gitleaks CLI directly and pass an explicit
        # commit range so the FULL PR is scanned regardless of size. On a PR
        # we scan `main..HEAD` (the PR's commits); on push / schedule /
        # workflow_dispatch we scan the entire git history.
        #
        # frontend-flutter/** is NOT in the global .gitleaks.toml allowlist
        # (only `frontend/.*` is), so its .dart / .yaml / .arb / .feature
        # files are scanned here. The global config allowlists `.*\.md$`, so
        # Markdown (AGENTS.md + ported skill files) is intentionally NOT
        # scanned by this step — that gap is closed by the scoped
        # `frontend-flutter/.gitleaks.toml` step below (issue #278), which
        # drops the Markdown allowlist and restricts the scan to the
        # frontend-flutter tree.
        run: |
          set -euo pipefail
          REPORT="${{ github.workspace }}/gitleaks-report.sarif"
          ARGS=(
            git
            .
            --config=.gitleaks.toml
            --report-format=sarif
            --report-path="${REPORT}"
            --exit-code=1
            --log-level=info
          )
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin --no-tags main:main
            ARGS+=(--log-opts=main..HEAD)
          fi
          gitleaks "${ARGS[@]}"
      - name: Upload Gitleaks SARIF to code scanning
        # Surface findings inline on the PR (Security tab). Restricted to
        # same-repo PRs and pushes to main where code-scanning upload is
        # permitted; fork PRs still get the hard job failure above.
        if: >-
          always() &&
          (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) ||
          (github.event_name == 'push' && github.ref == 'refs/heads/main')
        uses: github/codeql-action/upload-sarif@6d786de4d6f3531a740e445b53a42b622bbbace8 # v3
        with:
          sarif_file: ${{ github.workspace }}/gitleaks-report.sarif
          category: gitleaks
        continue-on-error: true

      - name: Detect secrets in frontend-flutter Markdown (scoped config)
        # Issue #278: the repo-global .gitleaks.toml allowlists `.*\.md$`, so
        # ported skill .md files and AGENTS.md under frontend-flutter are NOT
        # scanned by the step above. This step uses the scoped config
        # (frontend-flutter/.gitleaks.toml) that drops the Markdown allowlist
        # and restricts the scan to the frontend-flutter tree via the
        # `-- frontend-flutter` git pathspec, so backend docs / skill prose
        # (which rely on the global allowlist) are not reintroduced as false
        # positives. Backend secret coverage remains via the
        # architecture-checks gitleaks job (PR) and the nightly audit job.
        run: |
          set -euo pipefail
          REPORT="${{ github.workspace }}/gitleaks-frontend-flutter.sarif"
          ARGS=(
            git
            .
            --config=frontend-flutter/.gitleaks.toml
            --report-format=sarif
            --report-path="${REPORT}"
            --exit-code=1
            --log-level=info
          )
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin --no-tags main:main
            ARGS+=(--log-opts="main..HEAD -- frontend-flutter")
          else
            ARGS+=(--log-opts="-- frontend-flutter")
          fi
          gitleaks "${ARGS[@]}"
      - name: Upload frontend-flutter Gitleaks SARIF to code scanning
        # Surface findings inline on the PR (Security tab). Restricted to
        # same-repo PRs and pushes to main where code-scanning upload is
        # permitted; fork PRs still get the hard job failure above.
        if: >-
          always() &&
          (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) ||
          (github.event_name == 'push' && github.ref == 'refs/heads/main')
        uses: github/codeql-action/upload-sarif@6d786de4d6f3531a740e445b53a42b622bbbace8 # v3
        with:
          sarif_file: ${{ github.workspace }}/gitleaks-frontend-flutter.sarif
          category: gitleaks-frontend-flutter
        continue-on-error: true

  # OpenAPI-client drift check (issue #301 follow-up / wire-openapi-dart-client
  # task 4). Regenerates lib/api/generated/ from backend/openapi.yaml into a
  # throwaway dir, diffs against the committed tree, fails on any difference.
  # This catches both: (a) a backend OpenAPI change without a client regen, and
  # (b) a hand-edit to lib/api/generated/ (which is rebuild-only). Mirrors the
  # backend's UPDATE_OPENAPI=1 openapi_drift discipline
  # (frontend-flutter/AGENTS.md §3, decision D1/D8).
  openapi-client-drift:
    name: OpenAPI client drift
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-flutter
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true

      - name: Install OpenAPI generator
        # The generator version is pinned in openapitools.json; the npm
        # launcher resolves it. Pinned npm package + generator version keep
        # the generated tree reproducible (AGENTS.md §3).
        run: |
          set -euo pipefail
          npm install -g @openapitools/openapi-generator-cli

      - name: Regenerate client into throwaway
        run: |
          set -euo pipefail
          bash scripts/regen-client.sh

      - name: Diff regenerated tree against committed
        run: |
          set -euo pipefail
          # Move the freshly regenerated tree aside, restore the committed
          # tree, then diff. Any difference means the committed client is out
          # of sync with backend/openapi.yaml (or was hand-edited).
          mv lib/api/generated /tmp/regenerated-client
          git checkout -- lib/api/generated
          if diff -rq /tmp/regenerated-client lib/api/generated; then
            echo "::notice::OpenAPI client is in sync with backend/openapi.yaml."
            exit 0
          fi
          echo "::error::OpenAPI client drift detected. lib/api/generated/ is out of sync with backend/openapi.yaml. Regenerate with 'bash scripts/regen-client.sh' and commit the diff. (Hand-edits to lib/api/generated/ are forbidden — see frontend-flutter/AGENTS.md §3.)"
          # Show a concise diff for the PR annotation.
          diff -ruN lib/api/generated /tmp/regenerated-client || true
          exit 1

  # Coverage gate (decision D5 substitute for the absent Dart mutator —
  # AGENTS.md §6). Runs the full flutter test suite with coverage, then
  # enforces a global line-coverage threshold via coverde. The threshold is
  # intentionally modest for the foundation; it rises as the data/ and
  # feature/ test tiers fill in. coverde is activated per-job (no repo-level
  # dev-dependency) so the version is pinned here.
  coverage:
    name: Coverage (coverde)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-flutter
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true

      - name: Install coverde
        # coverde is the coverage-threshold tool (AGENTS.md §6). Activated
        # per-job and pinned; bump the version alongside the SHA-pinned
        # actions.
        run: |
          set -euo pipefail
          dart pub global activate coverde 0.4.0
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"

      - name: Run full suite with coverage
        run: |
          set -euo pipefail
          flutter pub get
          flutter test --coverage

      - name: Enforce coverage threshold
        run: |
          set -euo pipefail
          # 60% global line coverage — modest for the foundation; rises as
          # the data/ and feature/ test tiers fill in.
          coverde check 60 --file-coverage-log-level overview

# ---------------------------------------------------------------------------
# DEFERRED jobs — NOT wired yet; land with their follow-up changes.
#
#  - openapi-client-drift:
#      ✅ WIRED (see job above). Regenerates lib/api/generated/ from
#      backend/openapi.yaml into a throwaway, diffs against the committed
#      tree, fails on difference. Lands with `wire-openapi-dart-client`
#      (task 4). Mirrors backend `UPDATE_OPENAPI=1 cargo test -p api --test
#      openapi_drift`. See spec `flutter-openapi-client`.
#
#  - test-with-coverage:
#      ✅ WIRED (see job above). `flutter test --coverage` + a `coverde`
#      line-coverage threshold gate (60% for the foundation; rises as the
#      data/ and feature/ test tiers fill in). Lands with
#      `wire-openapi-dart-client` (task 4) +
#      `add-flutter-ci-tests`. See spec `flutter-test-pyramid` /
#      `flutter-ci-coverage`.
#
#  - mutation-testing:
#      Explicitly NOT a gate — no maintained Dart/Flutter mutator exists
#      (documented gap, spec `flutter-test-pyramid`). Do not re-add without a
#      maintained tool wired into CI.
# ---------------------------------------------------------------------------
