name: Release API Image

# ADR-020 D6: the shipped artifact is the `api` Docker image, tagged by Git
# tag of the form `api-vX.Y.Z` (X.Y.Z = the `api` crate version at the
# release commit). Published tags: `api-vX.Y.Z` (immutable, SHA-pinned
# digest), moving `api-vX.Y` (latest patch) and `api-vX` (latest minor).
# Rolling `:latest` is deliberately NOT published. The release owner cuts the
# tag locally via cargo-release (ADR-020 D5); this workflow only builds+pushes.

on:
  push:
    tags:
      - "api-v*"

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    name: Build and push api image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # GitHub expression values are injected via env only (AGENTS.md § CI
      # hardening); the shell computes the tag triple from the ref name.
      - name: Compute image tags (api-vX.Y.Z + moving api-vX.Y / api-vX)
        id: tags
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${REF_NAME#api-v}"
          major="${version%%.*}"
          minor_minor="${version#*.}"
          minor="${minor_minor%%.*}"
          {
            echo "tags<<EOF"
            echo "${REGISTRY}/${IMAGE_NAME}:api-v${version}"
            echo "${REGISTRY}/${IMAGE_NAME}:api-v${major}.${minor}"
            echo "${REGISTRY}/${IMAGE_NAME}:api-v${major}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: backend
          file: backend/Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.tags }}
