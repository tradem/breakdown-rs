# Gitleaks configuration for Breakdown RS
# Prevents false positives and detects real secrets before they land.
# Documentation: https://gitleaks.io/docs/configuration

[extend]
# Use default gitleaks rules as the base (covers 150+ secret patterns)
useDefault = true

# Global allowlist — paths/regexes/keywords that suppress all rule matches
[allowlist]
# Paths to ignore entirely (regex patterns matched against relative path)
paths = [
    # Test files often contain fake secrets
    ".*_test\\.rs$",
    ".*/tests/.*",
    ".*/testdata/.*",
    ".*/fixtures/.*",
    # Documentation and examples
    ".*\\.md$",
    ".*\\.txt$",
    "docs/.*",
    # Build artifacts
    "target/.*",
    # Cargo configuration (internal paths, no secrets)
    "backend/\\.cargo/.*",
    # AST indexing artifacts (binary)
    "\\.ast-bro/.*",
    # Vendored patches (upstream test code)
    "\\.patches/.*",
    # Configuration examples (not actual secrets)
    ".*\\.example\\..*",
    ".*\\.sample\\..*",
    # Dev-only Docker Compose files (placeholders only)
    "docker-compose.*\\.yml",
    # Frontend (separate repo or handled separately)
    "frontend/.*",
]

# Regex patterns to allowlist (false positives)
regexes = [
    # UUIDs (not secrets, just identifiers)
    '''(?i)[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}''',
    # Example/test API keys (obviously fake)
    '''(?i)(test|fake|dummy|example)[-_]?(key|token|secret|password)['"]?\s*[:=]\s*['"]?[a-z0-9+/=]{8,}''',
    # JWTs in tests/examples (they're examples)
    '''(?i)eyJ(exI|hbGc)[a-zA-Z0-9_-]*\\.[a-zA-Z0-9_-]*\\.[a-zA-Z0-9_-]*''',
]

# Keywords to allowlist
keywords = [
    "fake",
    "dummy",
    "example",
    "test",
    "mock",
]

# --- Breakdown-specific rules (change add-android-release-workflow, task 1.3) ---
#
# The Android release keystore material must never enter the tree (spec
# flutter-release-signing). gitleaks' default rules catch PEM private keys,
# but NOT: (a) a base64-wrapped JKS keystore assigned to a signing variable,
# (b) hardcoded signing credentials in gradle/workflow files, or (c) the
# base64 CI-secret form. These rules close that gap in BOTH scan configs
# (this root config scans .github/workflows/**; the scoped
# frontend-flutter/.gitleaks.toml scans frontend-flutter/** — keep the rules
# byte-identical in both files). Values interpolated from GitHub secrets
# (${{ secrets.* }}) do not match (braces/spaces break the character class);
# env-var READS (System.getenv("KEYSTORE_PASSWORD")) do not match either —
# no '=' or ':' directly follows the quoted variable name.
[[rules]]
id = "breakdown-signing-credential"
description = "Hardcoded Android release signing credential (quoted literal: keystore/key password, alias, or base64 keystore assignment)"
regex = '''(?i)(keystore[_-]?base64|keystore[_-]?password|key[_-]?password|store[_-]?password|key[_-]?alias)['"]?\s*[:=]\s*['"][A-Za-z0-9+/=_-]{8,}['"]'''
paths = '''(frontend-flutter/.*|.github/workflows/.*)'''
tags = ["breakdown", "android-signing"]

[[rules]]
id = "breakdown-signing-credential-unquoted-yaml"
description = "Unquoted hardcoded Android signing credential in YAML/colon style (workflow env blocks, compose)"
regex = '''(?i)(keystore[_-]?password|key[_-]?password|store[_-]?password|key[_-]?alias)['"]?\s*:\s*[A-Za-z0-9+/=_-]{8,}'''
paths = '''(frontend-flutter/.*|.github/workflows/.*)'''
tags = ["breakdown", "android-signing"]
[[rules]]
id = "breakdown-signing-key-alias"
description = "Hardcoded Android signing key alias (any length — aliases can be short)"
regex = '''(?i)key[_-]?alias['"]?\s*[:=]\s*['"][A-Za-z0-9+/=_-]{1,}['"]'''
paths = '''(frontend-flutter/.*|.github/workflows/.*)'''
tags = ["breakdown", "android-signing"]


[[rules]]
id = "breakdown-signing-key-alias-unquoted-yaml"
description = "Unquoted hardcoded Android signing key alias in YAML/colon style"
regex = '''(?i)key[_-]?alias['"]?\s*:\s*[A-Za-z0-9+/=_-]{1,}'''
paths = '''(frontend-flutter/.*|.github/workflows/.*)'''
tags = ["breakdown", "android-signing"]

[[rules]]
id = "breakdown-keystore-base64-blob"
description = "Base64-encoded Android keystore blob assigned to a signing variable (JKS material is binary, so only the encoded form is scannable)"
regex = '''(?i)keystore_base64['"]?\s*[:=]\s*['"]?[A-Za-z0-9+/]{200,}={0,2}'''
tags = ["breakdown", "android-signing"]
